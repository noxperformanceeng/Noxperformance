<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatórios do RH · NOX ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css?v=202610270902">
<style>
  .cab-tela .acoes-cab { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .cab-tela input[type=month], .cab-tela select { padding: 6px 8px; }
  .rel td.num, .rel th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rel th.ev { font-size: 11px; line-height: 1.2; min-width: 78px; }
  .rel th.ev small { display: block; color: var(--texto-suave); font-weight: 400; }
  .rel tr.total td { font-weight: 700; border-top: 2px solid var(--linha); }
  .rel td.nome { white-space: nowrap; }
  .rel td.nome small { display: block; color: var(--texto-suave); font-size: 11px; }
  .rel .sep { border-left: 2px solid var(--linha); }
  .rel .desc { color: var(--erro); }
  .rel .liq { background: color-mix(in srgb, #2e9e5b 9%, transparent); }
  .mudou { background: color-mix(in srgb, #f5a623 20%, transparent); }
  .novo { background: color-mix(in srgb, #2e9e5b 16%, transparent); }
  .saiu { background: color-mix(in srgb, var(--erro) 12%, transparent); }
  .resumo-topo { display: flex; gap: 18px; flex-wrap: wrap; margin: 4px 0 10px; font-size: 13px; }
  .resumo-topo b { font-variant-numeric: tabular-nums; }
  .legenda { font-size: 12px; color: var(--texto-suave); margin: 6px 0 0; }
  .legenda span { padding: 1px 6px; border-radius: 3px; margin-right: 6px; }
</style>
</head>
<body data-modulo="rh_relatorios" data-titulo="Relatórios do RH" data-empresa="sim">
<main id="conteudo"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../assets/js/supabase.js?v=202610270902"></script>
<script src="../../assets/js/ui.js?v=202610270902"></script>
<script src="../../assets/js/auth.js?v=202610270902"></script>
<script src="../../assets/js/layout.js?v=202610270902"></script>
<script src="../../assets/js/cadastro.js?v=202610270902"></script>
<script src="../../assets/js/rh.js?v=202610270902"></script>
<script>
/* =====================================================================
   Relatórios do RH — tudo vem da tela Lançamentos (que recebe adiantamento, férias, VT, 13º,
   faltas e ponto pelas telas próprias).
   1) Resumo da folha: uma coluna por evento, total de proventos, descontos, líquido e o líquido
      do 5º dia útil (férias e 13º são pagos à parte, por isso saem do 5º dia útil).
   2) Mês anterior × atual: o que mudou por colaborador e evento.
   3) Histórico do colaborador: valores dos últimos 12 meses, evento a evento.
   ===================================================================== */
let CTX, COMP = lerCompetencia(), visao = 'resumo', DADOS = { atual: [], anterior: [] }, HIST = [];
const PAGO_A_PARTE = ['ferias', 'decimo_terceiro'];          // telas com pagamento próprio (fora do 5º dia útil)

(async () => {
  CTX = await iniciarTela(); if (!CTX) return;
  document.getElementById('conteudo').innerHTML = `
    <div class="cab-tela"><div><h1>Relatórios do RH</h1><p class="sub">Tudo calculado a partir da tela Lançamentos da competência.</p></div>
      <div class="acoes-cab"><input type="month" id="comp" title="Competência"><select id="func" hidden></select></div></div>
    <div class="barra-ferr">
      <div class="abas" id="abas"><button class="aba ativa" data-v="resumo">Resumo da folha</button><button class="aba" data-v="compara">Mês anterior × atual</button><button class="aba" data-v="historico">Histórico do colaborador</button></div>
      <div class="ferr"><input id="busca" class="busca" type="search" placeholder="Buscar colaborador…"><label id="soMud" style="font-size:13px;display:none;gap:4px;align-items:center"><input type="checkbox" id="soMudCk" checked> só o que mudou</label><div id="rel"></div></div>
    </div>
    <div id="topo"></div>
    <div class="cartao tabela-rolagem"><table class="rel" id="tab"></table></div>
    <p class="legenda" id="leg"></p>`;
  await Promise.all([carregarFuncionarios(), carregarEventos()]);
  const c = document.getElementById('comp'); c.value = COMP;
  c.onchange = () => { COMP = c.value; gravarCompetencia(COMP); carregar(); };
  document.querySelectorAll('#abas .aba').forEach(b => b.onclick = () => {
    document.querySelectorAll('#abas .aba').forEach(x => x.classList.toggle('ativa', x === b)); visao = b.dataset.v; carregar(); });
  document.getElementById('busca').oninput = desenhar;
  document.getElementById('soMudCk').onchange = desenhar;
  document.getElementById('func').onchange = carregar;
  window.addEventListener('empresa', () => { CTX.empresa = lerEmpresa(); carregar(); });
  botoesRelatorio('rel', exportar);
  carregar();
})();

const lancs = (de, ate) => buscarTodos(() => {
  let q = db.from('rh_lancamentos').select('funcionario_id, empresa_id, competencia, evento_id, referencia, valor, origem').gte('competencia', de + '-01').lte('competencia', ate + '-01');
  if (CTX.empresa) q = q.eq('empresa_id', CTX.empresa);
  return q;
});

async function carregar() {
  document.getElementById('func').hidden = visao !== 'historico';
  document.getElementById('soMud').style.display = visao === 'compara' ? 'flex' : 'none';
  document.getElementById('busca').hidden = visao === 'historico';
  if (visao === 'historico') {
    const s = document.getElementById('func');
    if (!s.options.length) {
      s.innerHTML = FUNCS.filter(f => !CTX.empresa || f.empresa_id === CTX.empresa)
        .map(f => `<option value="${f.id}">${esc(f.nome)}${f.situacao === 'desligado' ? ' (desligado)' : ''}</option>`).join('');
    }
    HIST = (await lancs(somaMes(COMP, -11), COMP)).filter(l => l.funcionario_id === +s.value);
  } else {
    const todos = await lancs(somaMes(COMP, -1), COMP);
    DADOS.atual = todos.filter(l => l.competencia.slice(0, 7) === COMP);
    DADOS.anterior = todos.filter(l => l.competencia.slice(0, 7) === somaMes(COMP, -1));
  }
  desenhar();
}

// soma por colaborador e evento → { fid: { evento_id: {valor, ref} } }
function agrupar(lista) {
  const g = {};
  lista.forEach(l => { const e = (g[l.funcionario_id] ||= {}), x = (e[l.evento_id] ||= { valor: 0, ref: 0, origem: l.origem });
    x.valor += Number(l.valor); x.ref += Number(l.referencia || 0); });
  return g;
}
const tipoEv = id => evento(id)?.tipo;
function totais(eventos) {
  let prov = 0, desc = 0, parte = 0;
  Object.entries(eventos || {}).forEach(([id, x]) => {
    const t = tipoEv(id), s = t === 'provento' ? 1 : t === 'desconto' ? -1 : 0;
    if (s > 0) prov += x.valor; if (s < 0) desc += x.valor;
    if (PAGO_A_PARTE.includes(x.origem)) parte += s * x.valor;
  });
  return { prov, desc, liq: prov - desc, parte, quinto: prov - desc - parte };
}
const ordemEv = (a, b) => { const ea = evento(a), eb = evento(b);
  return (ea?.tipo === 'provento' ? 0 : ea?.tipo === 'desconto' ? 1 : 2) - (eb?.tipo === 'provento' ? 0 : eb?.tipo === 'desconto' ? 1 : 2) || (ea?.ordem || 0) - (eb?.ordem || 0); };
const cabEv = id => { const e = evento(id); return `<th class="num ev${e?.tipo === 'desconto' ? ' desc' : ''}">${esc(e?.descricao || id)}<small>${esc(e?.codigo || '')}${e?.natureza === 'nao_contabil' ? ' · não contábil' : ''}</small></th>`; };
const nomeF = fid => funcionario(fid)?.nome || '#' + fid;
const filtroBusca = fid => combinaBusca([nomeF(fid), funcionario(fid)?.matricula, funcionario(fid)?.setor].join(' '), document.getElementById('busca').value);

// 5º dia útil do mês seguinte (segunda a sábado, sem feriados nacionais fixos)
function quintoDiaUtil(comp) {
  const m = somaMes(comp, 1), fixos = ['01-01', '04-21', '05-01', '09-07', '10-12', '11-02', '11-15', '11-20', '12-25'];
  let n = 0;
  for (let d = 1; d <= 31; d++) {
    const iso = `${m}-${String(d).padStart(2, '0')}`, w = new Date(iso + 'T12:00:00Z').getUTCDay();
    if (w !== 0 && !fixos.includes(iso.slice(5))) n++;
    if (n === 5) return iso;
  }
}

let EXPORT = { colunas: [], linhas: [] };
function desenhar() {
  const tab = document.getElementById('tab'), topo = document.getElementById('topo'), leg = document.getElementById('leg');
  leg.innerHTML = '';
  if (visao === 'resumo') {
    const g = agrupar(DADOS.atual), evs = [...new Set(DADOS.atual.map(l => l.evento_id))].sort(ordemEv);
    const fids = Object.keys(g).filter(filtroBusca).sort((a, b) => nomeF(a).localeCompare(nomeF(b)));
    const soma = { ev: {}, prov: 0, desc: 0, liq: 0, parte: 0, quinto: 0 };
    const linhas = fids.map(fid => { const t = totais(g[fid]);
      ['prov', 'desc', 'liq', 'parte', 'quinto'].forEach(k => soma[k] += t[k]);
      evs.forEach(e => soma.ev[e] = (soma.ev[e] || 0) + (g[fid][e]?.valor || 0));
      return { fid, t }; });
    const qdu = quintoDiaUtil(COMP);
    topo.innerHTML = `<div class="resumo-topo"><span>Competência <b>${mesBR(COMP)}</b></span><span>${fids.length} colaborador(es)</span>
      <span>Proventos <b>${reais(soma.prov)}</b></span><span>Descontos <b>${reais(soma.desc)}</b></span><span>Líquido <b>${reais(soma.liq)}</b></span>
      <span>Pago à parte (férias/13º) <b>${reais(soma.parte)}</b></span><span>5º dia útil (${dataBR(qdu + 'T12:00:00')}) <b>${reais(soma.quinto)}</b></span></div>`;
    tab.innerHTML = `<thead><tr><th>Colaborador</th>${evs.map(cabEv).join('')}<th class="num sep">Total proventos</th><th class="num desc">Total descontos</th><th class="num">Líquido</th><th class="num">Pago à parte</th><th class="num liq">Líquido 5º dia útil</th></tr></thead>
      <tbody>${linhas.map(({ fid, t }) => `<tr><td class="nome">${esc(nomeF(fid))}<small>${esc(funcionario(fid)?.cargo || '')}</small></td>
        ${evs.map(e => `<td class="num${tipoEv(e) === 'desconto' ? ' desc' : ''}">${g[fid][e] ? num2(g[fid][e].valor) : ''}</td>`).join('')}
        <td class="num sep">${num2(t.prov)}</td><td class="num desc">${num2(t.desc)}</td><td class="num">${num2(t.liq)}</td><td class="num">${t.parte ? num2(t.parte) : ''}</td><td class="num liq"><b>${num2(t.quinto)}</b></td></tr>`).join('')
        || `<tr><td colspan="${evs.length + 6}" class="vazio">Nenhum lançamento em ${mesBR(COMP)}.</td></tr>`}
      ${linhas.length ? `<tr class="total"><td>Total</td>${evs.map(e => `<td class="num">${num2(soma.ev[e])}</td>`).join('')}<td class="num sep">${num2(soma.prov)}</td><td class="num desc">${num2(soma.desc)}</td><td class="num">${num2(soma.liq)}</td><td class="num">${num2(soma.parte)}</td><td class="num liq">${num2(soma.quinto)}</td></tr>` : ''}</tbody>`;
    leg.textContent = 'Líquido 5º dia útil = proventos − descontos, sem férias e 13º (pagos à parte pelas telas próprias). O adiantamento já pago entra como desconto (981). Contábil e não contábil somados.';
    EXPORT = { arquivo: 'resumo_folha_' + COMP, colunas: ['Colaborador', ...evs.map(e => `${evento(e)?.codigo} ${evento(e)?.descricao}`), 'Total proventos', 'Total descontos', 'Líquido', 'Pago à parte', 'Líquido 5º dia útil'],
      linhas: linhas.map(({ fid, t }) => [nomeF(fid), ...evs.map(e => num2(g[fid][e]?.valor || 0)), num2(t.prov), num2(t.desc), num2(t.liq), num2(t.parte), num2(t.quinto)]) };
  } else if (visao === 'compara') {
    const ga = agrupar(DADOS.anterior), gb = agrupar(DADOS.atual), so = document.getElementById('soMudCk').checked;
    const fids = [...new Set([...Object.keys(ga), ...Object.keys(gb)])].filter(filtroBusca).sort((a, b) => nomeF(a).localeCompare(nomeF(b)));
    const ant = somaMes(COMP, -1); let html = '', nMud = 0; const exp = [];
    fids.forEach(fid => {
      const evs = [...new Set([...Object.keys(ga[fid] || {}), ...Object.keys(gb[fid] || {})])].sort(ordemEv);
      const ls = evs.map(e => { const a = ga[fid]?.[e]?.valor, b = gb[fid]?.[e]?.valor;
        const cls = a == null ? 'novo' : b == null ? 'saiu' : Math.abs(a - b) > 0.005 ? 'mudou' : ''; return { e, a, b, cls }; });
      const mud = ls.filter(l => l.cls);
      const ta = totais(ga[fid]), tb = totais(gb[fid]);
      if (so && !mud.length) return;
      nMud += mud.length ? 1 : 0;
      html += `<tr><td class="nome" colspan="5" style="padding-top:12px"><b>${esc(nomeF(fid))}</b><small>${esc(funcionario(fid)?.cargo || '')}${!ga[fid] ? ' · sem lançamentos em ' + mesBR(ant) : ''}${!gb[fid] ? ' · sem lançamentos em ' + mesBR(COMP) : ''}</small></td></tr>`;
      (so ? mud : ls).forEach(l => { const ev = evento(l.e);
        html += `<tr class="${l.cls}"><td style="padding-left:22px">${esc(ev?.codigo || '')} · ${esc(ev?.descricao || '')}</td><td>${ev?.tipo === 'desconto' ? 'desconto' : ev?.tipo === 'provento' ? 'provento' : ''}</td>
          <td class="num">${l.a != null ? num2(l.a) : '—'}</td><td class="num">${l.b != null ? num2(l.b) : '—'}</td><td class="num">${num2((l.b || 0) - (l.a || 0))}</td></tr>`;
        exp.push([nomeF(fid), `${ev?.codigo} ${ev?.descricao}`, ev?.tipo, num2(l.a || 0), num2(l.b || 0), num2((l.b || 0) - (l.a || 0))]); });
      html += `<tr class="total"><td style="padding-left:22px">Líquido 5º dia útil</td><td></td><td class="num">${num2(ta.quinto)}</td><td class="num">${num2(tb.quinto)}</td><td class="num">${num2(tb.quinto - ta.quinto)}</td></tr>`;
      exp.push([nomeF(fid), 'Líquido 5º dia útil', '', num2(ta.quinto), num2(tb.quinto), num2(tb.quinto - ta.quinto)]);
    });
    const sa = Object.values(ga).reduce((s, e) => s + totais(e).quinto, 0), sb = Object.values(gb).reduce((s, e) => s + totais(e).quinto, 0);
    topo.innerHTML = `<div class="resumo-topo"><span><b>${mesBR(ant)}</b> × <b>${mesBR(COMP)}</b></span><span>${nMud} colaborador(es) com alteração</span>
      <span>Líquido 5º dia útil: <b>${reais(sa)}</b> → <b>${reais(sb)}</b> (${sb - sa >= 0 ? '+' : ''}${reais(sb - sa)})</span></div>`;
    tab.innerHTML = `<thead><tr><th>Evento</th><th>Tipo</th><th class="num">${mesBR(ant)}</th><th class="num">${mesBR(COMP)}</th><th class="num">Diferença</th></tr></thead><tbody>${html || '<tr><td colspan="5" class="vazio">Nada mudou entre os dois meses.</td></tr>'}</tbody>`;
    leg.innerHTML = '<span class="novo">novo no mês</span><span class="mudou">valor mudou</span><span class="saiu">não veio neste mês</span>';
    EXPORT = { arquivo: `comparativo_folha_${ant}_${COMP}`, colunas: ['Colaborador', 'Evento', 'Tipo', mesBR(ant), mesBR(COMP), 'Diferença'], linhas: exp };
  } else {
    const fid = +document.getElementById('func').value, meses = [...Array(12)].map((_, i) => somaMes(COMP, i - 11));
    const g = {}; HIST.forEach(l => { const m = l.competencia.slice(0, 7); ((g[l.evento_id] ||= {})[m] ||= 0); g[l.evento_id][m] += Number(l.valor); });
    const evs = Object.keys(g).sort(ordemEv);
    const porMes = meses.map(m => { const e = {}; HIST.filter(l => l.competencia.slice(0, 7) === m).forEach(l => { const x = (e[l.evento_id] ||= { valor: 0, origem: l.origem }); x.valor += Number(l.valor); }); return totais(e); });
    const f = funcionario(fid);
    topo.innerHTML = f ? `<div class="resumo-topo"><span><b>${esc(f.nome)}</b></span><span>${esc(f.cargo || '')}</span><span>Admissão ${f.data_admissao ? dataBR(f.data_admissao + 'T12:00:00') : '—'}</span><span>Salário base atual <b>${reais(f.salario_base)}</b></span></div>` : '';
    tab.innerHTML = `<thead><tr><th>Evento</th>${meses.map(m => `<th class="num">${mesBR(m)}</th>`).join('')}</tr></thead><tbody>
      ${evs.map(e => { const ev = evento(e); let prev;
        return `<tr><td>${esc(ev?.codigo || '')} · ${esc(ev?.descricao || '')}</td>${meses.map(m => { const v = g[e][m];
          const cls = prev !== undefined && v !== undefined && Math.abs(v - prev) > 0.005 ? ' mudou' : ''; if (v !== undefined) prev = v;
          return `<td class="num${cls}${ev?.tipo === 'desconto' ? ' desc' : ''}">${v !== undefined ? num2(v) : ''}</td>`; }).join('')}</tr>`; }).join('')
        || `<tr><td colspan="13" class="vazio">Sem lançamentos nos últimos 12 meses.</td></tr>`}
      ${evs.length ? `<tr class="total"><td>Líquido 5º dia útil</td>${porMes.map(t => `<td class="num liq">${t.prov || t.desc ? num2(t.quinto) : ''}</td>`).join('')}</tr>` : ''}</tbody>`;
    leg.innerHTML = '<span class="mudou">valor diferente do mês anterior com lançamento</span>';
    EXPORT = { arquivo: 'historico_' + (f?.nome || fid).replace(/\s+/g, '_'), colunas: ['Evento', ...meses.map(mesBR)],
      linhas: [...evs.map(e => [`${evento(e)?.codigo} ${evento(e)?.descricao}`, ...meses.map(m => g[e][m] !== undefined ? num2(g[e][m]) : '')]),
               ['Líquido 5º dia útil', ...porMes.map(t => num2(t.quinto))]] };
  }
}
const exportar = () => EXPORT;
</script>
</body>
</html>
