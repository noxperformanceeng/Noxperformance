<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contas a pagar · NOX ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css?v=202611132002">
<style>
  .sub-ed table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .sub-ed th { text-align: left; font-size: 11.5px; color: var(--texto-suave); font-weight: 500; padding: 0 4px 4px; }
  .sub-ed td { padding: 3px 4px; border: 0; }
  .sub-ed input, .sub-ed select { padding: 6px 8px; font-size: 13px; }
  .sub-ed .rm { background: none; border: 0; color: var(--erro); cursor: pointer; font-size: 16px; }
  .sub-ed .soma { font-size: 12px; margin-top: 6px; color: var(--texto-suave); }
  .sub-ed .soma.erro { color: var(--erro); font-weight: 600; }
  .pg-form { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px 10px; margin-top: 8px; padding: 10px; border: 1px solid var(--linha); border-radius: 8px; }
  .pg-form label { font-size: 11px; margin-bottom: 2px; }
  .pg-form .l2 { grid-column: span 2; }
  .pg-form .acao { display: flex; align-items: flex-end; }
  .mini-modal .grade { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin: 12px 0; }
  tr.estornado td { text-decoration: line-through; color: var(--texto-suave); }
  /* Botões de situação (contagem e total) e período rápido — lista única */
  .situ-bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 2px 0 10px; }
  .situ { border: 1px solid var(--linha); background: var(--superficie); border-radius: 10px; padding: 8px 14px; min-width: 128px; text-align: left; cursor: pointer; font: 500 12.5px var(--fonte); color: var(--texto-suave); }
  .situ b { display: block; font-size: 15px; font-weight: 600; color: var(--texto); margin-top: 2px; white-space: nowrap; }
  .situ small { font-weight: 400; font-size: 11.5px; }
  .situ:hover { border-color: #c9ccd2; }
  .situ.ativa { border-color: var(--destaque); box-shadow: 0 0 0 1px var(--destaque); color: var(--texto); }
  .situ.vermelho b { color: var(--erro); } .situ.laranja b { color: var(--alerta); } .situ.verde b { color: var(--ok); }
  .situ.zero { opacity: .5; }
  .periodo-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 0 0 10px; font-size: 12.5px; color: var(--texto-suave); }
  .periodo-bar select { width: auto; padding: 4px 8px; font-size: 12.5px; }
  .chip { border: 1px solid var(--linha); background: var(--superficie); border-radius: 20px; padding: 4px 12px; font: 500 12.5px var(--fonte); color: var(--texto); cursor: pointer; white-space: nowrap; }
  .chip:hover { border-color: #c9ccd2; }
  .chip.ativa { background: var(--destaque-suave); border-color: var(--destaque); color: var(--destaque-texto); }
  .chip.seta { padding: 4px 9px; }
  /* Parcelamento no lançamento */
  .parc { border: 1px solid var(--linha); border-radius: 10px; padding: 12px; background: #fafbfc; }
  .parc .opcoes { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 4px; }
  .parc .grade-campos { margin-top: 8px; }
  .parc table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  .parc th { font-size: 11.5px; padding: 0 6px 4px; }
  .parc td { padding: 3px 6px; border: 0; }
  .parc td input { padding: 6px 8px; font-size: 13px; }
  .parc .soma { font-size: 12px; margin-top: 6px; color: var(--texto-suave); }
  .parc .soma.erro { color: var(--erro); font-weight: 600; }
  .parc[hidden] { display: none; }
</style>
</head>
<body data-modulo="pagar" data-titulo="Contas a pagar" data-empresa="sim">
<main id="conteudo"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../assets/js/supabase.js?v=202611132002"></script>
<script src="../../assets/js/ui.js?v=202611132002"></script>
<script src="../../assets/js/auth.js?v=202611132002"></script>
<script src="../../assets/js/layout.js?v=202611132002"></script>
<script src="../../assets/js/cadastro.js?v=202611132002"></script>
<script src="../../assets/js/comprovante.js?v=202611132002"></script>
<script>
/* =====================================================================
   Contas a pagar
   - Títulos por empresa (CNPJ); o seletor de empresa no menu filtra (ou consolida).
   - Compra de produto entra pela NF/pedido de compra; aqui, manualmente, só despesas.
   - Pagamento = registro de baixa (parcial ou total). Saldo e situação o banco calcula.
   - Título + rateio por categoria são gravados juntos (função salvar_titulo_pagar).
   ===================================================================== */
const SIT = [{ v: 'aberto', n: 'Aberto' }, { v: 'programado', n: 'Programado' }, { v: 'parcial', n: 'Pago parcial' }, { v: 'pago', n: 'Pago' }, { v: 'cancelado', n: 'Cancelado' }];
const ORIGENS = [{ v: 'manual', n: 'Manual (despesa)' }, { v: 'recorrente', n: 'Recorrente' }, { v: 'nf_entrada', n: 'NF de entrada' },
  { v: 'pedido_compra', n: 'Pedido de compra' }, { v: 'importacao', n: 'Importado do Tiny' }, { v: 'rh', n: 'RH (folha)' }];
const ABERTOS = ['aberto', 'programado', 'parcial'];
const hoje = () => new Date().toLocaleDateString('sv-SE');
const somaDias = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toLocaleDateString('sv-SE'); };
const reais = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
// Data prevista = programada para pagar, senão o vencimento
const prevista = r => r.data_programada || r.data_vencimento;
const dias = r => Math.round((Date.parse(prevista(r) + 'T12:00:00') - Date.parse(hoje() + 'T12:00:00')) / 864e5);
// Prazo (aging) — faixas pela data prevista
const FAIXAS = [
  { v: 'vencido', n: 'Vencido', t: d => d < 0 }, { v: 'hoje', n: 'Hoje', t: d => d === 0 }, { v: 'amanha', n: 'Amanhã', t: d => d === 1 },
  { v: '3', n: 'Em 2 a 3 dias', t: d => d >= 2 && d <= 3 }, { v: '7', n: 'Em 4 a 7 dias', t: d => d >= 4 && d <= 7 },
  { v: '10', n: 'Em 8 a 10 dias', t: d => d >= 8 && d <= 10 }, { v: '30', n: 'Em 11 a 30 dias', t: d => d >= 11 && d <= 30 },
  { v: 'mais', n: 'Mais de 30 dias', t: d => d > 30 }];
const faixa = r => ABERTOS.includes(r.situacao) ? FAIXAS.find(f => f.t(dias(r))).v : r.situacao;
const textoPrazo = r => { if (r.situacao === 'pago') return 'pago'; if (r.situacao === 'cancelado') return 'cancelado';
  const d = dias(r); return d < 0 ? `vencido há ${-d} dia${d === -1 ? '' : 's'}` : d === 0 ? 'hoje' : d === 1 ? 'amanhã' : `em ${d} dias`; };
const vencido = r => ABERTOS.includes(r.situacao) && dias(r) < 0;
let ACOES = new Set();   // ações liberadas para quem está usando (estornar, cancelar…)

let LINHAS = [], APELIDOS = [], FORN = [], CATS = [], CONTAS = [], FORMAS = [], EMPRESAS = [], modalAtual = null, extraAtual = {};
const cat = id => CATS.find(c => c.id === id);
const conta = id => CONTAS.find(c => c.id === id);
const forma = id => FORMAS.find(f => f.id === id);

/* ---------- Rateio (várias categorias no mesmo título) ---------- */
const optCats = sel => '<option value="">— categoria —</option>' + CATS.filter(c => c.ativo || c.id === sel)
  .map(c => `<option value="${c.id}"${c.id === sel ? ' selected' : ''}>${esc(c.codigo + ' ' + c.nome)}</option>`).join('');
const linhaRateio = (x = {}) => `<tr><td><select data-k="categoria_financeira_id">${optCats(x.categoria_financeira_id)}</select></td>
  <td style="width:150px"><input data-k="valor" inputmode="decimal" value="${x.valor != null ? Number(x.valor).toLocaleString('pt-BR', { minimumFractionDigits: 2 }) : ''}"></td>
  <td style="width:28px"><button type="button" class="rm" title="Remover">×</button></td></tr>`;
function lerRateio() {
  return [...(modalAtual?.querySelectorAll('#rateio tbody tr') || [])]
    .map(tr => ({ categoria_financeira_id: Number(tr.querySelector('[data-k=categoria_financeira_id]').value) || null, valor: lerNumero(tr.querySelector('[data-k=valor]').value) }))
    .filter(x => x.categoria_financeira_id || x.valor);
}
function conferirRateio() {
  const el = modalAtual?.querySelector('#rateioSoma'); if (!el) return;
  const linhas = lerRateio(), soma = linhas.reduce((s, x) => s + (x.valor || 0), 0), valor = lerNumero(modalAtual.querySelector('#f_valor').value) || 0;
  el.textContent = linhas.length ? `Soma das categorias: ${reais(soma)} de ${reais(valor)}${Math.abs(soma - valor) > 0.005 ? ` · falta ${reais(valor - soma)}` : ' · fechado'}` : 'O título vai inteiro para a categoria escolhida acima.';
  el.classList.toggle('erro', linhas.length > 0 && Math.abs(soma - valor) > 0.005);
}

/* ---------- Parcelamento (só no lançamento novo) ----------
   Gera N títulos ligados pelo mesmo grupo_parcelas. Emissão: fixa (a da nota, igual para todas)
   ou igual ao vencimento de cada parcela. Vencimentos mensais (mesmo dia) ou a cada X dias.
   O rateio por categoria é dividido proporcionalmente em cada parcela. */
let PARC = [];
const parcelado = () => !!modalAtual?.querySelector('#pcSim')?.checked;
const emissaoFixa = () => modalAtual?.querySelector('input[name=pcEm]:checked')?.value !== 'venc';
const centavos = v => Math.round((Number(v) || 0) * 100);
function somaMeses(iso, k) {
  const [a, m, d] = iso.split('-').map(Number), alvo = new Date(a, m - 1 + k, 1), ult = new Date(alvo.getFullYear(), alvo.getMonth() + 1, 0).getDate();
  return new Date(alvo.getFullYear(), alvo.getMonth(), Math.min(d, ult)).toLocaleDateString('sv-SE');
}
function gerarParcelas() {
  const q = s => modalAtual.querySelector(s), n = Math.min(Math.max(parseInt(q('#pcN').value) || 0, 0), 120);
  const v1 = q('#f_data_vencimento').value, valor = lerNumero(q('#f_valor').value) || 0, cada = q('#pcModo').value === 'cada';
  const intervalo = q('#pcInt').value, passo = parseInt(q('#pcDias').value) || 30;
  q('#pcDias').closest('.campo').style.visibility = intervalo === 'dias' ? '' : 'hidden';
  const tot = cada ? centavos(valor) * n : centavos(valor), base = n ? Math.floor(tot / n) : 0;
  PARC = Array.from({ length: n }, (_, i) => ({
    venc: v1 ? (intervalo === 'mensal' ? somaMeses(v1, i) : somaDias(v1, i * passo)) : '',
    valor: (cada ? centavos(valor) : base + (i === n - 1 ? tot - base * n : 0)) / 100 }));   // diferença de centavos na última
  desenharParcelas();
}
function desenharParcelas() {
  const q = s => modalAtual.querySelector(s), fixa = emissaoFixa(), em = q('#f_data_emissao');
  if (PARC[0]?.venc) q('#f_data_vencimento').value = PARC[0].venc;
  // emissão = vencimento: guarda a emissão digitada para voltar se trocar para "fixa"
  if (!fixa) { if (em.dataset.fixa === undefined) em.dataset.fixa = em.value; if (PARC[0]?.venc) em.value = PARC[0].venc; } else restaurarEmissao();
  em.readOnly = !fixa;
  q('#pcLista').innerHTML = PARC.map((p, i) => `<tr><td>${i + 1}/${PARC.length}</td>
    <td class="sub">${dataCurta(fixa ? em.value : p.venc) || '—'}</td>
    <td style="width:170px"><input type="date" data-pv="${i}" value="${p.venc}"></td>
    <td style="width:150px"><input data-pval="${i}" inputmode="decimal" value="${p.valor.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}"></td></tr>`).join('');
  somarParcelas();
}
function restaurarEmissao() { const em = modalAtual.querySelector('#f_data_emissao'); if (em.dataset.fixa !== undefined) { em.value = em.dataset.fixa; delete em.dataset.fixa; } }
function somarParcelas() {
  const q = s => modalAtual.querySelector(s), el = q('#pcSoma'), soma = PARC.reduce((s, p) => s + centavos(p.valor), 0) / 100;
  const total = q('#pcModo').value === 'total' ? lerNumero(q('#f_valor').value) || 0 : null;
  const dif = total != null && Math.abs(soma - total) > 0.005;
  el.textContent = PARC.length ? `${PARC.length} parcela(s) · total ${reais(soma)}${dif ? ` · diferente do valor informado (${reais(total)}): falta ${reais(total - soma)}` : ''}` : 'Informe o número de parcelas';
  el.classList.toggle('erro', dif);
}
function conferirParcelas(d) {
  if (PARC.length < 2) return 'Parcelado: informe 2 parcelas ou mais (ou marque "Pagamento único")';
  if (PARC.some(p => !p.venc)) return 'Parcelado: informe o vencimento de todas as parcelas';
  if (PARC.some(p => !(p.valor > 0))) return 'Parcelado: todas as parcelas precisam de valor';
  if (emissaoFixa() && PARC.some(p => p.venc < d.data_emissao)) return 'Parcelado: há parcela vencendo antes da emissão';
  if (modalAtual.querySelector('#pcModo').value === 'total' && Math.abs(PARC.reduce((s, p) => s + centavos(p.valor), 0) - centavos(d.valor)) > 0) return 'Parcelado: a soma das parcelas precisa fechar com o valor total';
  return null;
}
// Rateio dividido na proporção do valor da parcela (a última categoria fica com os centavos)
function ratear(rat, valor) {
  const tot = rat.reduce((s, x) => s + x.valor, 0); let usado = 0;
  return rat.map((x, i) => { const v = i === rat.length - 1 ? centavos(valor) - usado : Math.round(centavos(valor) * x.valor / tot); usado += v; return { ...x, valor: v / 100 }; });
}
async function salvarParcelas(dados, rat) {
  const grupo = crypto.randomUUID(), fixa = emissaoFixa(), n = PARC.length;
  const titulos = PARC.map((p, i) => ({ ...dados, id: null, valor: p.valor, data_vencimento: p.venc, data_emissao: fixa ? dados.data_emissao : p.venc,
    parcela: i + 1, parcelas: n, grupo_parcelas: grupo, data_programada: null }));
  const rateios = rat.length ? PARC.map(p => ratear(rat, p.valor)) : null;
  const { data, error } = await db.rpc('salvar_parcelas_pagar', { p_titulos: titulos, p_rateios: rateios });
  if (!error) { aviso(`${n} parcelas lançadas`); return data; }
  if (error.code !== 'PGRST202') throw error;
  // Banco ainda sem a função de parcelas (SQL 108 não rodado): grava uma a uma
  let primeiro = null;
  for (const [i, t] of titulos.entries()) {
    const r = await db.rpc('salvar_titulo_pagar', { p_titulo: t, p_rateio: rateios ? rateios[i] : null });
    if (r.error) throw new Error(`parcela ${i + 1} de ${n}: ${r.error.message}${i ? ` (as ${i} primeiras foram gravadas)` : ''}`);
    primeiro ??= r.data;
  }
  aviso(`${n} parcelas lançadas`); return primeiro;
}
function montarParcelamento(m) {
  const fVe = m.querySelector('#f_data_vencimento'), grade = fVe.closest('.grade-campos');
  grade.insertAdjacentHTML('afterend', `<div class="secao">Parcelamento</div>
    <div class="parc-tipo" style="display:flex;gap:18px;flex-wrap:wrap"><label class="chk"><input type="radio" name="pcTipo" id="pcNao" checked> Pagamento único</label>
      <label class="chk"><input type="radio" name="pcTipo" id="pcSim"> Parcelado (gera um título por parcela)</label></div>
    <div class="parc" id="pcCorpo" hidden style="margin-top:8px">
      <div class="grade-campos" style="margin-top:0">
        <div class="campo"><label>Nº de parcelas</label><input id="pcN" inputmode="numeric" value="3"></div>
        <div class="campo"><label>O valor informado é</label><select id="pcModo" data-simples><option value="total">O total (dividir)</option><option value="cada">O de cada parcela</option></select></div>
        <div class="campo"><label>Vencimentos</label><select id="pcInt" data-simples><option value="mensal">Todo mês, no mesmo dia</option><option value="dias">A cada X dias</option></select></div>
        <div class="campo"><label>Dias entre parcelas</label><input id="pcDias" inputmode="numeric" value="30"></div>
      </div>
      <div class="campo" style="margin-top:6px"><label>Data de emissão das parcelas</label>
        <div style="display:flex;gap:18px;flex-wrap:wrap"><label class="chk"><input type="radio" name="pcEm" value="fixa" checked> Fixa: a mesma para todas (data da nota / compra)</label>
          <label class="chk"><input type="radio" name="pcEm" value="venc"> Igual ao vencimento de cada parcela</label></div></div>
      <table><thead><tr><th>Parcela</th><th>Emissão</th><th>Vencimento</th><th>Valor (R$)</th></tr></thead><tbody id="pcLista"></tbody></table>
      <div class="soma" id="pcSoma"></div>
      <p class="ajuda">Dá para ajustar o vencimento ou o valor de uma parcela direto na tabela (mudar os campos acima refaz a tabela). Para programar o pagamento, use "Programar pagamento" na lista depois de lançar.</p>
    </div>`);
  const q = s => m.querySelector(s), corpo = q('#pcCorpo'), rotVe = q('[data-campo=data_vencimento] label');
  const textoVe = rotVe.firstChild.textContent;
  const alternar = () => {
    const sim = parcelado(), chk = q('#emIgualVenc');
    corpo.hidden = !sim; q('#emIgualBox').style.display = sim ? 'none' : '';
    rotVe.firstChild.textContent = sim ? '1º vencimento ' : textoVe;
    if (sim) { chk.checked = false; gerarParcelas(); } else { restaurarEmissao(); q('#f_data_emissao').readOnly = chk.checked; }
    const fProg = q('#f_data_programada'); if (fProg) { fProg.disabled = sim; if (sim) fProg.value = ''; }
  };
  q('#pcSim').onchange = q('#pcNao').onchange = alternar;
  ['#pcN', '#pcModo', '#pcInt', '#pcDias', '#f_valor', '#f_data_vencimento'].forEach(s => ['input', 'change'].forEach(ev => q(s).addEventListener(ev, () => parcelado() && gerarParcelas())));
  q('#f_data_emissao').addEventListener('change', () => parcelado() && desenharParcelas());
  m.querySelectorAll('input[name=pcEm]').forEach(x => x.onchange = desenharParcelas);
  q('#pcLista').addEventListener('change', e => {
    const i = e.target.dataset.pv ?? e.target.dataset.pval; if (i === undefined) return;
    if (e.target.dataset.pv !== undefined) PARC[+i].venc = e.target.value; else PARC[+i].valor = lerNumero(e.target.value) || 0;
    desenharParcelas();
  });
}

// No título já lançado: as outras parcelas da mesma compra (link para abrir cada uma)
function htmlParcelasGrupo(r) {
  if (!r.grupo_parcelas) return '';
  const ps = LINHAS.filter(x => x.grupo_parcelas === r.grupo_parcelas).sort((a, b) => (a.parcela || 0) - (b.parcela || 0));
  if (ps.length < 2) return '';
  return `<div class="secao">Parcelas desta compra · ${ps.length}</div><table class="lista-mini"><thead><tr><th>Parcela</th><th>Emissão</th><th>Vencimento</th><th>Valor</th><th>Situação</th></tr></thead><tbody>
    ${ps.map(x => `<tr${x.id === r.id ? ' style="font-weight:600"' : ''}><td>${x.id === r.id ? `${x.parcela}/${x.parcelas} (este)` : `<a href="?abrir=${x.id}" style="color:var(--destaque)">${x.parcela}/${x.parcelas}</a>`}</td>
      <td>${dataCurta(x.data_emissao)}</td><td>${dataCurta(x.data_vencimento)}</td><td class="num">${reais(x.valor)}</td><td>${cfg.campos.find(c => c.id === 'situacao').listaHtml(x)}</td></tr>`).join('')}</tbody></table>`;
}

// Outros títulos em aberto (sem pagamento) com o mesmo nome de fornecedor do Tiny e ainda sem cadastro
// Parcela do título; nos importados do Tiny sem o campo, lê do histórico ("... - Parcela (6/60)")
const parcelaDe = r => { if (r.parcela && r.parcelas) return [r.parcela, r.parcelas];
  const m = r.origem === 'importacao' && String(r.descricao || '').match(/parcela\s*\(?\s*(\d{1,3})\s*\/\s*(\d{1,3})/i);
  return m && +m[1] >= 1 && +m[1] <= +m[2] ? [+m[1], +m[2]] : []; };
const mesmoNomeTiny = r => LINHAS.filter(x => x.id !== r.id && !x.fornecedor_id && x.origem_ref?.fornecedor_tiny === r.origem_ref?.fornecedor_tiny && ['aberto', 'programado'].includes(x.situacao));

/* ---------- Rastreio da compra até o pagamento ---------- */
// Títulos do RH: tela de origem › lançamento na folha › título
const TELAS_RH_FIN = { adiantamento: ['Adiantamento salarial', 'adiantamento.html'], vale_transporte: ['Vale-transporte', 'vale-transporte.html'],
  decimo_terceiro: ['13º salário', 'decimo-terceiro.html'], folha: ['Fechamento da folha', 'relatorios.html'] };
function rastreioRH(ref) {
  const [nome, arq] = TELAS_RH_FIN[ref.origem] || [ref.origem, 'lancamentos.html'];
  const url = RAIZ + 'pages/rh/' + arq + (ref.origem !== 'folha' && ref.origem_id ? '?abrir=' + ref.origem_id : '');
  const comp = ref.competencia ? String(ref.competencia).slice(5, 7) + '/' + String(ref.competencia).slice(0, 4) : '';
  return `<a class="ok" href="${url}">RH · ${esc(nome)} ↗</a><i>›</i><span class="ok">Lançamentos ${esc(comp)}</span>`;
}
function htmlRastreio(r) {
  const ref = r.origem_ref || {}, pgs = (extraAtual.pagamentos[r.id] || []).filter(p => !p.estornado);
  const etapa = (ok, txt) => `<span class="${ok ? 'ok' : ''}">${esc(txt)}</span>`;
  const compra = ['nf_entrada', 'pedido_compra'].includes(r.origem) || r.pedido_compra_id || ref.pedido;
  return `<div class="secao">Rastreio</div><div class="rastreio">${compra ? [

function htmlAnexos(r) {

      <label class="btn fino" style="cursor:pointer">+ Anexar arquivo<input type="file" id="anArq" multiple accept="application/pdf,image/*,.xml" hidden></label><small class="sub">PDF ou imagem, até 15 MB</small></div>` : ''}`;
}
async function anexarArquivos(r, arquivos, categoria, pagamentoId, conferencia) {
  let n = 0;
  for (const f of arquivos) {
    if (f.size > 15 * 1024 * 1024) { aviso(f.name + ': maior que 15 MB', true); continue; }
    const limpo = f.name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9._-]+/gi, '_');
    const caminho = `pagar/${r.empresa_id}/${r.id}/${Date.now()}_${limpo}`;
    const up = await db.storage.from('financeiro').upload(caminho, f, { contentType: f.type || undefined });
    if (up.error) { aviso(f.name + ': ' + up.error.message, true); continue; }
    const { error } = await db.from('titulos_anexos').insert({ tipo: 'pagar', titulo_id: r.id, pagamento_id: pagamentoId || null, categoria, nome: f.name, caminho, mime: f.type || null, tamanho: f.size, conferencia: conferencia || null });
    if (error) { aviso(f.name + ': ' + error.message, true); continue; }
    n++;
  }
  return n;
}
function ligarAnexos(m, r) {
  m.querySelectorAll('[data-anexo]').forEach(a => a.onclick = async e => {
    e.preventDefault();
    const x = (extraAtual.anexos[r.id] || []).find(y => y.id === Number(a.dataset.anexo));
    const { data, error } = await db.storage.from('financeiro').createSignedUrl(x.caminho, 300);
    if (error) return aviso('Não abriu: ' + error.message, true);
    window.open(data.signedUrl, '_blank', 'noopener');
  });
  m.querySelectorAll('[data-anexo-rm]').forEach(b => b.onclick = async () => {
    const x = (extraAtual.anexos[r.id] || []).find(y => y.id === Number(b.dataset.anexoRm));
    if (!confirm(`Excluir o anexo "${x.nome}"?`)) return;
    const { error } = await db.from('titulos_anexos').delete().eq('id', x.id);
    if (error) return aviso('Não excluiu: ' + error.message, true);
    await db.storage.from('financeiro').remove([x.caminho]);
    aviso('Anexo excluído'); m.remove(); cfg.recarregar();
  });
  const inp = m.querySelector('#anArq');
  if (inp) inp.onchange = async () => {
    const arquivos = [...inp.files]; inp.value = ''; if (!arquivos.length) return;
    const n = await anexarArquivos(r, arquivos, m.querySelector('#anCat').value);
    if (n) { aviso(`${n} arquivo(s) anexado(s)`); m.remove(); await cfg.recarregar(); }
  };
}

async function registrarPagamento(r) {
  const q = s => modalAtual.querySelector(s);
  const p = { titulo_id: r.id, data_pagamento: q('#pgData').value, valor: lerNumero(q('#pgValor').value), juros: lerNumero(q('#pgJuros').value) || 0,
    desconto: lerNumero(q('#pgDesc').value) || 0, conta_bancaria_id: Number(q('#pgConta').value) || null,
    forma_pagamento_id: Number(q('#pgForma').value) || null, identificador: q('#pgIdent').value.trim() || null };
  if (!p.data_pagamento) return aviso('Informe a data do pagamento', true);
  if (!(p.valor > 0)) return aviso('Informe o valor pago', true);
  if (p.valor > Number(r.saldo) + 0.005) return aviso(`Valor maior que o saldo (${reais(r.saldo)})`, true);
  if (!p.conta_bancaria_id) return aviso('Escolha a conta de onde saiu o pagamento (cadastre em Contas bancárias)', true);
  // a categoria escolhida na tela precisa estar gravada no título antes da baixa
  const cat = Number(q('#f_categoria_financeira_id')?.value) || null, temRateio = (extraAtual.rateio[r.id] || []).length || lerRateio().length;
  if (!cat && !temRateio) return aviso('Informe a categoria financeira do título antes de registrar o pagamento', true);
  if (cat && cat !== r.categoria_financeira_id && !temRateio) {
    const { error: e1 } = await db.from('titulos_pagar').update({ categoria_financeira_id: cat }).eq('id', r.id);
    if (e1) return aviso('Não gravou a categoria: ' + e1.message, true);
    r.categoria_financeira_id = cat;
  }
  // Comprovante obrigatório, conferido automaticamente (fornecedor, valor e data)
  const comp = [...(q('#pgComp')?.files || [])];
  if (!comp.length) return aviso('Anexe o comprovante do pagamento (obrigatório)', true);
  const forn = FORN.find(f => f.v === r.fornecedor_id);
  const conf = await conferirComTela(comp[0], { valor: p.valor + p.juros - p.desconto, data: p.data_pagamento, nome: forn?.nome || r.origem_ref?.fornecedor_tiny || '', fantasia: forn?.fantasia, doc: forn?.doc,
    apelidos: apelidosDe(APELIDOS, r.fornecedor_id, r.origem_ref?.fornecedor_tiny) });
  if (!conf) return;
  if (conf.justificativa) p.observacoes = 'Comprovante com divergência: ' + conf.justificativa;
  const { data: pg, error } = await db.from('pagamentos').insert(p).select('id').single();
  if (error) return aviso('Não salvou: ' + error.message, true);
  await anexarArquivos(r, comp, 'comprovante', pg?.id, conf);
  aviso((p.valor >= Number(r.saldo) - 0.005 ? 'Título quitado' : 'Pagamento parcial registrado') + ' · comprovante anexado' + (conf.justificativa ? ' (com justificativa)' : ''));
  modalAtual.remove(); cfg.recarregar();
}

// Lê o comprovante, mostra o que bateu e o que não bateu; divergência só segue com justificativa
async function conferirComTela(arquivo, esperado) {
  const m = abrirModal(`<h2>Conferindo o comprovante…</h2><p class="sub" id="cfSt">Lendo ${esc(arquivo.name)} (pode levar alguns segundos em foto)</p>`);
  let itens, texto = '';
  try { texto = await lerComprovante(arquivo); itens = conferirComprovante(texto, esperado); }
  catch (e) { itens = [{ item: 'Leitura', ok: false, detalhe: 'Não consegui ler o arquivo: ' + (e.message || e) }]; }
  const tudo = itens.every(x => x.ok), br = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  return new Promise(res => {
    m.querySelector('.modal').innerHTML = `<h2>${tudo ? '✓ Comprovante confere' : '⚠ Comprovante com divergência'}</h2>
      <p class="sub" style="margin:0 0 8px">Esperado: ${esc([esperado.nome, esperado.fantasia].filter(Boolean).join(' / ') || '?')} · ${br(esperado.valor)} · ${String(esperado.data).split('-').reverse().join('/')}</p>
      <ul class="checagem">${itens.map(x => `<li class="${x.ok ? 'ok' : 'erro'}"><b>${esc(x.item)}:</b> ${esc(x.detalhe)}</li>`).join('')}</ul>
      ${tudo ? '' : `<div class="campo"><label>Justificativa para registrar mesmo assim *</label><textarea id="cfJ" rows="2" placeholder="ex.: pago pelo app com o nome fantasia; valor com juros do banco"></textarea></div>
      ${itens.some(x => x.item === 'Fornecedor' && !x.ok) ? '<p class="sub" style="margin:4px 0 0">Se for o mesmo fornecedor com outro nome (razão social x nome fantasia), diga isso na justificativa: quando o gestor der ciente, o sistema aprende esse nome e não bloqueia de novo.</p>' : ''}`}
      ${texto ? `<details style="margin-top:6px"><summary class="sub">Texto lido do comprovante</summary><pre style="font-size:11px;white-space:pre-wrap;max-height:180px;overflow:auto">${esc(texto.slice(0, 3000))}</pre></details>` : ''}
      <div class="acoes"><button class="btn" id="cfN">Voltar</button><button class="btn primario" id="cfS">${tudo ? 'Registrar pagamento' : 'Registrar com justificativa'}</button></div>`;
    m.querySelector('#cfN').onclick = () => { m.remove(); res(null); };
    m.querySelector('#cfS').onclick = () => {
      const j = m.querySelector('#cfJ')?.value.trim();
      if (!tudo && !j) return aviso('Escreva a justificativa da divergência', true);
      // nome lido e texto ficam guardados: o "Ciente" do master ensina o nome; dá para reconferir sem ler de novo
      m.remove(); res({ ok: tudo, itens, justificativa: tudo ? null : j, lido_em: new Date().toISOString(), nome_lido: texto ? nomeNoComprovante(texto) : null, texto: texto.slice(0, 4000) || null });
    };
  });
}

/* ---------- Janelinha para ações em lote ---------- */
function janela(titulo, corpo, botao, aoConfirmar) {
  const m = abrirModal(`<div class="mini-modal"><h2>${esc(titulo)}</h2>${corpo}<div class="acoes"><button class="btn" id="jCancelar">Cancelar</button><button class="btn primario" id="jOk">${esc(botao)}</button></div></div>`);

}

        });
      } },
    { nome: 'Cancelar título', executar: (sel, pronto) => {
        if (!ACOES.has('pagar.cancelar')) return aviso('Cancelar título precisa de permissão do gestor', true);
        const ok = sel.filter(r => ABERTOS.includes(r.situacao) && !Number(r.valor_pago));
        if (!ok.length) return aviso('Só títulos em aberto e sem pagamento podem ser cancelados (estorne o pagamento antes)', true);
        janela(`Cancelar ${ok.length} título(s)`, '<div class="grade"><div style="grid-column: span 2"><label>Motivo</label><input id="jMotivo" placeholder="ex.: lançado em duplicidade"></div></div>', 'Cancelar títulos', async m => {
          const motivo = m.querySelector('#jMotivo').value.trim(); if (!motivo) { aviso('Informe o motivo', true); return false; }
          const { error } = await db.from('titulos_pagar').update({ situacao: 'cancelado', motivo_cancelamento: motivo }).in('id', ok.map(r => r.id));
          if (error) { aviso('Não salvou: ' + error.message, true); return false; }
          aviso('Cancelado'); pronto();
        });
      } }
  ],
  tituloRegistro: r => [FORN.find(f => f.v === r.fornecedor_id)?.n, r.documento].filter(Boolean).join(' · ') || r.descricao || 'Título',
  chaveHistorico: r => r.documento || r.id,
  msgDuplicado: 'Título duplicado'
};
/* ---------- Lista única: botões de situação (contagem e total) e período rápido ----------
   Os botões só mexem nos filtros do painel (Situação / Período por / De / Até): o "Filtros" continua valendo
   e os atalhos da página inicial (?f_grupo=…&per=…&de=…&ate=…) caem no botão certo. */
const BOTOES = [
  { v: 'abertos', n: 'Em aberto' }, { v: 'vencidos', n: 'Vencidos', cor: 'vermelho' }, { v: 'hoje', n: 'Vencem hoje', cor: 'laranja' },
  { v: 'programados', n: 'Programados' }, { v: 'pago', n: 'Pagos', cor: 'verde', soma: r => Number(r.valor_pago) },
  { v: 'cancelado', n: 'Cancelados', soma: r => Number(r.valor) }, { v: '', n: 'Todos', soma: r => r.situacao === 'cancelado' ? 0 : Number(r.saldo) }];
const fimMes = iso => somaDias(somaMeses(iso.slice(0, 8) + '01', 1), -1);
function periodos() {
  const h = hoje(), dw = (new Date(h + 'T12:00:00').getDay() + 6) % 7, ini = somaDias(h, -dw);
  return [{ v: 'todo', n: 'Todo o período', de: '', ate: '' }, { v: 'hoje', n: 'Hoje', de: h, ate: h },
    { v: 'semana', n: 'Esta semana', de: ini, ate: somaDias(ini, 6) }, { v: 'prox30', n: 'Próximos 30 dias', de: h, ate: somaDias(h, 30) }];
}
function desenharBarras(api) {
  const cont = document.getElementById('conteudo'), $ = s => cont.querySelector(s);
  if (!$('#pgSitu')) $('#cPend').insertAdjacentHTML('beforebegin', '<div class="situ-bar nao-imprimir" id="pgSitu"></div><div class="periodo-bar nao-imprimir" id="pgPer"></div>');
  const sel = $('[data-filtro-extra=grupo]'), per = $('#fPerCampo'), de = $('#fDe'), ate = $('#fAte');
  const teste = cfg.filtrosExtras.find(f => f.id === 'grupo').teste, base = api.semFiltro('grupo');
  // Situação
  $('#pgSitu').innerHTML = BOTOES.map(b => {
    const rs = b.v ? base.filter(r => teste(r, b.v)) : base, tot = rs.reduce((s, r) => s + (b.soma ? b.soma(r) : Number(r.saldo)), 0);
    return `<button type="button" class="situ ${b.cor || ''}${sel.value === b.v ? ' ativa' : ''}${rs.length ? '' : ' zero'}" data-situ="${b.v}">${b.n} <small>· ${rs.length}</small><b>${reais(tot)}</b></button>`;
  }).join('');
  cont.querySelectorAll('[data-situ]').forEach(b => b.onclick = () => {
    sel.value = b.dataset.situ;
    // filtro inteligente: pagos olham a data do pagamento; o resto, o vencimento
    if (sel.value === 'pago' && per.value === 'data_vencimento') per.value = 'data_pagamento';
    else if (sel.value !== 'pago' && sel.value !== '' && per.value === 'data_pagamento') per.value = 'data_vencimento';
    sel.dispatchEvent(new Event('change'));
  });
  // Período
  const ps = periodos(), atual = ps.find(p => p.de === de.value && p.ate === ate.value)?.v;
  const mesBase = de.value && de.value.endsWith('-01') && ate.value === fimMes(de.value) ? de.value : null;
  const mesRef = mesBase || hoje().slice(0, 8) + '01';
  const nomeMes = iso => new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR', { month: 'short', year: 'numeric' }).replace('.', '').replace(' de ', '/');
  $('#pgPer').innerHTML = `<span>Período por</span><select id="pgPerCampo" data-simples>${[...per.options].map(o => `<option value="${o.value}"${o.value === per.value ? ' selected' : ''}>${esc(o.text)}</option>`).join('')}</select>
    ${ps.map(p => `<button type="button" class="chip${atual === p.v ? ' ativa' : ''}" data-per="${p.v}">${p.n}</button>`).join('')}
    <button type="button" class="chip seta" data-mes="-1" title="Mês anterior">‹</button><button type="button" class="chip${mesBase ? ' ativa' : ''}" data-mes="0" title="Mês inteiro">${nomeMes(mesRef)}</button><button type="button" class="chip seta" data-mes="1" title="Próximo mês">›</button>
    <button type="button" class="chip${!atual && !mesBase ? ' ativa' : ''}" id="pgPerOutro">${!atual && !mesBase ? `${dataCurta(de.value) || '…'} a ${dataCurta(ate.value) || '…'}` : 'Outro período…'}</button>`;
  const aplicar = (d, a) => { de.value = d; ate.value = a; de.dispatchEvent(new Event('change')); };
  $('#pgPerCampo').onchange = e => { per.value = e.target.value; per.dispatchEvent(new Event('change')); };
  cont.querySelectorAll('[data-per]').forEach(b => b.onclick = () => { const p = ps.find(x => x.v === b.dataset.per); aplicar(p.de, p.ate); });
  cont.querySelectorAll('[data-mes]').forEach(b => b.onclick = () => { const m = somaMeses(mesRef, +b.dataset.mes); aplicar(m, fimMes(m)); });
  $('#pgPerOutro').onclick = () => { const btn = $('#cFiltBtn'); if ($('#cFilt').hidden) btn.click(); de.focus(); };
}

/* ---------- Projeção: títulos estimados de uma vez (ex.: aluguel até dezembro) ---------- */
function abrirProjecao(ctx) {
  const ano = hoje().slice(0, 4), mes = hoje().slice(0, 7);
  const empOpts = ctx.empresas.map(e => `<option value="${e.id}"${e.id === (ctx.empresa || ctx.empresas[0]?.id) ? ' selected' : ''}>${esc(e.nome)}</option>`).join('');
  const m = janela('Nova projeção', `<p class="sub" style="margin:0 0 6px">Cria um título por mês com valor estimado (emissão = vencimento). Quando a conta real chegar, ajuste o valor e desmarque "projeção".</p>
    <div class="grade">
      <div><label>Empresa</label><select id="pjEmp">${empOpts}</select></div>
      <div><label>Fornecedor</label><select id="pjForn"><option value="">—</option>${FORN.map(f => `<option value="${f.v}">${esc(f.n)}</option>`).join('')}</select></div>
      <div style="grid-column: span 2"><label>Categoria financeira</label><select id="pjCat">${optCats(null)}</select></div>
      <div><label>Descrição / documento</label><input id="pjDoc" placeholder="ex.: Aluguel galpão"></div>
      <div><label>Valor por mês (R$)</label><input id="pjValor" inputmode="decimal"></div>
      <div><label>Dia do vencimento</label><input id="pjDia" inputmode="numeric" value="10"></div>
      <div><label>Forma de pagamento</label><select id="pjForma"><option value="">—</option>${FORMAS.map(f => `<option value="${f.id}">${esc(f.nome)}</option>`).join('')}</select></div>
      <div><label>Do mês</label><input type="month" id="pjIni" value="${mes}"></div>
      <div><label>Até o mês</label><input type="month" id="pjFim" value="${ano}-12"></div>
    </div><p class="sub" id="pjPrevia" style="margin:0"></p>`, 'Criar títulos', async mm => {
      const q = s => mm.querySelector(s);
      const p = { empresa_id: Number(q('#pjEmp').value), fornecedor_id: Number(q('#pjForn').value) || null, categoria_financeira_id: Number(q('#pjCat').value) || null,
        valor: lerNumero(q('#pjValor').value), dia: Number(q('#pjDia').value), inicio: q('#pjIni').value + '-01', fim: q('#pjFim').value + '-01',
        documento: q('#pjDoc').value.trim(), descricao: q('#pjDoc').value.trim(), forma_pagamento_id: Number(q('#pjForma').value) || null };
      if (!p.fornecedor_id || !p.categoria_financeira_id || !(p.valor > 0) || !p.dia || !q('#pjIni').value || !q('#pjFim').value) { aviso('Preencha fornecedor, categoria, valor, dia e meses', true); return false; }
      const { data, error } = await db.rpc('gerar_projecao', { p });
      if (error) { aviso('Não criou: ' + error.message, true); return false; }
      aviso(`${data} título(s) de projeção criados`); cfg.recarregar();
    });
  const previa = () => {
    const q = s => m.querySelector(s), i = q('#pjIni').value, f = q('#pjFim').value, v = lerNumero(q('#pjValor').value) || 0;
    if (!i || !f) return;
    const n = (Number(f.slice(0, 4)) - Number(i.slice(0, 4))) * 12 + Number(f.slice(5)) - Number(i.slice(5)) + 1;
    q('#pjPrevia').textContent = n > 0 ? `Serão criados ${n} título(s), vencendo todo dia ${q('#pjDia').value || '?'} · total ${reais(n * v)}` : 'O último mês precisa ser depois do primeiro';
  };
  m.querySelectorAll('input').forEach(i => i.addEventListener('input', previa)); previa();
}

/* ---------- Relatório de prazos (aging): saldo a pagar por faixa, por empresa ---------- */
function relatorioAging(visiveis, ctx) {
  const abertos = visiveis.filter(r => ABERTOS.includes(r.situacao));
  const emps = ctx.empresas.filter(e => abertos.some(r => r.empresa_id === e.id));
  const linhas = FAIXAS.map(f => { const rs = abertos.filter(r => faixa(r) === f.v);
    return [f.n, rs.length, ...emps.map(e => rs.filter(r => r.empresa_id === e.id).reduce((s, r) => s + Number(r.saldo), 0).toFixed(2).replace('.', ',')),
      rs.reduce((s, r) => s + Number(r.saldo), 0).toFixed(2).replace('.', ',')]; });
  exportarExcel('contas_pagar_aging', ['Prazo (data prevista)', 'Títulos', ...emps.map(e => e.nome), 'Total (R$)'], linhas);
}

montarCadastro(cfg).then(() => {
  const novo = document.getElementById('cNovo');
  if (novo) {
    const caixa = document.createElement('div'); caixa.style.cssText = 'display:flex;gap:6px;align-items:center';
    novo.replaceWith(caixa); caixa.innerHTML = '<button class="btn fino" id="cProjecao" title="Criar títulos estimados de uma vez (ex.: aluguel até dezembro)">+ Projeção</button>'; caixa.appendChild(novo);
    document.getElementById('cProjecao').onclick = () => abrirProjecao(window.__ctxNox);
  }
  document.addEventListener('click', e => { if (e.target.id === 'btnAging') relatorioAging(window.__visiveisNox || [], window.__ctxNox); });
});
</script>
