<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contas bancárias · NOX ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css?v=202610260941">
</head>
<body data-modulo="contas_bancarias" data-titulo="Contas bancárias" data-empresa="sim">
<main id="conteudo"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../assets/js/supabase.js?v=202610260941"></script>
<script src="../../assets/js/ui.js?v=202610260941"></script>
<script src="../../assets/js/auth.js?v=202610260941"></script>
<script src="../../assets/js/layout.js?v=202610260941"></script>
<script src="../../assets/js/cadastro.js?v=202610260941"></script>
<script>
const TIPOS = [{ v: 'corrente', n: 'Conta corrente' }, { v: 'pagamentos', n: 'Conta de pagamentos (Mercado Pago…)' }, { v: 'cartao', n: 'Cartão de crédito' },
  { v: 'caixa', n: 'Caixa (dinheiro)' }, { v: 'aplicacao', n: 'Aplicação' }, { v: 'historico', n: 'Histórico (lançamentos antigos sem conciliação)' }];

montarCadastro({
  textoNovo: '+ Nova conta',
  tabela: 'contas_bancarias', modulo: 'contas_bancarias', titulo: 'Contas bancárias', singular: 'conta', plural: 'contas',
  subtitulo: 'Contas de cada empresa (CNPJ). Pagamentos, recebimentos e conciliação usam estas contas; o seletor de empresa no menu filtra a lista.',
  dicaBusca: 'conta, banco, agência, número…', ordem: 'descricao', revisao: true, porEmpresa: true,
  abas: { campo: 'situacao', padrao: 'ativo', opcoes: [{ v: 'ativo', n: 'Ativas' }, { v: 'inativo', n: 'Inativas' }, { v: '', n: 'Todas' }] },
  campos: [
    { id: 'descricao', label: 'Nome da conta', obrig: true, col: 2, lista: true, placeholder: 'ex.: Itaú 37' },
    { id: 'empresa_id', label: 'Empresa (CNPJ)', tipo: 'empresa', obrig: true, lista: true, col: 2,
      opcoes: ctx => ctx.empresas.map(e => ({ v: e.id, n: e.nome })), padrao: ctx => ctx.empresa || ctx.empresas[0]?.id },
    { id: 'banco', label: 'Banco', lista: true, filtro: true },
    { id: 'agencia', label: 'Agência', lista: true },
    { id: 'conta', label: 'Conta', lista: true },
    { id: 'tipo', label: 'Tipo', tipo: 'select', opcoes: TIPOS, obrig: true, padrao: 'corrente', filtro: true, lista: true },
    { id: 'saldo_inicial', label: 'Saldo inicial (R$)', tipo: 'moeda', secao: 'Saldo e conciliação' },
    { id: 'data_saldo_inicial', label: 'Data do saldo inicial', tipo: 'data' },
    { id: 'conciliavel', label: 'Conciliação', tipo: 'bool', padrao: true, textoBool: 'Tem extrato para conciliar' },
    { id: 'nome_tiny', label: 'Nome no Tiny', ajuda: 'Como a conta aparece no Tiny (usado na importação do histórico).' },
    { id: 'situacao', label: 'Situação', tipo: 'select', opcoes: [{ v: 'ativo', n: 'Ativa' }, { v: 'inativo', n: 'Inativa' }], obrig: true, padrao: 'ativo' },
    { id: 'observacoes', label: 'Observações', tipo: 'textarea', col: 4, secao: 'Observações' }
  ],
  antesSalvar: d => { if (d.empresa_id) d.empresa_id = Number(d.empresa_id); },
  pendencias: [
    { id: 'sem_saldo', nome: 'Sem data do saldo inicial', cor: 'alerta', bloqueia: true, teste: r => r.situacao === 'ativo' && r.tipo !== 'historico' && !r.data_saldo_inicial },
    { id: 'sem_dados', nome: 'Sem agência/conta', cor: 'neutro', teste: r => ['corrente', 'pagamentos'].includes(r.tipo) && !r.conta }
  ],
  acoesLote: [{ nome: 'Inativar', dados: { situacao: 'inativo' } }, { nome: 'Ativar', dados: { situacao: 'ativo' } }],
  apagado: r => r.situacao === 'inativo',
  msgDuplicado: 'Já existe conta com este nome nesta empresa'
});
</script>
</body>
</html>
