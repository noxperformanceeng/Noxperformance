<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locais de estoque · NOX ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css?v=202611131718">
</head>
<body data-modulo="locais" data-titulo="Locais de estoque">
<main id="conteudo"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../assets/js/supabase.js?v=202611131718"></script>
<script src="../../assets/js/ui.js?v=202611131718"></script>
<script src="../../assets/js/auth.js?v=202611131718"></script>
<script src="../../assets/js/layout.js?v=202611131718"></script>
<script src="../../assets/js/cadastro.js?v=202611131718"></script>
<script>
let PRODS = [], ESCOLHIDOS = null, ANTES = [];   // produtos que controlam estoque; os escolhidos no formulário aberto
const AREAS = [{ v: 'estoque', n: 'Estoque' }, { v: 'almoxarifado', n: 'Almoxarifado' }, { v: 'producao', n: 'Produção' },
  { v: 'expedicao', n: 'Expedição' }, { v: 'quarentena', n: 'Quarentena / avaria' }, { v: 'terceiros', n: 'Em terceiros' }];

montarCadastro({
  tabela: 'locais_estoque', modulo: 'locais', titulo: 'Locais de estoque', singular: 'local', plural: 'locais',
  subtitulo: 'Onde cada item fica guardado. O código vira etiqueta para leitura na separação e no inventário.',
  dicaBusca: 'código, rua, prateleira, descrição…', ordem: 'codigo', revisao: false,
  abas: { campo: 'area', padrao: '', opcoes: [{ v: '', n: 'Todas as áreas' }, ...AREAS] },
  campos: [
    { id: 'codigo', label: 'Código', lista: true, maiusculo: true, ajuda: 'Em branco = monta sozinho com rua-prateleira-posição (ex.: A-02-03). Se for o código de um produto, o produto já é ligado a este local.' },
    { id: 'area', label: 'Área', tipo: 'select', opcoes: AREAS, obrig: true, padrao: 'estoque', lista: true },
    { id: 'situacao', label: 'Situação', tipo: 'select', opcoes: [{ v: 'ativo', n: 'Ativo' }, { v: 'inativo', n: 'Inativo' }], obrig: true, padrao: 'ativo', filtro: true },
    { id: 'deposito', label: 'Depósito / galpão', filtro: true, lista_sugestoes: ['Galpão principal', 'Mezanino'] },
    { id: 'rua', label: 'Rua / corredor', maiusculo: true, lista: true },
    { id: 'prateleira', label: 'Prateleira / estante', maiusculo: true, lista: true },
    { id: 'posicao', label: 'Posição / nível', maiusculo: true, lista: true },
    { id: 'capacidade', label: 'Capacidade / tamanho', placeholder: 'ex.: caixa 40x30, palete' },
    { id: 'descricao', label: 'Descrição', col: 4, lista: true, placeholder: 'ex.: tubos inox até 2"' },
    { id: 'observacoes', label: 'Observações', tipo: 'textarea', col: 4 }
  ],
  subtituloLinha: r => r.deposito,
  async carregarExtra() {
    PRODS = await buscarTodos(() => db.from('produtos').select('id, codigo, descricao, local_id').eq('situacao', 'ativo').eq('controla_estoque', true).neq('tipo', 'despesa').order('codigo'));
    return {};
  },
  colunasExtras: [{ label: 'Produtos guardados', texto: r => doLocal(r.id).map(p => p.codigo || p.descricao).join(', '),
    html: r => { const ps = doLocal(r.id); return ps.length ? ps.map(p => `<b>${esc(p.codigo || '')}</b>`).join(', ') : '<span class="tg alerta">nenhum</span>'; } }],
  textoBuscaExtra: r => doLocal(r.id).map(p => `${p.codigo} ${p.descricao}`).join(' '),
  aoAbrir: (m, r) => montarProdutos(m, r),
  depoisSalvar: async id => {   // o local já gravou: se a ligação falhar, avisa sem desfazer o local
    const novos = [...ESCOLHIDOS].filter(x => !ANTES.includes(x)), tirados = ANTES.filter(x => !ESCOLHIDOS.has(x));
    for (const [ps, loc] of [[novos, id], [tirados, null]]) {
      if (!ps.length) continue;
      const { error } = await db.rpc('estoque_definir_local', { p_produtos: ps, p_local: loc });
      if (error) return aviso('O local foi salvo, mas não ligou o produto: ' + error.message, true);
    }
    PRODS.forEach(p => { if (novos.includes(p.id)) p.local_id = id; if (tirados.includes(p.id)) p.local_id = null; });
  },
  apagado: r => r.situacao === 'inativo',
  antesSalvar: d => {
    if (!d.codigo && d.rua) d.codigo = [d.rua, d.prateleira, d.posicao].filter(Boolean).join('-');
  },
  validar: d => !d.codigo ? 'Informe o código ou pelo menos a rua' : null,
  acoesLote: [{ nome: 'Inativar', dados: { situacao: 'inativo' } }, { nome: 'Ativar', dados: { situacao: 'ativo' } }],
  chaveHistorico: r => r.codigo,
  tituloRegistro: r => r.codigo,
  msgDuplicado: 'Já existe local com este código'
});

// "Produtos guardados aqui": é isso que faz o local aparecer na Posição de estoque e no Inventário
function doLocal(id) { return PRODS.filter(p => p.local_id === id); }
function montarProdutos(m, r) {
  ANTES = r.id ? doLocal(r.id).map(p => p.id) : []; ESCOLHIDOS = new Set(ANTES);
  const q = s => m.querySelector(s), porId = id => PRODS.find(p => p.id === id);
  [...m.querySelectorAll('.grade-campos')].pop().insertAdjacentHTML('afterend', `<div class="secao">Produtos guardados aqui</div>
    <div id="lpChips" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px"></div>
    <div style="display:flex;gap:6px"><input id="lpBusca" list="lpLista" placeholder="Código ou descrição do produto" style="flex:1"><button type="button" class="btn" id="lpAdd">Adicionar</button></div>
    <datalist id="lpLista">${PRODS.map(p => `<option value="${esc(p.codigo || '')} — ${esc(p.descricao)}">`).join('')}</datalist>
    <p class="sub" id="lpMsg" style="margin:6px 0 0">O produto passa a mostrar este local na Posição de estoque e no Inventário.</p>`);
  const desenhar = () => q('#lpChips').innerHTML = [...ESCOLHIDOS].map(id => { const p = porId(id), outro = p.local_id && p.local_id !== r.id;
    return `<span class="tg neutro" style="display:inline-flex;gap:6px;align-items:center"><b>${esc(p.codigo || '')}</b> ${esc(p.descricao)}${outro ? ' <small>(sai do local atual)</small>' : ''}
      <a href="#" data-tira="${id}" title="Tirar deste local" style="color:var(--erro)">×</a></span>`; }).join('') || '<span class="sub">Nenhum produto ligado ainda.</span>';
  const achar = t => { t = t.trim().toUpperCase(); if (!t) return null; const cod = t.split(' — ')[0].trim();
    return PRODS.find(p => (p.codigo || '').toUpperCase() === cod) || PRODS.find(p => `${p.codigo} — ${p.descricao}`.toUpperCase() === t); };
  const add = () => { const p = achar(q('#lpBusca').value); if (!p) return aviso('Produto não encontrado (só os ativos que controlam estoque)', true);
    ESCOLHIDOS.add(p.id); q('#lpBusca').value = ''; desenhar(); };
  q('#lpAdd').onclick = add;
  q('#lpBusca').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); add(); } };
  q('#lpChips').onclick = e => { const a = e.target.closest('[data-tira]'); if (!a) return; e.preventDefault(); ESCOLHIDOS.delete(Number(a.dataset.tira)); desenhar(); };
  // Costume da equipe: código do local = código do produto. Liga sozinho quando ainda não há produto escolhido
  q('#f_codigo')?.addEventListener('change', e => { const p = achar(e.target.value);
    if (p && !ESCOLHIDOS.size) { ESCOLHIDOS.add(p.id); desenhar(); q('#lpMsg').textContent = `Ligado ao produto ${p.codigo} (mesmo código). Tire no × se não for ele.`; } });
  desenhar();
}
</script>
</body>
</html>
