<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Categorias financeiras · NOX ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css?v=202610231611">
<style>
  .arvore { white-space: nowrap; }
  .arvore.n1 { font-weight: 700; }
  .arvore.n2 { font-weight: 600; padding-left: 18px; }
  .arvore.n3 { padding-left: 36px; }
  .arvore.n4 { padding-left: 54px; color: var(--texto-suave); }
</style>
</head>
<body data-modulo="categorias_fin" data-titulo="Categorias financeiras">
<main id="conteudo"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../assets/js/supabase.js?v=202610231611"></script>
<script src="../../assets/js/ui.js?v=202610231611"></script>
<script src="../../assets/js/auth.js?v=202610231611"></script>
<script src="../../assets/js/layout.js?v=202610231611"></script>
<script src="../../assets/js/cadastro.js?v=202610231611"></script>
<script>
const TIPOS = [{ v: 'receita', n: 'Receita' }, { v: 'deducao', n: 'Dedução da receita (impostos, taxas de marketplace, devoluções)' },
  { v: 'custo', n: 'Custo de produção / mercadoria' }, { v: 'despesa', n: 'Despesa operacional' }, { v: 'investimento', n: 'Investimento (máquinas, obras)' },
  { v: 'financeiro', n: 'Resultado financeiro (juros, tarifas)' }, { v: 'transferencia', n: 'Transferência entre contas / empresas' }];
// Linhas do relatório de gestão (DRE gerencial)
const DRE = ['Receita bruta', 'Deduções da receita', 'Custo dos produtos vendidos', 'Despesas com vendas', 'Despesas administrativas',
  'Despesas com pessoal administrativo', 'Despesas de ocupação (galpão)', 'Resultado financeiro', 'Impostos sobre o lucro', 'Investimentos', 'Não entra no resultado'];
let TODAS = [];
const nivel = c => String(c || '').split('.').length;
const paiDe = r => TODAS.find(x => x.id === r.pai_id);

montarCadastro({
  textoNovo: '+ Nova categoria',
  tabela: 'categorias_financeiras', modulo: 'categorias_fin', titulo: 'Categorias financeiras', singular: 'categoria', plural: 'categorias',
  subtitulo: 'Plano gerencial único para as duas empresas. Produtos, notas de compra e contas a pagar/receber usam estas categorias; os relatórios separam por CNPJ ou consolidam.',
  dicaBusca: 'código, nome, linha do relatório, ID Tiny…', ordem: 'codigo', revisao: true,
  abas: { campo: 'tipo', padrao: '', opcoes: [{ v: '', n: 'Todas' }, ...TIPOS.map(t => ({ v: t.v, n: t.n.split(' (')[0].split(' /')[0] }))] },
  periodos: [{ campo: 'atualizado_em', label: 'Última alteração' }, { campo: 'criado_em', label: 'Cadastro' }],
  campos: [
    { id: 'codigo', label: 'Código', obrig: true, lista: true, placeholder: '2.01.003', ajuda: 'Números separados por ponto. O código do pai vem na frente (2 › 2.01 › 2.01.003).' },
    { id: 'nome', label: 'Nome', obrig: true, col: 3 },
    { id: 'pai_id', label: 'Categoria pai (grupo)', tipo: 'select', col: 2, opcoes: () => TODAS.filter(c => !c.aceita_lancamento).map(c => ({ v: c.id, n: `${c.codigo} ${c.nome}` })) },
    { id: 'tipo', label: 'Tipo', tipo: 'select', opcoes: TIPOS, obrig: true, col: 2 },
    { id: 'grupo_dre', label: 'Linha no relatório de gestão', tipo: 'select', opcoes: DRE, col: 2, filtro: true, filtroVazio: true },
    { id: 'natureza', label: 'Natureza', tipo: 'select', opcoes: [{ v: 'fixa', n: 'Fixa' }, { v: 'variavel', n: 'Variável' }], filtro: true, filtroVazio: true },
    { id: 'situacao', label: 'Situação', tipo: 'select', opcoes: [{ v: 'ativo', n: 'Ativa' }, { v: 'inativo', n: 'Inativa' }], obrig: true, padrao: 'ativo', filtro: true },
    { id: 'aceita_lancamento', label: 'Recebe lançamento', tipo: 'bool', padrao: true, textoBool: 'Sim (último nível)', filtro: true,
      ajuda: 'Desmarque para grupos que só somam as categorias de baixo.' },
    { id: 'aplica_produtos', label: 'Usar no cadastro de produtos', tipo: 'bool', padrao: false, textoBool: 'Aparece para escolher no produto', filtro: true },
    { id: 'id_tiny', label: 'ID no Tiny', ajuda: 'Usado pela integração para não duplicar.' },
    { id: 'descricao', label: 'O que entra / o que não entra', tipo: 'textarea', col: 4, secao: 'Orientação para quem lança',
      placeholder: 'ex.: tubos, curvas e chapas inox usados na produção. Não entra: ferramentas e abrasivos (2.04).' }
  ],
  async carregarExtra(linhas) {
    TODAS = linhas;
    const prods = await buscarTodos(() => db.from('produtos').select('categoria_financeira_id').not('categoria_financeira_id', 'is', null));
    const n = {}; prods.forEach(p => n[p.categoria_financeira_id] = (n[p.categoria_financeira_id] || 0) + 1);
    return { prods: n };
  },
  colunasExtras: [
    { label: 'Categoria', texto: r => '  '.repeat(nivel(r.codigo) - 1) + r.nome, html: r => `<span class="arvore n${Math.min(nivel(r.codigo), 4)}">${esc(r.nome)}</span>` },
    { label: 'Tipo', texto: r => (TIPOS.find(t => t.v === r.tipo)?.n || '').split(' (')[0].split(' /')[0] },
    { label: 'Linha do relatório', texto: r => r.grupo_dre || '' },
    { label: 'Lança?', texto: r => r.aceita_lancamento ? 'Sim' : 'Grupo' },
    { label: 'Produtos', texto: (r, e) => e.prods[r.id] ? String(e.prods[r.id]) : '' }
  ],
  textoBuscaExtra: r => `${r.nome} ${paiDe(r)?.nome || ''}`,
  antesSalvar: d => {
    if (d.pai_id) d.pai_id = Number(d.pai_id);
    if (d.codigo) d.codigo = d.codigo.replace(/\s/g, '');
    if (!d.aceita_lancamento) d.aplica_produtos = false;
  },
  validar: (d, r) => {
    if (!/^\d+(\.\d+)*$/.test(d.codigo)) return 'Código só com números separados por ponto (ex.: 2.01.003)';
    const pai = TODAS.find(x => x.id === d.pai_id);
    if (pai && pai.id === r?.id) return 'A categoria não pode ser pai dela mesma';
    if (pai && !d.codigo.startsWith(pai.codigo + '.')) return `O código deve começar com o do grupo pai (${pai.codigo}.)`;
    if (!pai && nivel(d.codigo) > 1) {
      const sugerido = TODAS.find(x => x.codigo === d.codigo.split('.').slice(0, -1).join('.'));
      if (sugerido) return `Escolha o grupo pai: ${sugerido.codigo} ${sugerido.nome}`;
    }
    if (r?.id && d.aceita_lancamento && TODAS.some(x => x.pai_id === r.id)) return 'Esta categoria tem subcategorias: ela precisa ser um grupo (sem lançamento)';
    return null;
  },
  pendencias: [
    { id: 'sem_pai', nome: 'Fora da hierarquia', cor: 'erro', bloqueia: true, teste: r => nivel(r.codigo) > 1 && !r.pai_id },
    { id: 'cod_pai', nome: 'Código diferente do grupo', cor: 'erro', bloqueia: true, teste: r => paiDe(r) && !r.codigo.startsWith(paiDe(r).codigo + '.') },
    { id: 'tipo_pai', nome: 'Tipo diferente do grupo', cor: 'alerta', teste: r => paiDe(r) && paiDe(r).tipo !== r.tipo },
    { id: 'sem_dre', nome: 'Sem linha no relatório', cor: 'alerta', bloqueia: true, teste: r => r.aceita_lancamento && r.situacao === 'ativo' && !r.grupo_dre },
    { id: 'grupo_vazio', nome: 'Grupo sem subcategorias', cor: 'neutro', teste: r => !r.aceita_lancamento && !TODAS.some(x => x.pai_id === r.id) },
    { id: 'prod_em_grupo', nome: 'Produtos ligados a grupo', cor: 'erro', teste: (r, e) => !r.aceita_lancamento && e.prods[r.id] }
  ],
  acoesLote: [{ nome: 'Inativar', dados: { situacao: 'inativo' } }, { nome: 'Ativar', dados: { situacao: 'ativo' } },
    { nome: 'Usar em produtos', dados: { aplica_produtos: true } }, { nome: 'Tirar de produtos', dados: { aplica_produtos: false } }],
  apagado: r => r.situacao === 'inativo',
  tituloRegistro: r => `${r.codigo} ${r.nome}`,
  // Agrupador: abre/recolhe por grupo (1 › 1.01 › 1.01.001) e ordena o código como número (2 antes de 10)
  arvore: { chave: r => r.codigo, pai: k => k.includes('.') ? k.slice(0, k.lastIndexOf('.')) : null },
  ordenarPor: { codigo: r => r.codigo.split('.').map(n => n.padStart(4, '0')).join('.') },
  msgDuplicado: 'Já existe categoria com este código'
});
</script>
</body>
</html>
