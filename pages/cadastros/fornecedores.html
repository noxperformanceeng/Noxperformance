<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fornecedores · NOX ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css?v=202611181101">
</head>
<body data-modulo="fornecedores" data-titulo="Fornecedores">
<main id="conteudo"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../assets/js/supabase.js?v=202611181101"></script>
<script src="../../assets/js/ui.js?v=202611181101"></script>
<script src="../../assets/js/auth.js?v=202611181101"></script>
<script src="../../assets/js/layout.js?v=202611181101"></script>
<script src="../../assets/js/cadastro.js?v=202611181101"></script>
<script src="../../assets/js/comprovante.js?v=202611181101"></script>
<script>
/* Outros nomes no comprovante (SQL 114/136): sócio, pessoa física, intermediador (ex.: Mercado Pago).
   O comprovante em nome de um deles passa na conferência. Incluir/excluir: só o master (um nome aqui libera pagamentos sem alerta). */
let EXTRA_FORN = null;
function htmlOutrosNomes(r, e) {
  EXTRA_FORN = e; const ls = e.apelidos?.[r.id] || [];
  return `<div class="secao">Outros nomes no comprovante (${ls.length})</div>
    <p class="sub" style="margin:0 0 6px">Pagamento feito em nome de outra pessoa ou empresa (sócio, pessoa física, intermediador). O comprovante com um destes nomes passa na conferência.${e.admin ? '' : ' Só o master inclui ou exclui.'}</p>
    ${ls.length ? `<table class="lista-mini"><tbody>${ls.map(x => `<tr><td><b>${esc(x.apelido)}</b></td><td class="sub">${x.anexo_id ? 'aprendido no ciente' : 'incluído no cadastro'} · ${dataHoraBR(x.criado_em)}</td>
      <td>${e.admin ? `<button type="button" class="btn discreto fino" data-apelido-rm="${x.id}">Excluir</button>` : ''}</td></tr>`).join('')}</tbody></table>` : ''}
    ${e.admin ? `<div style="display:flex;gap:8px;align-items:center;margin-top:6px"><input id="apNovo" placeholder="ex.: EDUARDO DE ARAUJO PAGAN" style="max-width:340px">
      <button type="button" class="btn fino" id="apIncluir">+ Incluir nome</button></div>` : ''}`;
}
function ligarOutrosNomes(m, r) {
  if (!r?.id) return;
  m.querySelector('#apIncluir')?.addEventListener('click', async () => {
    const nome = m.querySelector('#apNovo').value.trim().toUpperCase();
    if (nome.length < 3) return aviso('Escreva o nome como aparece no comprovante', true);
    const { error } = await db.from('fornecedores_apelidos').insert({ fornecedor_id: r.id, apelido: nome });
    if (error) return aviso('Não incluiu: ' + (/duplicate|unique/i.test(error.message) ? 'esse nome já está cadastrado' : error.message), true);
    m.querySelector('#apNovo').value = '';
    m.querySelector('#apIncluir').parentElement.insertAdjacentHTML('beforebegin', `<p style="margin:4px 0"><b>${esc(nome)}</b> <span class="sub">incluído agora</span></p>`);
    // os comprovantes pendentes deste fornecedor são conferidos de novo com o nome novo
    let msg = 'Nome incluído';
    try { const x = await reconferirPendentes(() => {}, r.id); if (x.liberados) msg += ` · ${x.liberados} comprovante(s) pendente(s) passaram a conferir`; } catch { /* segue: dá para reconferir nas Aprovações */ }
    aviso(msg);
  });
  m.querySelectorAll('[data-apelido-rm]').forEach(b => b.onclick = async () => {
    if (!confirm('Excluir este nome? Comprovantes futuros com ele voltam a pedir justificativa.')) return;
    const { error } = await db.from('fornecedores_apelidos').delete().eq('id', Number(b.dataset.apelidoRm));
    if (error) return aviso('Não excluiu: ' + error.message, true);
    b.closest('tr').remove(); aviso('Nome excluído');
  });
}
const IMPOSTO = 'Impostos e guias';
const SIT = [{ v: 'ativo', n: 'Ativo' }, { v: 'inativo', n: 'Inativo' }];
const CATEGORIAS = ['Matéria-prima', 'Usinagem (terceiro)', 'Corte a laser (terceiro)', 'Pintura (terceiro)', 'Polimento (terceiro)',
  'Embalagem', 'Ferramentas e abrasivos', 'Fixadores', 'Filtros e componentes', 'Serviços', 'Transporte', IMPOSTO, 'Outros'];
/* Categoria "Impostos e guias" (SQL 151): o órgão (Receita Federal, Caixa/FGTS, Sefaz, Prefeitura…) recebe um ou mais
   tipos de imposto = categorias financeiras de imposto. Ao salvar, os títulos a pagar sem fornecedor desses tipos
   passam a ser dele, e o comprovante da guia confere pelo nome do órgão. */
const ehImposto = c => /^(2\.01|8\.01|10\.04|6\.08)\./.test(c.codigo) || /FGTS|INSS/i.test(c.nome);
function montarImpostos(m, r, e) {
  const fCat = m.querySelector('#f_categoria'); if (!fCat) return;
  const marcados = new Set(r?.impostos || []), cats = (e.cats || []).filter(c => ehImposto(c) || marcados.has(c.id));
  fCat.closest('.campo').insertAdjacentHTML('afterend', `<div class="campo l4" id="impostosBox" hidden><label>Tipos de imposto pagos a este órgão</label>
    ${cats.length ? `<div style="display:flex;flex-wrap:wrap;gap:4px 16px">${cats.map(c => `<label class="chk"><input type="checkbox" data-imposto="${c.id}" ${marcados.has(c.id) ? 'checked' : ''}> ${esc(c.nome)}</label>`).join('')}</div>`
      : '<p class="sub" style="margin:0">Sem acesso às categorias financeiras: peça a quem cuida do financeiro para marcar os tipos de imposto.</p>'}
    <p class="ajuda">Ex.: Receita Federal → DAS, PIS, COFINS, IRPJ, CSLL, IRRF. Ao salvar, os títulos a pagar sem fornecedor desses tipos passam a ser deste órgão, e o comprovante da guia confere pelo nome dele.</p></div>`);
  const box = m.querySelector('#impostosBox'), mostrar = () => box.hidden = fCat.value !== IMPOSTO;
  fCat.addEventListener('change', mostrar); mostrar();
}

montarCadastro({
  tabela: 'fornecedores', modulo: 'fornecedores', titulo: 'Fornecedores', singular: 'fornecedor', plural: 'fornecedores',
  subtitulo: 'Quem fornece cada item. O vínculo com os produtos é feito na tela de Produtos.',
  dicaBusca: 'nome, nome fantasia, CNPJ, cidade, contato, produto…', ordem: 'nome', revisao: true,
  rapido: ['nome', 'cnpj', 'categoria', 'telefone'],   // novo fornecedor abre só com isto; o resto em "Mostrar todos os campos"
  abas: { campo: 'situacao', padrao: 'ativo', opcoes: [{ v: 'ativo', n: 'Ativos' }, { v: 'inativo', n: 'Inativos' }, { v: '', n: 'Todos' }] },
  periodos: [{ campo: 'atualizado_em', label: 'Última alteração' }, { campo: 'criado_em', label: 'Cadastro' }],
  campos: [
    { id: 'nome', label: 'Razão social / nome', obrig: true, col: 2, lista: true },
    { id: 'nome_fantasia', label: 'Nome fantasia', col: 2 },
    { id: 'tipo_pessoa', label: 'Tipo', tipo: 'select', opcoes: [{ v: 'PJ', n: 'Pessoa jurídica' }, { v: 'PF', n: 'Pessoa física' }], obrig: true, padrao: 'PJ' },
    { id: 'cnpj', label: 'CNPJ / CPF', tipo: 'cpfcnpj', lista: true },
    { id: 'ie', label: 'Inscrição estadual' },
    { id: 'categoria', label: 'Categoria', tipo: 'select', opcoes: CATEGORIAS, filtro: true, lista: true, filtroVazio: true },
    { id: 'situacao', label: 'Situação', tipo: 'select', opcoes: SIT, obrig: true, padrao: 'ativo' },
    { id: 'contato', label: 'Contato (pessoa)', secao: 'Contato', col: 2 },
    { id: 'telefone', label: 'Telefone / WhatsApp', tipo: 'tel', lista: true },
    { id: 'email', label: 'E-mail', tipo: 'email' },
    { id: 'site', label: 'Site', col: 2 },
    { id: 'cep', label: 'CEP', tipo: 'cep', secao: 'Endereço' },
    { id: 'endereco', label: 'Endereço', col: 2 },
    { id: 'numero', label: 'Número' },
    { id: 'complemento', label: 'Complemento' },
    { id: 'bairro', label: 'Bairro' },
    { id: 'cidade', label: 'Cidade', lista: true, filtro: true },
    { id: 'uf', label: 'UF', tipo: 'uf', filtro: true },
    { id: 'condicao_pagamento', label: 'Condição de pagamento', secao: 'Comercial', col: 2, placeholder: 'ex.: 28 dias boleto, à vista PIX' },
    { id: 'prazo_pagamento_dias', label: 'Prazo médio de pagamento (dias)', tipo: 'numero' },
    { id: 'prazo_entrega_dias', label: 'Prazo médio de entrega (dias)', tipo: 'numero' },
    { id: 'observacoes', label: 'Observações', tipo: 'textarea', col: 4, secao: 'Observações' }
  ],
  async carregarExtra(linhas, ctx) {
    const [v, ap, cf] = await Promise.all([buscarTodos(() => db.from('produto_fornecedores').select('fornecedor_id, codigo_fornecedor, preferencial, produtos(codigo, descricao, tipo, situacao)').order('id')),
      db.from('fornecedores_apelidos').select('id, fornecedor_id, apelido, anexo_id, criado_em').not('fornecedor_id', 'is', null).order('apelido'),
      db.from('categorias_financeiras').select('id, codigo, nome').eq('aceita_lancamento', true).eq('situacao', 'ativo').order('codigo')]);
    const por = {}, apelidos = {};
    v.forEach(x => (por[x.fornecedor_id] ||= []).push(x));
    (ap.data || []).forEach(x => (apelidos[x.fornecedor_id] ||= []).push(x));
    return (EXTRA_FORN = { produtos: por, apelidos, cats: cf.data || [], admin: !!ctx?.admin });
  },
  colunasExtras: [{ label: 'Produtos / impostos', texto: (r, e) => r.categoria === IMPOSTO ? (r.impostos || []).map(id => (e.cats || []).find(c => c.id === id)?.nome || '?').join(', ') : String((e.produtos[r.id] || []).length) }],
  textoBuscaExtra: (r, e) => (e.produtos[r.id] || []).map(x => `${x.produtos?.codigo} ${x.produtos?.descricao} ${x.codigo_fornecedor || ''}`).join(' '),
  subtituloLinha: r => r.nome_fantasia,
  secaoExtra: (r, e) => {
    const ps = e.produtos[r.id] || [];
    return `<div class="secao">Produtos vinculados (${ps.length})</div>` + (ps.length ? `<table class="lista-mini"><tbody>${ps.map(x =>
      `<tr><td><b>${esc(x.produtos?.codigo || '')}</b> ${esc(x.produtos?.descricao || '')}</td><td style="color:var(--texto-suave)">${x.codigo_fornecedor ? 'cód. ' + esc(x.codigo_fornecedor) : ''}</td><td>${x.preferencial ? '<span class="tg ok">preferencial</span>' : ''}</td></tr>`).join('')}</tbody></table>`
      : '<p class="sub" style="margin:0">Nenhum produto vinculado. O vínculo é feito no cadastro de Produtos.</p>')
      + htmlOutrosNomes(r, e);
  },
  aoAbrir: (m, r) => { montarImpostos(m, r, EXTRA_FORN || {}); ligarOutrosNomes(m, r); },
  antesSalvar: d => {
    const box = document.querySelector('#impostosBox'); if (!box?.querySelector('[data-imposto]')) return;   // sem acesso às categorias: não mexe
    const ids = d.categoria === IMPOSTO ? [...box.querySelectorAll('[data-imposto]:checked')].map(x => Number(x.dataset.imposto)) : [];
    d.impostos = ids.length ? ids : null;
  },
  validar: d => d.categoria === IMPOSTO && document.querySelector('#impostosBox [data-imposto]') && !d.impostos ? 'Marque ao menos um tipo de imposto pago a este órgão'
    : d.tipo_pessoa === 'PF' && d.cnpj && d.cnpj.length !== 11 ? 'Pessoa física deve ter CPF (11 dígitos)' : d.tipo_pessoa === 'PJ' && d.cnpj && d.cnpj.length !== 14 ? 'Pessoa jurídica deve ter CNPJ (14 dígitos)' : null,
  // órgão de imposto salvo: os títulos foram vinculados no banco; o master já reconfere os comprovantes pendentes dele
  async depoisSalvar(id, d) {
    if (d.categoria !== IMPOSTO || !EXTRA_FORN?.admin) return;
    try { const x = await reconferirPendentes(() => {}, id); if (x.liberados) aviso(`${x.liberados} comprovante(s) pendente(s) passaram a conferir`); } catch { /* dá para reconferir nas Aprovações */ }
  },
  pendencias: [
    { id: 'sem_doc', nome: 'Sem CNPJ/CPF', cor: 'erro', bloqueia: true, teste: r => !r.cnpj },
    { id: 'doc_inv', nome: 'Documento inválido', cor: 'erro', bloqueia: true, teste: r => r.cnpj && !(r.cnpj.length === 11 ? cpfValido(r.cnpj) : cnpjValido(r.cnpj)) },
    { id: 'sem_contato', nome: 'Sem telefone/e-mail', cor: 'alerta', bloqueia: true, teste: r => !r.telefone && !r.email && r.categoria !== IMPOSTO },
    { id: 'sem_imposto', nome: 'Órgão sem tipo de imposto', cor: 'alerta', bloqueia: true, teste: r => r.categoria === IMPOSTO && !r.impostos?.length },
    { id: 'sem_cat', nome: 'Sem categoria', cor: 'alerta', bloqueia: true, teste: r => !r.categoria },
    { id: 'sem_cidade', nome: 'Sem cidade', cor: 'alerta', teste: r => !r.cidade },
    { id: 'sem_prod', nome: 'Sem produtos vinculados', cor: 'neutro', teste: (r, e) => r.situacao === 'ativo' && r.categoria !== IMPOSTO && !(e.produtos[r.id] || []).length }
  ],
  acoesLote: [{ nome: 'Inativar', dados: { situacao: 'inativo' } }, { nome: 'Ativar', dados: { situacao: 'ativo' } }],
  apagado: r => r.situacao === 'inativo',
  msgDuplicado: 'Já existe fornecedor com este CNPJ/CPF'
});
</script>
</body>
</html>
