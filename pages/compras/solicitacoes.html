<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitações de compra · NOX ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css?v=202611141142">
<style>
  .sub-ed table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .sub-ed th { text-align: left; font-size: 11px; color: var(--texto-suave); font-weight: 500; padding: 0 3px 3px; white-space: nowrap; }
  .sub-ed td { padding: 2px 3px; border: 0; vertical-align: top; }
  .sub-ed input, .sub-ed select { padding: 5px 6px; font-size: 12.5px; }
  .sub-ed .rm { background: none; border: 0; color: var(--erro); cursor: pointer; font-size: 16px; }
  .sub-ed .ro { color: var(--texto-suave); font-size: 11px; margin-top: 2px; }
  .sc-fluxo { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; margin: 4px 0 8px; }
  .sc-fluxo span { padding: 3px 8px; border-radius: 10px; background: var(--fundo); color: var(--texto-suave); }
  .sc-fluxo span.ok { background: #e8f5ec; color: var(--ok); } .sc-fluxo span.agora { background: #fff4e5; color: #b45309; font-weight: 600; }
  .sc-fluxo span.erro { background: #fdeceb; color: var(--erro); font-weight: 600; } .sc-fluxo i { color: var(--texto-suave); font-style: normal; }
  .aviso-box { background: #fff4e5; color: #92400e; border-radius: 8px; padding: 8px 10px; font-size: 12.5px; margin: 6px 0; }
  .aviso-box.erro { background: #fdeceb; color: var(--erro); }
  .tg.pc { background: #f3effe; color: #6d28d9; }
  .fila-grupo td { padding-top: 10px !important; }
</style>
</head>
<body data-modulo="solicitacoes_compra" data-titulo="Solicitações de compra">
<main id="conteudo"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../assets/js/supabase.js?v=202611141142"></script>
<script src="../../assets/js/ui.js?v=202611141142"></script>
<script src="../../assets/js/auth.js?v=202611141142"></script>
<script src="../../assets/js/layout.js?v=202611141142"></script>
<script src="../../assets/js/cadastro.js?v=202611141142"></script>
<script>
/* =====================================================================
   Solicitações de compra (antes do pedido)
   Quem precisa pede produto/serviço do cadastro + quantidade + justificativa (sem fornecedor)
   → Aprovação da diretoria (central de Aprovações ou aqui) → Fila do comprador
   → Comprador marca itens (de uma ou várias solicitações), escolhe o fornecedor e gera o pedido em rascunho.
   Cada item guarda o pedido gerado; pedido cancelado devolve o item para a fila.
   ===================================================================== */
const SIT = [
  { v: 'em_aprovacao', n: 'Aguardando aprovação', cor: 'alerta' }, { v: 'recusado', n: 'Recusada (ajustar)', cor: 'erro' },
  { v: 'aprovado', n: 'Aprovada', cor: 'ok' }, { v: 'cancelado', n: 'Cancelada', cor: 'neutro' }];
const EDITAVEL = ['em_aprovacao', 'recusado'];
const URG = [{ v: 'baixa', n: 'Baixa', cor: 'neutro' }, { v: 'normal', n: 'Normal', cor: 'neutro' }, { v: 'alta', n: 'Alta', cor: 'alerta' }, { v: 'urgente', n: 'Urgente', cor: 'erro' }];
const pesoUrg = v => URG.findIndex(u => u.v === (v || 'normal'));
const tgUrg = v => { const u = URG[pesoUrg(v)] || URG[1]; return u.v === 'normal' ? '' : `<span class="tg ${u.cor}">${u.n}</span>`; };
// urgência da solicitação = a maior entre os itens
const urgDe = r => (ex.itens?.[r.id] || []).reduce((m, i) => pesoUrg(i.urgencia) > pesoUrg(m) ? i.urgencia : m, 'baixa');
const num = v => v == null || v === '' ? '' : Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 4 });
const hojeISO = () => new Date().toLocaleDateString('sv-SE');
let CTX = null, CAT = [], PEDS = {}, COTS = {}, USU = [], ACOES = new Set(), ex = {};
const sit = v => SIT.find(s => s.v === v) || { n: v, cor: 'neutro' };
const usu = id => USU.find(u => u.id === id)?.nome || '';
const itemCat = (t, id) => CAT.find(c => c.tipo === t && c.id === id);
const possoAprovar = () => CTX.admin || ACOES.has('compras.aprovar_solicitacao');
const souComprador = () => CTX.pode('cotacoes_compra', 'criar');
const minha = r => r.solicitante_id === CTX.usuario.id;
// item na fila do comprador: solicitação aprovada, sem cotação aberta e sem pedido ativo (cancelados devolvem o item)
const semPedido = i => !i.pedido_id || PEDS[i.pedido_id]?.situacao === 'cancelado';
const emCotacao = i => semPedido(i) && i.cotacao_id && COTS[i.cotacao_id]?.situacao === 'aberta';
const pendente = i => semPedido(i) && !emCotacao(i);
const itensDe = r => ex.itens?.[r.id] || [];
// etapa da solicitação para a lista: mostra o andamento da compra depois de aprovada
function etapa(r) {
  if (r.situacao !== 'aprovado') return sit(r.situacao);
  const its = itensDe(r), pend = its.filter(pendente).length;
  if (pend === its.length) return { n: 'Aprovada · aguardando comprador', cor: 'ok' };
  if (its.every(i => pendente(i) || emCotacao(i))) return { n: 'Em cotação', cor: 'alerta' };
  const peds = [...new Set(its.filter(i => !semPedido(i)).map(i => PEDS[i.pedido_id]))].filter(Boolean);
  if (pend || its.some(emCotacao)) return { n: `Em compra parcial (${its.length - pend}/${its.length})`, cor: 'pc' };
  return peds.every(p => p.situacao === 'recebido') ? { n: 'Recebida', cor: 'ok' } : { n: 'Em pedido de compra', cor: 'pc' };
}

/* ---------- Itens (sempre do cadastro de produtos ou de serviços) ---------- */
const optCat = (tipo, sel) => `<option value="">— escolha o ${tipo === 'servico' ? 'serviço' : 'produto'} —</option>` + CAT.filter(c => c.tipo === tipo)
  .map(c => `<option value="${c.id}"${c.id === sel ? ' selected' : ''}>${esc((c.codigo ? c.codigo + ' · ' : '') + c.descricao + (c.pendente ? ' (cadastro aguardando aprovação)' : ''))}</option>`).join('');
const linkCad = tipo => CTX.pode(tipo === 'servico' ? 'compras' : 'produtos', 'criar')
  ? `<a class="link-cad" data-link-cad href="${RAIZ}pages/cadastros/${tipo === 'servico' ? 'servicos' : 'produtos'}.html?novo=1" title="Não achou? Cadastre em outra aba; ao voltar, a lista é atualizada" style="white-space:nowrap">+ cadastrar</a>` : '';
function linhaItem(x = {}, ped = false) {
  const tipo = x.servico_id ? 'servico' : 'produto', p = x.pedido_id && PEDS[x.pedido_id];
  return `<tr data-id="${x.id || ''}">
    <td style="width:96px"><select data-k="tipo" data-simples><option value="produto"${tipo === 'produto' ? ' selected' : ''}>Produto</option><option value="servico"${tipo === 'servico' ? ' selected' : ''}>Serviço</option></select></td>
    <td style="min-width:260px"><div style="display:flex;gap:6px;align-items:center"><select data-k="item" style="flex:1;min-width:0">${optCat(tipo, x.produto_id || x.servico_id)}</select><span data-k="lk">${linkCad(tipo)}</span></div>
      <input data-k="observacao" placeholder="Detalhe (opcional): medida, cor, aplicação…" value="${esc(x.observacao || '')}" style="margin-top:3px"></td>
    <td style="width:62px"><input data-k="unidade" value="${esc(x.unidade || '')}" placeholder="un"></td>
    <td style="width:84px"><input data-k="quantidade" inputmode="decimal" value="${num(x.quantidade ?? 1)}"></td>
    <td style="width:100px"><select data-k="urgencia" data-simples>${URG.map(u => `<option value="${u.v}"${u.v === (x.urgencia || 'normal') ? ' selected' : ''}>${u.n}</option>`).join('')}</select></td>
    ${ped ? `<td>${p && p.situacao !== 'cancelado' ? `<span class="tg pc">${esc(p.numero)} · ${esc(p.situacao)}</span>` : emCotacao(x) ? `<span class="tg alerta">${esc(COTS[x.cotacao_id].numero)} · em cotação</span>` : '<span class="sub">aguardando comprador</span>'}</td>` : ''}
    <td style="width:22px"><button type="button" class="rm" title="Remover">×</button></td></tr>`;
}
function lerItens(m) {
  return [...m.querySelectorAll('#itens tbody tr')].map(tr => { const g = k => tr.querySelector(`[data-k=${k}]`), t = g('tipo').value, id = Number(g('item').value) || null;
    return { produto_id: t === 'produto' ? id : null, servico_id: t === 'servico' ? id : null, unidade: g('unidade').value.trim() || null,
      quantidade: lerNumero(g('quantidade').value) || 0, urgencia: g('urgencia').value, observacao: g('observacao').value.trim() || null }; })
    .filter(i => i.produto_id || i.servico_id || i.observacao);
}

/* ---------- Aprovar / recusar / cancelar ---------- */
async function decidir(r, aprovar) {
  let mot = null;
  if (!aprovar) { mot = prompt('Motivo da recusa (volta para quem pediu ajustar):'); if (!mot?.trim()) return; }
  const { error } = await db.rpc('aprovacao_decidir', { p_tipo: 'solicitacao_compra', p_ids: [r.id], p_aprovar: aprovar, p_motivo: mot });
  if (error) return aviso('Não salvou: ' + error.message, true);
  aviso(aprovar ? `${r.numero} aprovada · foi para o comprador` : `${r.numero} recusada · voltou para quem pediu`);
  document.querySelector('.modal-fundo')?.remove(); cfg.recarregar(); window.top.dispatchEvent(new Event('nox:aprovacoes'));
}
async function cancelar(r) {
  const mot = prompt(`Cancelar a solicitação ${r.numero}? Informe o motivo:`); if (!mot?.trim()) return;
  const { error } = await db.rpc('solicitacao_compra_cancelar', { p_id: r.id, p_motivo: mot });
  if (error) return aviso('Não cancelou: ' + error.message, true);
  aviso(`${r.numero} cancelada`); document.querySelector('.modal-fundo')?.remove(); cfg.recarregar();
}

/* ---------- Fila do comprador: gera o pedido de compra ---------- */
function abrirFila(soDe) {
  const sols = (cfg._linhas || []).filter(r => r.situacao === 'aprovado' && (!soDe || soDe.includes(r.id)))
    .sort((a, b) => pesoUrg(urgDe(b)) - pesoUrg(urgDe(a)) || String(a.data_necessidade || '9').localeCompare(String(b.data_necessidade || '9')) || a.id - b.id);
  const ls = sols.flatMap(r => itensDe(r).filter(pendente).map(i => ({ i, r })));
  const m = abrirModal(`<h2>Fila do comprador · gerar cotação</h2>
    <p class="sub" style="margin:0 0 6px">Itens de solicitações aprovadas que ainda não foram cotados. Marque os itens (pode juntar várias solicitações) e gere a cotação: os fornecedores do cadastro de cada produto já entram sugeridos, com o último preço. Na cotação você compara, escolhe o vencedor de cada item e gera um pedido por fornecedor.</p>
    ${!ls.length ? '<p class="sub">Nada na fila. ✓</p>' : `
    <div class="grade-campos"><div class="campo"><label>Empresa (CNPJ dos pedidos)</label><select id="fqEmp" data-simples>${CTX.empresas.map(e => `<option value="${e.id}"${e.id === (sols.find(r => r.empresa_id)?.empresa_id || CTX.empresa || CTX.empresas[0]?.id) ? ' selected' : ''}>${esc(e.nome)}</option>`).join('')}</select></div></div>
    <div class="sub-ed" style="max-height:52vh;overflow:auto"><table><thead><tr><th><input type="checkbox" id="fqTodos" title="Marcar todos"></th><th>Item</th><th class="num">Qtd</th><th>Un</th><th>Urgência</th><th>Precisa até</th><th>Solicitante</th></tr></thead><tbody>
    ${sols.filter(r => itensDe(r).some(pendente)).map(r => `<tr class="fila-grupo"><td colspan="7"><b>${esc(r.numero)}</b> <span class="sub">· ${esc(r.justificativa || '')}</span></td></tr>
      ${itensDe(r).filter(pendente).map(i => `<tr><td><input type="checkbox" data-i="${i.id}"${soDe ? ' checked' : ''}></td><td>${esc((itemCat(i.servico_id ? 'servico' : 'produto', i.produto_id || i.servico_id)?.codigo || '') + ' ' + (i.descricao || ''))}${i.servico_id ? ' <span class="tg neutro">serviço</span>' : ''}${i.observacao ? `<div class="ro">${esc(i.observacao)}</div>` : ''}</td>
        <td class="num">${num(i.quantidade)}</td><td>${esc(i.unidade || '')}</td><td>${tgUrg(i.urgencia) || 'Normal'}</td><td>${r.data_necessidade ? dataCurta(r.data_necessidade) : ''}</td><td>${esc(usu(r.solicitante_id))}</td></tr>`).join('')}`).join('')}
    </tbody></table></div>`}
    <div class="acoes"><button class="btn" id="fqN">Fechar</button>${ls.length ? '<button class="btn primario" id="fqS">Gerar cotação</button>' : ''}</div>`);
  m.querySelector('.modal').style.maxWidth = '960px';
  m.querySelector('#fqN').onclick = () => m.remove();
  m.querySelector('#fqTodos')?.addEventListener('change', e => m.querySelectorAll('[data-i]').forEach(c => c.checked = e.target.checked));
  m.querySelector('#fqS')?.addEventListener('click', async () => {
    const ids = [...m.querySelectorAll('[data-i]:checked')].map(c => Number(c.dataset.i)), emp = Number(m.querySelector('#fqEmp').value) || null;
    if (!ids.length) return aviso('Marque pelo menos um item', true);
    m.querySelector('#fqS').disabled = true;
    const { data, error } = await db.rpc('cotacao_criar', { p_itens: ids, p_empresa: emp });
    if (error) { m.querySelector('#fqS').disabled = false; return aviso('Não gerou: ' + error.message, true); }
    m.remove(); aviso('Cotação criada · abrindo para lançar os preços dos fornecedores');
    window.top.postMessage({ nox: 'abrir', url: RAIZ + 'pages/compras/cotacoes.html?abrir=' + data }, location.origin);
    cfg.recarregar();
  });
}

const cfg = {
  textoNovo: '+ Nova solicitação',
  tabela: 'solicitacoes_compra', modulo: 'solicitacoes_compra', titulo: 'Solicitações de compra', singular: 'solicitação', plural: 'solicitações',
  subtitulo: 'Peça aqui o que precisa comprar: produto ou serviço do cadastro (digite para buscar), quantidade, urgência e para quê. A diretoria aprova, o comprador cota com os fornecedores e gera os pedidos de compra.',
  dicaBusca: 'nº, item, justificativa, solicitante…', ordem: 'data_solicitacao', revisao: false, porEmpresa: false,
  abas: { campo: 'situacao', padrao: 'andamento', opcoes: [
    { v: 'andamento', n: 'Em andamento', teste: r => r.situacao === 'em_aprovacao' || r.situacao === 'recusado' || (r.situacao === 'aprovado' && itensDe(r).some(pendente)) },
    { v: 'minhas', n: 'Minhas', teste: r => minha(r) },
    { v: 'aprovacao', n: 'Aguardando aprovação', teste: r => r.situacao === 'em_aprovacao' },
    { v: 'fila', n: 'Fila do comprador', teste: r => r.situacao === 'aprovado' && itensDe(r).some(pendente) },
    { v: 'cotacao', n: 'Em cotação', teste: r => r.situacao === 'aprovado' && itensDe(r).some(emCotacao) },
    { v: 'pedido', n: 'Em pedido', teste: r => r.situacao === 'aprovado' && itensDe(r).some(i => !semPedido(i)) },
    { v: 'recusadas', n: 'Recusadas', teste: r => r.situacao === 'recusado' },
    { v: 'canceladas', n: 'Canceladas', teste: r => r.situacao === 'cancelado' },
    { v: '', n: 'Todas' }] },
  ordenarPor: { data_solicitacao: r => String(9e15 - Date.parse(r.data_solicitacao)) + String(1e12 - r.id).padStart(13, '0') },
  periodos: [{ campo: 'data_solicitacao', label: 'Data da solicitação' }, { campo: 'data_necessidade', label: 'Precisa até' }],
  campos: [
    { id: 'numero', label: 'Nº', somenteLeitura: true, lista: true },
    { id: 'data_solicitacao', label: 'Data', tipo: 'data', somenteLeitura: true, lista: true, padrao: () => hojeISO() },
    { id: 'situacao', label: 'Situação', tipo: 'select', opcoes: SIT, somenteLeitura: true, lista: true, filtro: true, padrao: 'em_aprovacao',
      listaHtml: r => { const e = etapa(r); return `<span class="tg ${e.cor}">${esc(e.n)}</span>`; } },
    { id: 'empresa_id', label: 'Empresa (CNPJ)', tipo: 'empresa', opcoes: ctx => ctx.empresas.map(e => ({ v: e.id, n: e.nome })), padrao: ctx => ctx.empresa || null,
      ajuda: 'Opcional: para qual empresa é a compra. O comprador pode trocar no pedido.' },
    { id: 'data_necessidade', label: 'Precisa até', tipo: 'data', lista: true },
    { id: 'justificativa', label: 'Justificativa / necessidade', tipo: 'textarea', col: 2, obrig: true, lista: true,
      listaHtml: r => `<span class="texto-curto" style="max-width:260px" title="${esc(r.justificativa)}">${esc(r.justificativa)}</span>` },
    { id: 'motivo_recusa', label: 'Motivo da recusa', col: 4, somenteLeitura: true, oculto: r => r.situacao !== 'recusado' },
    { id: 'motivo_cancelamento', label: 'Motivo do cancelamento', col: 4, somenteLeitura: true, oculto: r => r.situacao !== 'cancelado' }
  ],
  async carregarExtra(linhas, ctx) {
    CTX = ctx; cfg._linhas = linhas;
    const [it, cat, pe, us, ac, co] = await Promise.all([
      buscarTodos(() => db.from('solicitacoes_compra_itens').select('*').order('id')),
      db.rpc('sc_catalogo'), db.rpc('sc_pedidos'), db.rpc('usuarios_nomes'), db.rpc('minhas_acoes'), db.rpc('sc_cotacoes')
    ]);
    CAT = (cat.data || []).sort((a, b) => String(a.descricao).localeCompare(String(b.descricao), 'pt-BR'));
    PEDS = Object.fromEntries((pe.data || []).map(p => [p.id, p])); USU = us.data || []; ACOES = new Set(ac.data || []); COTS = Object.fromEntries((co.data || []).map(c => [c.id, c]));
    const itens = {}; it.forEach(x => (itens[x.solicitacao_id] ||= []).push(x));
    ex = { itens };
    return ex;
  },
  depoisCarregar: linhas => {
    cfg._linhas = linhas;
    if (souComprador() && !document.getElementById('btnFila')) {
      const novo = document.getElementById('cNovo'), b = document.createElement('button');
      b.className = 'btn primario'; b.id = 'btnFila'; b.onclick = () => abrirFila();
      (novo?.parentElement || document.getElementById('conteudo')).insertBefore(b, novo || null);
    }
    const b = document.getElementById('btnFila'); if (b) { const n = linhas.filter(r => r.situacao === 'aprovado').reduce((s, r) => s + itensDe(r).filter(pendente).length, 0); b.textContent = `Fila do comprador (${n})`; }
  },
  colunasExtras: [
    { label: 'Itens', texto: (r, e) => (e.itens[r.id] || []).map(i => `${num(i.quantidade)}× ${itemCat(i.servico_id ? 'servico' : 'produto', i.produto_id || i.servico_id)?.codigo || i.descricao}`).join(', '),
      html: (r, e) => { const t = (e.itens[r.id] || []).map(i => `${num(i.quantidade)}× ${itemCat(i.servico_id ? 'servico' : 'produto', i.produto_id || i.servico_id)?.codigo || i.descricao}`).join(', ');
        return `<span class="texto-curto" style="max-width:240px" title="${esc(t)}">${esc(t)}</span>`; } },
    { label: 'Urgência', texto: r => URG[pesoUrg(urgDe(r))]?.n || '', html: r => tgUrg(urgDe(r)) },
    { label: 'Solicitante', texto: r => usu(r.solicitante_id) },
    { label: 'Pedido de compra', texto: (r, e) => [...new Set((e.itens[r.id] || []).filter(i => i.pedido_id && PEDS[i.pedido_id]).map(i => PEDS[i.pedido_id].numero))].join(', ') }
  ],
  textoBuscaExtra: (r, e) => [usu(r.solicitante_id), ...(e.itens[r.id] || []).flatMap(i => [i.descricao, i.observacao, itemCat('produto', i.produto_id)?.codigo, PEDS[i.pedido_id]?.numero])].filter(Boolean).join(' '),
  apagado: r => r.situacao === 'cancelado',
  secaoExtra: r => {
    const e = etapa(r), passo = (t, cls) => `<span class="${cls}">${t}</span>`;
    const fluxo = [passo('Solicitada', 'ok'), passo(r.situacao === 'recusado' ? 'Recusada' : 'Aprovação', r.situacao === 'em_aprovacao' ? 'agora' : r.situacao === 'recusado' ? 'erro' : r.situacao === 'aprovado' ? 'ok' : ''),
      passo('Comprador', r.situacao === 'aprovado' ? (itensDe(r).some(pendente) ? 'agora' : 'ok') : ''),
      passo('Cotação', r.situacao === 'aprovado' && itensDe(r).some(emCotacao) ? 'agora' : r.situacao === 'aprovado' && itensDe(r).some(i => !semPedido(i)) ? 'ok' : ''),
      passo('Pedido de compra', r.situacao === 'aprovado' && itensDe(r).some(i => !semPedido(i)) ? 'ok' : '')].join('<i>›</i>');
    const peds = [...new Set(itensDe(r).filter(i => i.pedido_id).map(i => i.pedido_id))].map(id => PEDS[id]).filter(Boolean);
    const cots = [...new Set(itensDe(r).filter(i => i.cotacao_id).map(i => i.cotacao_id))].map(id => COTS[id]).filter(Boolean);
    const bts = [
      r.situacao === 'em_aprovacao' && possoAprovar() && (!minha(r) || CTX.admin) ? '<button type="button" class="btn primario" data-sc="aprovar">Aprovar</button><button type="button" class="btn" data-sc="recusar">Recusar…</button>' : '',
      r.situacao === 'aprovado' && souComprador() && itensDe(r).some(pendente) ? '<button type="button" class="btn primario" data-sc="pedido">Gerar cotação</button>' : '',
      r.situacao !== 'cancelado' && (minha(r) || CTX.pode('solicitacoes_compra', 'total')) && !itensDe(r).some(i => !semPedido(i) || emCotacao(i)) ? '<button type="button" class="btn discreto" data-sc="cancelar">Cancelar solicitação</button>' : ''].join('');
    return `<div class="secao">Andamento</div><div class="sc-fluxo">${fluxo}</div>
      <div class="sub">Pedida por <b>${esc(usu(r.solicitante_id))}</b>${r.decidido_em ? ` · ${r.situacao === 'recusado' ? 'recusada' : 'aprovada'} por <b>${esc(usu(r.decidido_por))}</b> em ${dataHoraBR(r.decidido_em)}` : ''} · <span class="tg ${e.cor}">${esc(e.n)}</span></div>
      ${cots.length ? `<div style="margin-top:6px">Cotação(ões): ${cots.map(c => CTX.pode('cotacoes_compra') ? `<a href="${RAIZ}pages/compras/cotacoes.html?abrir=${c.id}" class="tg ${c.situacao === 'cancelada' ? 'neutro' : 'alerta'}">${esc(c.numero)} · ${esc(c.situacao)}</a>` : `<span class="tg neutro">${esc(c.numero)} · ${esc(c.situacao)}</span>`).join(' ')}</div>` : ''}
      ${peds.length ? `<div style="margin-top:6px">Pedido(s) gerado(s): ${peds.map(p => `<a href="${RAIZ}pages/compras/pedidos.html?abrir=${p.id}" class="tg ${p.situacao === 'cancelado' ? 'neutro' : 'pc'}">${esc(p.numero)} · ${esc(p.fornecedor || '')} · ${esc(p.situacao)}</a>`).join(' ')}</div>` : ''}
      ${r.situacao === 'recusado' && minha(r) ? '<div class="aviso-box">Recusada: ajuste o que for preciso e salve para mandar de novo para aprovação.</div>' : ''}
      ${bts ? `<div class="acoes-pc" style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0">${bts}</div>` : ''}`;
  },
  aoAbrir(m, r, ctx) {
    const novo = !r.id, editavel = novo || (EDITAVEL.includes(r.situacao) && (minha(r) || ctx.pode('solicitacoes_compra', 'total')));
    const ped = r.situacao === 'aprovado';
    const box = document.createElement('div');
    box.innerHTML = `<div class="sub-ed" id="itens"><div class="secao">O que precisa comprar</div>
      <table><thead><tr><th>Tipo</th><th>Produto ou serviço (do cadastro)</th><th>Un</th><th>Qtd</th><th>Urgência</th>${ped ? '<th>Pedido</th>' : ''}<th></th></tr></thead>
      <tbody>${(novo ? [{}] : itensDe(r)).map(x => linhaItem(x, ped)).join('')}</tbody></table>
      ${editavel ? '<div style="margin-top:6px"><button type="button" class="btn fino" id="addItem">+ Item</button> <span class="sub">Não achou o item? Use "+ cadastrar" ao lado da lista.</span></div>' : ''}</div>`;
    const antes = [...m.querySelectorAll('.secao')].find(s => s.textContent === 'Andamento' || s.textContent === 'Histórico');
    antes ? antes.parentNode.insertBefore(box, antes) : m.querySelector('.acoes').before(box);
    m.querySelectorAll('[data-sc]').forEach(b => b.onclick = () => ({ aprovar: () => decidir(r, true), recusar: () => decidir(r, false), cancelar: () => cancelar(r),
      pedido: () => { m.remove(); abrirFila([r.id]); } })[b.dataset.sc]());
    if (!editavel) {
      box.querySelectorAll('input, select, button.rm').forEach(i => i.disabled = true);
      m.querySelectorAll('.campo input, .campo select, .campo textarea').forEach(i => i.disabled = true);
      m.querySelector('#mSalvar')?.remove();
      return;
    }
    m.querySelector('#addItem').onclick = () => box.querySelector('tbody').insertAdjacentHTML('beforeend', linhaItem());
    box.addEventListener('click', e => { if (e.target.classList.contains('rm')) e.target.closest('tr').remove(); });
    box.addEventListener('change', e => {
      const tr = e.target.closest('tr'); if (!tr) return;
      if (e.target.dataset.k === 'tipo') { const t = e.target.value; tr.querySelector('[data-k=item]').innerHTML = optCat(t); tr.querySelector('[data-k=lk]').innerHTML = linkCad(t); tr.querySelector('[data-k=unidade]').value = ''; }
      if (e.target.dataset.k === 'item') { const c = itemCat(tr.querySelector('[data-k=tipo]').value, Number(e.target.value)); if (c?.unidade) tr.querySelector('[data-k=unidade]').value = c.unidade; }
    });
    if (!novo && r.situacao === 'em_aprovacao') m.querySelector('#cAviso').innerHTML = '<div class="aviso-box">Ainda aguardando aprovação: se alterar, ela continua na fila da diretoria com os dados novos.</div>';
  },
  validar: (d, r) => {
    const its = lerItens(document.querySelector('.modal-fundo'));
    if (!its.length) return 'Inclua pelo menos um item';
    if (its.some(i => !i.produto_id && !i.servico_id)) return 'Escolha o produto ou serviço do cadastro em cada item (se não existir, use "+ cadastrar")';
    if (its.some(i => !(i.quantidade > 0))) return 'Item com quantidade zerada';
    return null;
  },
  async salvar(dados, r, m, novo) {
    const { data, error } = await db.rpc('solicitacao_compra_salvar', { p_sol: { ...dados, id: novo ? null : r.id }, p_itens: lerItens(m) });
    if (error) throw error;
    window.top.dispatchEvent(new Event('nox:aprovacoes'));
    if (novo) setTimeout(() => aviso('Solicitação enviada para aprovação da diretoria'), 600);
    return data;
  },
  // Voltou do "+ cadastrar": refaz as listas de cada item sem perder o que foi escolhido
  aoRecarregarListas(m) {
    m.querySelectorAll('#itens tbody tr').forEach(tr => { const sel = tr.querySelector('[data-k=item]'), v = sel.value; sel.innerHTML = optCat(tr.querySelector('[data-k=tipo]').value, Number(v) || null); sel.value = v; });
  },
  tituloRegistro: r => `${r.numero} · ${sit(r.situacao).n}`,
  chaveHistorico: r => r.numero
};
montarCadastro(cfg);
</script>
</body>
</html>
