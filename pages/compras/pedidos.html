<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedidos de compra · NOX ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css?v=202610270902">
<style>
  .pc-alertas { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
  .pc-alertas button { border: 1px solid var(--linha); background: var(--superficie); border-radius: 8px; padding: 6px 10px; font: 500 12.5px var(--fonte); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .pc-alertas button b { font-size: 14px; }
  .pc-alertas .erro { border-color: #f3c3bf; color: var(--erro); background: #fdeceb; }
  .pc-alertas .alerta { border-color: #f6d7a7; color: #b45309; background: #fff4e5; }
  .pc-alertas .info { border-color: #d9ccfb; color: #6d28d9; background: #f3effe; }
  .sub-ed table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .sub-ed th { text-align: left; font-size: 11px; color: var(--texto-suave); font-weight: 500; padding: 0 3px 3px; white-space: nowrap; }
  .sub-ed td { padding: 2px 3px; border: 0; vertical-align: top; }
  .sub-ed input, .sub-ed select { padding: 5px 6px; font-size: 12.5px; }
  .sub-ed .rm { background: none; border: 0; color: var(--erro); cursor: pointer; font-size: 16px; }
  .sub-ed td.num { text-align: right; padding-top: 7px; white-space: nowrap; }
  .sub-ed .ro { color: var(--texto-suave); font-size: 11px; margin-top: 2px; }
  .tot-ped { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; margin-top: 6px; }
  .tot-ped b { font-variant-numeric: tabular-nums; }
  .fluxo-pc { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; margin: 4px 0 8px; }
  .fluxo-pc span { padding: 3px 8px; border-radius: 10px; background: var(--fundo); color: var(--texto-suave); }
  .fluxo-pc span.ok { background: #e8f5ec; color: var(--ok); }
  .fluxo-pc span.agora { background: #fff4e5; color: #b45309; font-weight: 600; }
  .fluxo-pc span.erro { background: #fdeceb; color: var(--erro); font-weight: 600; }
  .fluxo-pc i { color: var(--texto-suave); font-style: normal; }
  .acoes-pc { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 4px; }
  .linha-tempo { list-style: none; margin: 0; padding: 0; font-size: 12.5px; max-height: 220px; overflow: auto; }
  .linha-tempo li { padding: 4px 0 4px 14px; border-left: 2px solid var(--linha); margin-left: 4px; position: relative; }
  .linha-tempo li::before { content: ''; position: absolute; left: -5px; top: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--linha); }
  .linha-tempo li.recusado::before, .linha-tempo li.cancelado::before { background: var(--erro); }
  .linha-tempo li.aprovado::before, .linha-tempo li.aprovado_nivel::before, .linha-tempo li.recebido::before { background: var(--ok); }
  .linha-tempo small { color: var(--texto-suave); }
  .tg.pc { background: #f3effe; color: #6d28d9; }
  .aviso-box { background: #fff4e5; color: #92400e; border-radius: 8px; padding: 8px 10px; font-size: 12.5px; margin: 6px 0; }
  .aviso-box.erro { background: #fdeceb; color: var(--erro); }
  .alc td { padding: 3px 4px; vertical-align: top; }
  .alc .aprov { display: flex; flex-wrap: wrap; gap: 2px 10px; max-width: 360px; font-size: 12px; }
</style>
</head>
<body data-modulo="compras" data-titulo="Pedidos de compra" data-empresa="sim">
<main id="conteudo"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../assets/js/supabase.js?v=202610270902"></script>
<script src="../../assets/js/ui.js?v=202610270902"></script>
<script src="../../assets/js/auth.js?v=202610270902"></script>
<script src="../../assets/js/layout.js?v=202610270902"></script>
<script src="../../assets/js/cadastro.js?v=202610270902"></script>
<script>
/* =====================================================================
   Pedidos de compra
   Rascunho → Em aprovação (escala por valor) → Aprovado → Enviado ao fornecedor → Recebido (NF)
   · Recusado volta para o comprador ajustar (não cancela).
   · Aprovado: parcelas entram no contas a pagar como projeção "aguardando NF" (fluxo de caixa).
   · Recebimento da NF: vira título real com rateio por categoria; projeção fica só com o saldo.
   · Tudo registrado na linha do tempo do pedido.
   ===================================================================== */
const SIT = [
  { v: 'rascunho', n: 'Rascunho', cor: 'neutro' }, { v: 'em_aprovacao', n: 'Em aprovação', cor: 'alerta' },
  { v: 'recusado', n: 'Recusado (ajustar)', cor: 'erro' }, { v: 'aprovado', n: 'Aprovado · enviar', cor: 'ok' },
  { v: 'enviado', n: 'Enviado · aguardando entrega', cor: 'pc' }, { v: 'recebido_parcial', n: 'Recebido parcial', cor: 'alerta' },
  { v: 'recebido', n: 'Recebido', cor: 'ok' }, { v: 'cancelado', n: 'Cancelado', cor: 'neutro' }];
const EDITAVEL = ['rascunho', 'recusado'], FINAL = ['recebido', 'cancelado'];
const reais = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const num = v => v == null || v === '' ? '' : Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 4 });
const hojeISO = () => new Date().toLocaleDateString('sv-SE');
const somaDias = (iso, d) => { const x = new Date(iso + 'T12:00:00'); x.setDate(x.getDate() + d); return x.toLocaleDateString('sv-SE'); };
let FORN = [], PRODS = [], CATS = [], CONDS = [], FORMAS = [], CONTAS = [], ALC = [], USU = [], EMPRESAS = [], PF = [], FICHAS = {}, ACOES = new Set(), CTX = null, modalAtual = null, ex = {}, sujo = false;
const forn = id => FORN.find(f => f.id === id);
const prod = id => PRODS.find(p => p.id === id);
const cat = id => CATS.find(c => c.id === id);
const usu = id => USU.find(u => u.id === id)?.nome || '';
const sit = v => SIT.find(s => s.v === v) || { n: v, cor: 'neutro' };
const norm = t => String(t || '').trim().toLowerCase();
// itens sem cadastro ainda não liberados pelo administrador (bloqueiam o envio para aprovação)
const avulsosPendentes = r => (ex.itens?.[r.id] || []).filter(i => !i.produto_id && !((r.liberacao_avulso?.itens) || []).map(norm).includes(norm(i.descricao)));
const possoLiberar = () => CTX.admin || ACOES.has('compras.liberar_avulso');

/* ---------- Escala de aprovação ---------- */
const nivelAtual = r => (r.niveis_exigidos || []).filter(n => !(r.niveis_aprovados || []).includes(n)).sort((a, b) => a - b)[0];
const alcadasDoNivel = (r, n) => ALC.filter(a => a.ativo && a.nivel === n && (!a.empresa_id || a.empresa_id === r.empresa_id));
function possoAprovar(r) {
  if (r.situacao !== 'em_aprovacao') return false;
  const n = nivelAtual(r); if (n == null) return false;
  if (CTX.admin) return true;
  if (n === 0) return ACOES.has('compras.aprovar');
  return alcadasDoNivel(r, n).some(a => (a.aprovadores || []).includes(CTX.usuario.id));
}
const nomeNivel = (r, n) => n === 0 ? 'Aprovação' : (alcadasDoNivel(r, n).map(a => a.nome).join(' / ') || 'Nível ' + n);
const quemAprova = (r, n) => n === 0 ? 'quem tem a ação "Aprovar pedidos de compra" ou administrador'
  : [...new Set(alcadasDoNivel(r, n).flatMap(a => a.aprovadores || []).map(usu).filter(Boolean))].join(', ') || 'administrador';

/* ---------- Itens ---------- */
const optProds = sel => '<option value="">— item sem cadastro —</option>' + PRODS.filter(p => (p.situacao === 'ativo' && (p.aprovacao || 'aprovado') === 'aprovado') || p.id === sel)
  .map(p => `<option value="${p.id}"${p.id === sel ? ' selected' : ''}>${esc((p.codigo || '—') + ' · ' + p.descricao)}</option>`).join('');
const optCats = sel => '<option value="">— categoria —</option>' + CATS.filter(c => c.ativo || c.id === sel).map(c => `<option value="${c.id}"${c.id === sel ? ' selected' : ''}>${esc(c.codigo + ' ' + c.nome)}</option>`).join('');
function ultimoPreco(produtoId, fornId) {
  const l = (ex.todosItens || []).filter(i => i.produto_id === produtoId && i.valor_unitario > 0)
    .map(i => ({ ...i, p: ex.porId[i.pedido_id] })).filter(i => i.p && i.p.situacao !== 'cancelado')
    .sort((a, b) => (b.p.fornecedor_id === fornId) - (a.p.fornecedor_id === fornId) || b.p.data_pedido.localeCompare(a.p.data_pedido));
  return l[0] ? { v: Number(l[0].valor_unitario), d: l[0].p.data_pedido, n: l[0].p.numero, f: l[0].p.fornecedor_id } : null;
}
const BARRA_PADRAO = 1000, CAT_USINAGEM = '3.05.005';
const optPecasUsi = sel => '<option value="">— peça que volta usinada —</option>' + PRODS.filter(p => FICHAS[p.id] && (p.situacao === 'ativo' || p.id === sel))
  .sort((a, b) => String(a.codigo).localeCompare(String(b.codigo), 'pt-BR', { numeric: true }))
  .map(p => `<option value="${p.id}"${p.id === sel ? ' selected' : ''}>${esc((p.codigo || '—') + ' · ' + p.descricao)}</option>`).join('');
// material a enviar (mesma conta da planilha): peças por barra = piso(barra ÷ (peça + perda)); barras = teto(peças ÷ peças por barra)
function calcMaterial(f, qtd, barra) {
  const comp = Number(f?.comprimento_mm), perda = Number(f?.perda_mm || 0), b = Number(barra);
  if (!(comp > 0) || !(b > 0)) return null;
  const pb = Math.floor(b / (comp + perda)); if (!(pb > 0)) return { pb: 0, barras: null, comp, perda };
  return { pb, barras: qtd > 0 ? Math.ceil(qtd / pb) : 0, comp, perda };
}
const linhaServico = (x = {}, rec = false) => `<tr data-id="${x.id || ''}" data-tipo="servico_usinagem">
  <td style="min-width:220px"><span class="tg pc">serviço de usinagem</span>
    <select data-k="produto_id" style="margin-top:3px">${optPecasUsi(x.produto_id)}</select>
    <input data-k="descricao" value="${esc(x.descricao || '')}" style="display:none">
    <label class="ro" style="display:flex;gap:6px;align-items:center;margin-top:3px">Barra enviada (mm)
      <input data-k="barra_mm" inputmode="decimal" value="${num(x.barra_mm || BARRA_PADRAO)}" style="width:70px"></label>
    <div class="ro" data-k="info"></div></td>
  <td style="width:58px"><input data-k="unidade" value="${esc(x.unidade || 'PÇ')}"></td>
  <td style="width:76px"><input data-k="quantidade" inputmode="decimal" value="${num(x.quantidade ?? 1)}"></td>
  <td style="width:92px"><input data-k="valor_unitario" inputmode="decimal" value="${num(x.valor_unitario)}"></td>
  <td style="width:76px"><input data-k="desconto" inputmode="decimal" value="${x.desconto ? num(x.desconto) : ''}" placeholder="0,00"></td>
  <td style="min-width:150px"><select data-k="categoria_financeira_id" data-simples>${optCats(x.categoria_financeira_id || CATS.find(c => c.codigo === CAT_USINAGEM)?.id)}</select></td>
  <td class="num" data-k="total"></td>
  ${rec ? `<td class="num">${num(x.quantidade_recebida || 0)} / ${num(x.quantidade)}</td>` : ''}
  <td style="width:22px"><button type="button" class="rm" title="Remover">×</button></td></tr>`;
// ao escolher a peça: preço e fornecedor da ficha; sempre: recalcula o material a enviar
function aoEscolherServico(tr, escolheu) {
  const pid = Number(tr.querySelector('[data-k=produto_id]').value) || null, f = FICHAS[pid], p = prod(pid);
  if (p) tr.querySelector('[data-k=descricao]').value = 'SERVIÇO DE USINAGEM · ' + p.descricao;
  if (escolheu && f) {
    const vu = tr.querySelector('[data-k=valor_unitario]'); if (!lerNumero(vu.value) && Number(f.preco_servico)) vu.value = num(f.preco_servico);
    const sf = modalAtual.querySelector('#f_fornecedor_id'); if (sf && !sf.value && f.fornecedor_id) { sf.value = f.fornecedor_id; sf.dispatchEvent(new Event('change', { bubbles: true })); }
  }
  atualizarServico(tr);
}
// quadro "separar e enviar": soma as barras por material, com a lista das peças de cada um
function resumoMaterial() {
  const el = modalAtual?.querySelector('#matBox'); if (!el) return;
  const g = {};
  modalAtual.querySelectorAll('#itens tbody tr[data-tipo=servico_usinagem]').forEach(tr => {
    const pid = Number(tr.querySelector('[data-k=produto_id]').value) || null, f = FICHAS[pid]; if (!pid) return;
    const q = lerNumero(tr.querySelector('[data-k=quantidade]').value) || 0, barra = lerNumero(tr.querySelector('[data-k=barra_mm]').value) || 0, c = calcMaterial(f, q, barra);
    const mat = (f?.material || '').trim() || 'MATERIAL NÃO INFORMADO NA FICHA', k = mat + '|' + barra, x = (g[k] ||= { mat, barra, barras: 0, pecas: [], falta: false });
    if (c?.barras) x.barras += c.barras; else x.falta = true;
    x.pecas.push(`${esc(prod(pid)?.codigo || '')} × ${num(q)} pç${c?.barras ? ' = ' + num(c.barras) + ' barra(s)' : ' (sem cálculo)'}`);
  });
  const l = Object.values(g);
  el.innerHTML = l.length ? `<div class="secao">Material para separar e enviar ao prestador</div><table class="lista-mini"><thead><tr><th>Material</th><th>Barra (mm)</th><th class="num">Barras</th><th>Peças</th></tr></thead><tbody>
    ${l.map(x => `<tr><td><b>${esc(x.mat)}</b></td><td>${num(x.barra)}</td><td class="num"><b>${num(x.barras)}</b>${x.falta ? ' <span class="tg alerta">incompleto</span>' : ''}</td><td>${x.pecas.join('<br>')}</td></tr>`).join('')}</tbody></table>
    <div class="sub" style="margin:2px 0 6px">Esse material sai do nosso estoque e vai junto com o pedido. A usinagem devolve só as peças prontas.</div>` : '';
}
function atualizarServico(tr) {
  const info = tr.querySelector('[data-k=info]'), pid = Number(tr.querySelector('[data-k=produto_id]').value) || null, f = FICHAS[pid];
  const q = lerNumero(tr.querySelector('[data-k=quantidade]').value) || 0, barra = lerNumero(tr.querySelector('[data-k=barra_mm]').value) || 0;
  if (!f) { info.innerHTML = pid ? '<span class="tg alerta">peça sem ficha de usinagem</span>' : ''; return; }
  const c = calcMaterial(f, q, barra), fid = Number(modalAtual.querySelector('#f_fornecedor_id')?.value);
  const linhas = [];
  if (!c) linhas.push('<span class="tg alerta">ficha sem comprimento da peça — não dá para calcular o material</span>');
  else if (!c.pb) linhas.push(`<span class="tg erro">a peça (${num(c.comp)} + ${num(c.perda)} mm) não cabe na barra de ${num(barra)} mm</span>`);
  else linhas.push(`<b>Material a enviar: ${num(c.barras)} barra(s) de ${num(barra)} mm</b> · ${esc(f.material || 'material não informado na ficha')} · ${num(c.pb)} peça(s)/barra (peça ${num(c.comp)} mm + perda ${num(c.perda)} mm)`);
  if (f.fornecedor_id && fid && f.fornecedor_id !== fid) linhas.push(`<span class="tg alerta">a ficha desta peça é do fornecedor ${esc(nomeComFantasia(forn(f.fornecedor_id)))}</span>`);
  if (!Number(f.preco_servico)) linhas.push('<span class="tg neutro">ficha sem preço do serviço</span>');
  info.innerHTML = linhas.join('<br>');
}
const linhaItem = (x = {}, rec = false) => x.tipo_item === 'servico_usinagem' ? linhaServico(x, rec) : `<tr data-id="${x.id || ''}">
  <td style="min-width:220px"><select data-k="produto_id">${optProds(x.produto_id)}</select>
    <input data-k="descricao" placeholder="Descrição do item (sem cadastro)" value="${esc(x.produto_id ? '' : x.descricao || '')}" style="margin-top:3px;${x.produto_id ? 'display:none' : ''}">
    <label class="ro" style="display:flex;gap:5px;align-items:center;margin-top:3px"><input type="checkbox" data-k="uso_consumo"${x.uso_consumo ? ' checked' : ''}> uso e consumo interno (manutenção, não entra no estoque)</label>
    <div class="ro" data-k="info">${!x.produto_id && x.id ? '<span class="tg alerta">sem cadastro · precisa de liberação do administrador</span>' : ''}</div></td>
  <td style="width:58px"><input data-k="unidade" value="${esc(x.unidade || '')}" placeholder="un"></td>
  <td style="width:76px"><input data-k="quantidade" inputmode="decimal" value="${num(x.quantidade ?? 1)}"></td>
  <td style="width:92px"><input data-k="valor_unitario" inputmode="decimal" value="${num(x.valor_unitario)}"></td>
  <td style="width:76px"><input data-k="desconto" inputmode="decimal" value="${x.desconto ? num(x.desconto) : ''}" placeholder="0,00"></td>
  <td style="min-width:150px"><select data-k="categoria_financeira_id" data-simples${x.produto_id && !x.uso_consumo && prod(x.produto_id)?.categoria_financeira_id ? ' disabled title="Categoria do cadastro do produto"' : ''}>${optCats(x.categoria_financeira_id)}</select></td>
  <td class="num" data-k="total"></td>
  ${rec ? `<td class="num">${num(x.quantidade_recebida || 0)} / ${num(x.quantidade)}</td>` : ''}
  <td style="width:22px"><button type="button" class="rm" title="Remover">×</button></td></tr>`;
// categoria: item com produto usa a do cadastro (travada); uso e consumo interno libera a escolha
function travarCategoria(tr) {
  const pid = Number(tr.querySelector('[data-k=produto_id]').value) || null, p = prod(pid), uso = tr.querySelector('[data-k=uso_consumo]')?.checked, c = tr.querySelector('[data-k=categoria_financeira_id]');
  if (!c || tr.dataset.tipo === 'servico_usinagem') return;
  if (p && !uso && p.categoria_financeira_id) { c.value = p.categoria_financeira_id; c.disabled = true; c.title = 'Categoria do cadastro do produto'; }
  else { c.disabled = false; c.title = uso ? 'Uso e consumo interno: escolha a categoria (ex.: manutenção)' : ''; }
}
function lerItens() {
  return [...(modalAtual?.querySelectorAll('#itens tbody tr') || [])].map(tr => {
    const g = k => tr.querySelector(`[data-k=${k}]`);
    const pid = Number(g('produto_id').value) || null, srv = tr.dataset.tipo === 'servico_usinagem';
    return { ...(srv ? { tipo_item: 'servico_usinagem', barra_mm: lerNumero(g('barra_mm').value) || null } : {}),
      produto_id: pid, descricao: srv ? g('descricao').value.trim() : pid ? prod(pid)?.descricao : g('descricao').value.trim(), unidade: g('unidade').value.trim() || null,
      quantidade: lerNumero(g('quantidade').value) || 0, valor_unitario: lerNumero(g('valor_unitario').value) || 0, desconto: lerNumero(g('desconto').value) || 0,
      categoria_financeira_id: Number(g('categoria_financeira_id').value) || null, uso_consumo: !srv && !!g('uso_consumo')?.checked,
      codigo_fornecedor: pid ? PF.find(x => x.produto_id === pid && x.fornecedor_id === Number(modalAtual.querySelector('#f_fornecedor_id')?.value))?.codigo_fornecedor || null : null };
  }).filter(x => x.produto_id || (x.descricao && x.tipo_item !== 'servico_usinagem') || x.valor_unitario);
}
function recalcular() {
  if (!modalAtual) return;
  let t = 0;
  modalAtual.querySelectorAll('#itens tbody tr').forEach(tr => {
    const q = lerNumero(tr.querySelector('[data-k=quantidade]').value) || 0, u = lerNumero(tr.querySelector('[data-k=valor_unitario]').value) || 0, d = lerNumero(tr.querySelector('[data-k=desconto]').value) || 0;
    const v = Math.round((q * u - d) * 100) / 100; t += v; tr.querySelector('[data-k=total]').textContent = reais(v);
    if (tr.dataset.tipo === 'servico_usinagem') atualizarServico(tr);
  });
  resumoMaterial();
  const v = id => lerNumero(modalAtual.querySelector('#f_' + id)?.value) || 0;
  const total = t + v('frete') + v('outras_despesas') - v('desconto');
  const fTot = modalAtual.querySelector('#f_valor_total'); if (fTot) fTot.value = total.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
  modalAtual.querySelector('#totPed').innerHTML = `<span>Itens <b>${reais(t)}</b></span><span>Frete + outras <b>${reais(v('frete') + v('outras_despesas'))}</b></span><span>Desconto <b>${reais(v('desconto'))}</b></span><span>Total do pedido <b>${reais(total)}</b></span>`;
}
function aoEscolherProduto(tr) {
  const pid = Number(tr.querySelector('[data-k=produto_id]').value) || null, p = prod(pid), fid = Number(modalAtual.querySelector('#f_fornecedor_id')?.value);
  tr.querySelector('[data-k=descricao]').style.display = pid ? 'none' : '';
  const info = tr.querySelector('[data-k=info]');
  if (!p) { info.innerHTML = '<span class="tg alerta">sem cadastro · precisa de liberação do administrador</span>'; return; }
  const un = tr.querySelector('[data-k=unidade]'); if (!un.value) un.value = p.unidade_compra || p.unidade || '';
  travarCategoria(tr);
  const up = ultimoPreco(pid, fid), vu = tr.querySelector('[data-k=valor_unitario]');
  if (up && !lerNumero(vu.value)) vu.value = num(up.v);
  const cf = PF.find(x => x.produto_id === pid && x.fornecedor_id === fid)?.codigo_fornecedor;
  info.innerHTML = [p.categoria_financeira_id ? '' : '<span class="tg alerta">produto sem categoria financeira no cadastro</span>', cf ? 'cód. fornecedor ' + esc(cf) : '', up ? `último preço ${reais(up.v)} (${esc(up.n)} · ${dataCurta(up.d)}${up.f !== fid ? ' · outro fornecedor' : ''})` : ''].filter(Boolean).join(' · ');
  recalcular();
}

  if (s === 'em_aprovacao' && possoAprovar(r)) { acoes.push(btn('aprovar', 'Aprovar' + (n ? ' · ' + esc(nomeNivel(r, n)) : ''), 'primario')); acoes.push(btn('recusar', 'Recusar…')); }

    ${recs.length ? `<div class="secao">Notas recebidas</div><table class="lista-mini"><thead><tr><th>NF</th><th>Emissão</th><th>Recebida em</th><th>Valor</th><th>Por</th></tr></thead><tbody>
      ${recs.map(x => `<tr><td>${esc(x.nf_numero)}${x.nf_serie ? '-' + esc(x.nf_serie) : ''}</td><td>${dataCurta(x.nf_data_emissao)}</td><td>${dataCurta(x.data_recebimento)}</td><td class="num">${reais(x.valor_nf)}</td><td>${esc(usu(x.criado_por))}</td></tr>`).join('')}</tbody></table>` : ''}
    <div class="secao">Linha do tempo</div>

/* ---------- Ações ---------- */
async function acao(r, a, motivo = null, dados = null) {
  const { data, error } = await db.rpc('pedido_compra_acao', { p_id: r.id, p_acao: a, p_motivo: motivo, p_dados: dados });
  if (error) { aviso('Não deu: ' + error.message, true); return null; }
  return data ?? true;
}
function pedirTexto(titulo, rotulo, obrig = true, botao = 'Confirmar') {
  return new Promise(res => {
    const m = abrirModal(`<h2>${esc(titulo)}</h2><div class="campo"><label>${esc(rotulo)}</label><textarea id="pt" rows="3"></textarea></div>
      <div class="acoes"><button class="btn" id="ptN">Voltar</button><button class="btn primario" id="ptS">${esc(botao)}</button></div>`);
    m.querySelector('#pt').focus();
    m.querySelector('#ptN').onclick = () => { m.remove(); res(null); };
    m.querySelector('#ptS').onclick = () => { const v = m.querySelector('#pt').value.trim(); if (obrig && !v) return aviso('Preencha o campo', true); m.remove(); res(v); };
  });
}
async function executarAcao(r, a, m) {
  if (sujo && ['liberar_avulso', 'enviar_aprovacao', 'aprovar', 'enviar_fornecedor', 'pdf', 'receber'].includes(a)) return aviso('Salve as alterações antes', true);
  const fim = txt => { aviso(txt); m.remove(); cfg.recarregar(); };
  if (a === 'enviar_aprovacao') { if (await acao(r, a)) fim('Enviado para aprovação'); }
  else if (a === 'aprovar') { const c = await pedirTexto('Aprovar ' + r.numero, 'Comentário (opcional)', false, 'Aprovar'); if (c === null) return; const s = await acao(r, a, c); if (s) fim(s === 'aprovado' ? 'Pedido aprovado · previsão lançada no contas a pagar' : 'Aprovado neste nível · segue para o próximo'); }
  else if (a === 'recusar') { const c = await pedirTexto('Recusar ' + r.numero, 'Motivo (volta para o comprador ajustar; não cancela)', true, 'Recusar'); if (c && await acao(r, a, c)) fim('Pedido recusado'); }
  else if (a === 'reabrir') { const c = await pedirTexto('Voltar ' + r.numero + ' para rascunho', 'Motivo (a aprovação será refeita)', true, 'Reabrir'); if (c && await acao(r, a, c)) fim('Pedido voltou para rascunho'); }
  else if (a === 'cancelar') { const c = await pedirTexto('Cancelar ' + r.numero, 'Motivo do cancelamento', true, 'Cancelar pedido'); if (c && await acao(r, a, c)) fim('Pedido cancelado'); }
  else if (a === 'liberar_avulso') { const c = await pedirTexto('Liberar item sem cadastro · ' + r.numero, 'Motivo (ex.: compra ocasional para manutenção, não precisa de SKU)', true, 'Liberar'); if (c && await acao(r, a, c)) fim('Item(ns) sem cadastro liberado(s)'); }
  else if (a === 'comentario') { const c = await pedirTexto('Comentário em ' + r.numero, 'Comentário', true, 'Salvar'); if (c && await acao(r, a, c)) fim('Comentário registrado'); }
  else if (a === 'encerrar') { const c = await pedirTexto('Encerrar saldo de ' + r.numero, 'Motivo (o restante não será entregue)', true, 'Encerrar'); if (!c) return;
    const { error } = await db.rpc('pedido_compra_encerrar', { p_id: r.id, p_motivo: c }); if (error) return aviso('Não deu: ' + error.message, true); fim('Saldo encerrado · projeção removida'); }
  else if (a === 'pdf') { const d = await gerarPdf(r, true); if (d) aviso('PDF gerado'); }
  else if (a === 'enviar_fornecedor') abrirEnvio(r, m);
  else if (a === 'receber') abrirRecebimento(r, m);
}

/* ---------- PDF ---------- */
function carregarScript(src) { return new Promise((ok, err) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = err; document.head.appendChild(s); }); }
async function gerarPdf(r, baixar) {
  try {
    await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
  } catch { aviso('Não carregou o gerador de PDF (internet?)', true); return null; }
  const { jsPDF } = window.jspdf, doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const emp = EMPRESAS.find(e => e.id === r.empresa_id) || {}, f = forn(r.fornecedor_id) || {}, itens = ex.itens[r.id] || [];
  const cond = CONDS.find(c => c.id === r.condicao_pagamento_id)?.nome, forma = FORMAS.find(x => x.id === r.forma_pagamento_id)?.nome;
  const aprov = (ex.eventos[r.id] || []).filter(e => e.acao === 'aprovado_nivel').map(e => `${usu(e.por)} (${dataHoraBR(e.em)})`);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.text('PEDIDO DE COMPRA ' + r.numero, 14, 16);
  doc.setFontSize(9); doc.setFont('helvetica', 'normal');
  doc.text([`${emp.nome || 'NOX'}${emp.cnpj ? ' · CNPJ ' + emp.cnpj : ''}`, `Data do pedido: ${dataCurta(r.data_pedido)}    Entrega prevista: ${dataCurta(r.data_entrega_prevista) || 'a combinar'}`], 14, 22);
  doc.setFont('helvetica', 'bold'); doc.text('Fornecedor', 14, 33); doc.setFont('helvetica', 'normal');
  doc.text([`${nomeComFantasia(f)}${f.cnpj ? ' · CNPJ ' + f.cnpj : ''}`, [r.contato_fornecedor || f.contato, r.email_fornecedor || f.email, r.whatsapp_fornecedor || f.telefone].filter(Boolean).join(' · '),
    [f.endereco, f.numero, f.bairro, f.cidade && (f.cidade + (f.uf ? '/' + f.uf : ''))].filter(Boolean).join(', ')].filter(Boolean), 14, 38);
  doc.autoTable({ startY: 52, head: [['#', 'Código', 'Descrição', 'Un', 'Qtd', 'Unitário', 'Desconto', 'Total']],
    body: itens.map((i, k) => [k + 1, i.codigo_fornecedor || prod(i.produto_id)?.codigo || '', i.descricao, i.unidade || '', num(i.quantidade), reais(i.valor_unitario), i.desconto ? reais(i.desconto) : '', reais(i.valor_total)]),
    styles: { fontSize: 8, cellPadding: 1.5 }, headStyles: { fillColor: [40, 40, 40] },
    columnStyles: { 0: { cellWidth: 7 }, 4: { halign: 'right' }, 5: { halign: 'right' }, 6: { halign: 'right' }, 7: { halign: 'right' } } });
  let y = doc.lastAutoTable.finalY + 6;
  const srv = itens.filter(i => i.tipo_item === 'servico_usinagem');
  if (srv.length) {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.text('Material enviado pela NOX para usinagem', 14, y); doc.setFont('helvetica', 'normal');
    doc.autoTable({ startY: y + 2, head: [['Peça', 'Material', 'Barras', 'Barra (mm)', 'Peças/barra', 'Peças a usinar']],
      body: srv.map(i => [prod(i.produto_id)?.codigo || '', i.material || '', i.barras_enviar != null ? num(i.barras_enviar) : '', i.barra_mm ? num(i.barra_mm) : '', i.pecas_por_barra ? num(i.pecas_por_barra) : '', num(i.quantidade)]),
      styles: { fontSize: 8, cellPadding: 1.5 }, headStyles: { fillColor: [90, 90, 90] }, columnStyles: { 2: { halign: 'right' }, 3: { halign: 'right' }, 4: { halign: 'right' }, 5: { halign: 'right' } } });
    y = doc.lastAutoTable.finalY + 6;
  }
  const tot = [['Itens', reais(r.valor_produtos)]]; if (Number(r.frete)) tot.push(['Frete', reais(r.frete)]); if (Number(r.outras_despesas)) tot.push(['Outras despesas', reais(r.outras_despesas)]);
  if (Number(r.desconto)) tot.push(['Desconto', '- ' + reais(r.desconto)]); tot.push(['TOTAL', reais(r.valor_total)]);
  doc.autoTable({ startY: y, body: tot, theme: 'plain', margin: { left: 130 }, styles: { fontSize: 9, cellPadding: 1 }, columnStyles: { 1: { halign: 'right', fontStyle: 'bold' } } });
  y = doc.lastAutoTable.finalY + 6;
  doc.setFontSize(9); doc.text(`Condição de pagamento: ${cond || 'a combinar'}${forma ? '    Forma: ' + forma : ''}`, 14, y); y += 6;
  if (r.observacoes) { doc.setFont('helvetica', 'bold'); doc.text('Observações', 14, y); doc.setFont('helvetica', 'normal'); const t = doc.splitTextToSize(r.observacoes, 180); doc.text(t, 14, y + 5); y += 7 + t.length * 4; }
  doc.text('Favor informar o número deste pedido na nota fiscal.', 14, y); y += 8;
  doc.setFontSize(8); doc.setTextColor(110);
  doc.text([`Comprador: ${usu(r.comprador_id) || ''}`, aprov.length ? 'Aprovado por: ' + aprov.join('; ') : ''].filter(Boolean), 14, y);
  const blob = doc.output('blob'), nome = `${r.numero}.pdf`;
  if (baixar) doc.save(nome);
  // guarda uma cópia (rastreio) e devolve o caminho
  const path = `${r.empresa_id}/${r.numero}/${r.numero}-${Date.now()}.pdf`;
  const up = await db.storage.from('compras').upload(path, blob, { contentType: 'application/pdf', upsert: false });
  if (up.error) { aviso('PDF gerado, mas não salvou cópia: ' + up.error.message, true); return { blob, path: null }; }
  await acao(r, 'pdf', null, { pdf: path });
  return { blob, path };
}

/* ---------- Envio ao fornecedor (com confirmação do comprador) ---------- */
function abrirEnvio(r, pai) {
  const f = forn(r.fornecedor_id) || {}, email = r.email_fornecedor || f.email || '', zap = (r.whatsapp_fornecedor || f.telefone || '').replace(/\D/g, '');
  const contato = r.contato_fornecedor || f.contato || '';
  const m = abrirModal(`<h2>Enviar ${esc(r.numero)} ao fornecedor</h2>
    <p class="sub" style="margin:0 0 8px">${esc(nomeComFantasia(f))} · total ${reais(r.valor_total)}. O sistema gera o PDF, cria um link seguro (válido por 30 dias) e abre o seu e-mail ou WhatsApp com a mensagem pronta. O envio fica registrado no histórico.</p>
    <div class="grade-campos">
      <div class="campo"><label>Enviar por</label><select id="eVia" data-simples><option value="whatsapp">WhatsApp</option><option value="email"${!zap && email ? ' selected' : ''}>E-mail</option></select></div>
      <div class="campo l2"><label>Para</label><input id="ePara" value="${esc(!zap && email ? email : zap)}"></div>
      <div class="campo l4"><label>Mensagem</label><textarea id="eMsg" rows="6" data-livre>Olá${contato ? ' ' + esc(contato) : ''}, tudo bem?
Segue o pedido de compra ${esc(r.numero)} da ${esc((EMPRESAS.find(e => e.id === r.empresa_id) || {}).nome || 'NOX')} no valor de ${reais(r.valor_total)}${r.data_entrega_prevista ? ', entrega prevista para ' + dataCurta(r.data_entrega_prevista) : ''}.
PDF do pedido: {link}
Por favor, confirme o recebimento e informe o número do pedido na nota fiscal. Obrigado!</textarea></div>
    </div>
    <label class="chk" style="margin:6px 0"><input type="checkbox" id="eOk"> Conferi o pedido (itens, preços, condição) e autorizo o envio ao fornecedor.</label>
    <div class="acoes"><button class="btn" id="eN">Voltar</button><button class="btn primario" id="eS">Gerar PDF e abrir para enviar</button></div>`);
  const via = m.querySelector('#eVia'), para = m.querySelector('#ePara');
  via.onchange = () => { para.value = via.value === 'email' ? email : zap; };
  m.querySelector('#eN').onclick = () => m.remove();
  m.querySelector('#eS').onclick = async () => {
    if (!m.querySelector('#eOk').checked) return aviso('Marque a confirmação de envio', true);
    const destino = para.value.trim(); if (!destino) return aviso('Informe para quem enviar', true);
    if (via.value === 'whatsapp' && destino.replace(/\D/g, '').length < 10) return aviso('WhatsApp com DDD (só números)', true);
    m.querySelector('#eS').disabled = true;
    const g = await gerarPdf(r, false); if (!g?.path) { m.querySelector('#eS').disabled = false; return; }
    const { data: s, error } = await db.storage.from('compras').createSignedUrl(g.path, 60 * 60 * 24 * 30);
    if (error) { m.querySelector('#eS').disabled = false; return aviso('Não gerou o link: ' + error.message, true); }
    const msg = m.querySelector('#eMsg').value.replace('{link}', s.signedUrl);
    const url = via.value === 'whatsapp'
      ? `https://wa.me/${destino.replace(/\D/g, '').replace(/^(?!55)/, '55')}?text=${encodeURIComponent(msg)}`
      : `mailto:${encodeURIComponent(destino)}?subject=${encodeURIComponent('Pedido de compra ' + r.numero)}&body=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
    if (await acao(r, 'enviado_fornecedor', null, { via: via.value === 'whatsapp' ? 'WhatsApp' : 'e-mail', para: destino, pdf: g.path })) {
      aviso('Envio registrado · confira a mensagem no ' + (via.value === 'whatsapp' ? 'WhatsApp' : 'e-mail') + ' e envie'); m.remove(); pai.remove(); cfg.recarregar();
    }
  };

/* ---------- Recebimento da NF ---------- */
function abrirRecebimento(r, pai) {
  const soServico = (ex.itens[r.id] || []).length > 0 && (ex.itens[r.id] || []).every(i => i.tipo_item === 'servico_usinagem'), srvIds = new Set((ex.itens[r.id] || []).filter(i => i.tipo_item === 'servico_usinagem').map(i => i.id));
  const itens = (ex.itens[r.id] || []).map(i => ({ ...i, pend: Math.max(0, Number(i.quantidade) - Number(i.quantidade_recebida)) }));
  const fatorExtra = Number(r.valor_produtos) ? (Number(r.frete) + Number(r.outras_despesas) - Number(r.desconto)) / Number(r.valor_produtos) : 0;
  const cond = CONDS.find(c => c.id === r.condicao_pagamento_id);
  const m = abrirModal(`<h2>${soServico ? 'Recebimento do serviço' : 'Recebimento da NF'} · ${esc(r.numero)}</h2>
    <div class="grade-campos">
      <div class="campo"><label>NF nº ${soServico ? '<span class="sub">(pode ficar vazio: serviço sem nota)</span>' : '<span class="obrig">*</span>'}</label><input id="rNf"></div>
      <div class="campo"><label>Série</label><input id="rSerie"></div>
      <div class="campo"><label>Emissão da NF <span class="obrig">*</span></label><input id="rEm" type="date" value="${hojeISO()}"></div>
      <div class="campo"><label>Recebida em</label><input id="rRec" type="date" value="${hojeISO()}"></div>
      <div class="campo l4"><label>Chave de acesso</label><input id="rChave" placeholder="44 dígitos (opcional)"></div>
    </div>
    <div class="sub-ed"><div class="secao">Itens recebidos${srvIds.size ? ' · peças usinadas que voltam entram no estoque (por enquanto só fica registrado no pedido; o serviço não é item de estoque)' : ''}</div><table><thead><tr><th>Item</th><th>Pedido</th><th>Já recebido</th><th>Nesta NF</th><th class="num">Valor</th></tr></thead><tbody>
      ${itens.map(i => `<tr data-item="${i.id}" data-unit="${Number(i.valor_total) / Number(i.quantidade)}"><td>${esc(i.descricao)}</td><td>${num(i.quantidade)} ${esc(i.unidade || '')}</td><td>${num(i.quantidade_recebida)}</td>
        <td style="width:90px"><input data-q inputmode="decimal" value="${num(i.pend)}"></td><td class="num" data-v></td></tr>`).join('')}</tbody></table></div>
    <div class="grade-campos" style="margin-top:6px">
      <div class="campo"><label>Valor ${soServico ? 'do serviço' : 'da NF'} (R$) <span class="obrig">*</span></label><input id="rValor" inputmode="decimal"></div>
      <div class="campo l3"><label>&nbsp;</label><div class="sub" id="rSug" style="padding-top:6px"></div></div>
    </div>
    <div class="sub-ed" id="rParc"><div class="secao">Parcelas (vão para o contas a pagar)</div><table><thead><tr><th>#</th><th>Vencimento</th><th>Valor (R$)</th><th>Código de barras (opcional)</th><th></th></tr></thead><tbody></tbody></table>
      <button type="button" class="btn fino" id="rAdd" style="margin-top:4px">+ Parcela</button> <button type="button" class="btn fino discreto" id="rRefaz">Refazer pela condição${cond ? ' (' + esc(cond.nome) + ')' : ''}</button>
      <div class="sub" id="rSoma" style="margin-top:4px"></div></div>
    <div class="acoes"><button class="btn" id="rN">Voltar</button><button class="btn primario" id="rS">Registrar recebimento</button></div>`);
  const q = s => m.querySelector(s);
  const linhaParc = (k, venc, v) => `<tr><td style="width:24px;padding-top:7px">${k}</td><td style="width:140px"><input type="date" data-venc value="${venc}"></td><td style="width:120px"><input data-val inputmode="decimal" value="${num(v)}"></td><td><input data-cb></td><td style="width:22px"><button type="button" class="rm">×</button></td></tr>`;
  let valorEditado = false;
  const somaItens = () => { let t = 0; m.querySelectorAll('[data-item]').forEach(tr => { const v = Math.round((lerNumero(tr.querySelector('[data-q]').value) || 0) * Number(tr.dataset.unit) * 100) / 100; tr.querySelector('[data-v]').textContent = reais(v); t += v; }); return t; };
  const refazParcelas = () => {
    const total = lerNumero(q('#rValor').value) || 0, dias = cond?.dias?.length ? cond.dias : [Number(forn(r.fornecedor_id)?.prazo_pagamento_dias || 0)];
    let ac = 0; q('#rParc tbody').innerHTML = dias.map((d, k) => { const v = k === dias.length - 1 ? Math.round((total - ac) * 100) / 100 : Math.round(total / dias.length * 100) / 100; ac += v; return linhaParc(k + 1, somaDias(q('#rEm').value || hojeISO(), d), v); }).join('');
    conferir();
  };
  const conferir = () => { const t = lerNumero(q('#rValor').value) || 0, s = [...m.querySelectorAll('[data-val]')].reduce((a, i) => a + (lerNumero(i.value) || 0), 0);
    q('#rSoma').innerHTML = `Soma das parcelas <b>${reais(s)}</b>${Math.abs(s - t) > 0.009 ? ` <span class="tg erro">diferente da NF (${reais(t)})</span>` : ' <span class="tg ok">confere</span>'}`; };
  const atualizar = () => { const it = somaItens(), sug = Math.round(it * (1 + fatorExtra) * 100) / 100;
    q('#rSug').textContent = `Itens desta NF ${reais(it)}${fatorExtra ? ` · com frete/despesas/desconto proporcionais ${reais(sug)}` : ''} · saldo do pedido ${reais(Number(r.valor_total) - Number(r.valor_recebido))}`;
    if (!valorEditado) { q('#rValor').value = num(sug); refazParcelas(); } };
  m.querySelectorAll('[data-q]').forEach(i => i.addEventListener('input', atualizar));
  q('#rValor').addEventListener('input', () => { valorEditado = true; refazParcelas(); });
  q('#rEm').addEventListener('change', refazParcelas);
  q('#rRefaz').onclick = refazParcelas;
  q('#rAdd').onclick = () => { const n = m.querySelectorAll('#rParc tbody tr').length + 1; q('#rParc tbody').insertAdjacentHTML('beforeend', linhaParc(n, q('#rEm').value || hojeISO(), 0)); };
  q('#rParc').addEventListener('click', e => { if (e.target.classList.contains('rm')) { e.target.closest('tr').remove(); conferir(); } });
  q('#rParc').addEventListener('input', conferir);
  atualizar();
  // NF importada e conferida na tela de Notas fiscais → preenche o recebimento (número, série, emissão, chave, valor e parcelas pelas duplicatas)
  db.from('nfe_entrada').select('id, chave, numero, serie, data_emissao, valor_total, duplicatas, situacao').eq('pedido_compra_id', r.id).in('situacao', ['conferida', 'aprovada']).then(({ data: nfs }) => {
    if (!nfs?.length) return;
    q('.grade-campos').insertAdjacentHTML('beforebegin', `<div class="campo" style="margin-bottom:8px"><label>NF conferida em Notas fiscais</label><select id="rNfe" data-simples>
      <option value="">— digitar manualmente —</option>${nfs.map(n => `<option value="${n.id}">NF ${esc(n.numero)}${n.serie ? '-' + esc(n.serie) : ''} · ${dataCurta(n.data_emissao)} · ${reais(n.valor_total)}</option>`).join('')}</select></div>`);
    q('#rNfe').onchange = e => { const n = nfs.find(x => x.id === Number(e.target.value)); if (!n) return;
      q('#rNf').value = n.numero || ''; q('#rSerie').value = n.serie || ''; q('#rEm').value = String(n.data_emissao || '').slice(0, 10); q('#rChave').value = n.chave;
      q('#rValor').value = num(n.valor_total); valorEditado = true;
      if ((n.duplicatas || []).length) { q('#rParc tbody').innerHTML = n.duplicatas.map((d, k) => linhaParc(k + 1, d.vencimento, d.valor)).join(''); conferir(); } else refazParcelas(); };
    if (nfs.length === 1) { q('#rNfe').value = nfs[0].id; q('#rNfe').onchange({ target: q('#rNfe') }); }
  });
  q('#rN').onclick = () => m.remove();
  q('#rS').onclick = async () => {
    const nf = { numero: q('#rNf').value.trim(), serie: q('#rSerie').value.trim(), data_emissao: q('#rEm').value, data_recebimento: q('#rRec').value, chave: q('#rChave').value.replace(/\D/g, ''), valor: lerNumero(q('#rValor').value) };
    const its = [...m.querySelectorAll('[data-item]')].map(tr => ({ item_id: Number(tr.dataset.item), quantidade: lerNumero(tr.querySelector('[data-q]').value) || 0 })).filter(x => x.quantidade > 0);
    const parc = [...m.querySelectorAll('#rParc tbody tr')].map(tr => ({ vencimento: tr.querySelector('[data-venc]').value, valor: lerNumero(tr.querySelector('[data-val]').value) || 0, codigo_barras: tr.querySelector('[data-cb]').value.replace(/\s/g, '') || null })).filter(p => p.valor);
    if (!its.length) return aviso('Informe a quantidade recebida de pelo menos um item', true);
    if (!nf.numero && !its.every(x => srvIds.has(x.item_id))) return aviso('Informe o número da NF', true);
    if (parc.some(p => !p.vencimento)) return aviso('Parcela sem vencimento', true);
    q('#rS').disabled = true;
    const { error } = await db.rpc('pedido_compra_receber', { p_id: r.id, p_nf: nf, p_itens: its, p_parcelas: parc });
    if (error) { q('#rS').disabled = false; return aviso('Não registrou: ' + error.message, true); }
    aviso(`${nf.numero ? 'NF ' + nf.numero : 'Serviço'} registrado · ${parc.length} título(s) no contas a pagar`); m.remove(); pai.remove(); cfg.recarregar();
  };
}

/* ---------- Escala de aprovação (administrador) ---------- */
function abrirEscala() {
  const linha = (a = {}) => `<tr data-id="${a.id || ''}">
    <td style="width:56px"><input data-k="nivel" inputmode="numeric" value="${a.nivel ?? ''}"></td>
    <td style="width:170px"><input data-k="nome" value="${esc(a.nome || '')}" placeholder="Ex.: Gerente, Diretoria"></td>
    <td style="width:120px"><input data-k="valor_minimo" inputmode="decimal" value="${num(a.valor_minimo ?? 0)}"></td>
    <td style="width:130px"><select data-k="empresa_id" data-simples><option value="">Todas</option>${EMPRESAS.map(e => `<option value="${e.id}"${e.id === a.empresa_id ? ' selected' : ''}>${esc(e.nome)}</option>`).join('')}</select></td>
    <td><div class="aprov">${USU.map(u => `<label class="chk"><input type="checkbox" data-u="${u.id}"${(a.aprovadores || []).includes(u.id) ? ' checked' : ''}> ${esc(u.nome)}</label>`).join('')}</div></td>
    <td style="width:60px"><label class="chk"><input type="checkbox" data-k="ativo"${a.ativo === false ? '' : ' checked'}> ativo</label></td>
    <td style="width:22px"><button type="button" class="rm" style="background:none;border:0;color:var(--erro);cursor:pointer;font-size:16px">×</button></td></tr>`;
  const m = abrirModal(`<h2>Escala de aprovação de compras</h2>
    <p class="sub" style="margin:0 0 8px">O pedido passa, em ordem, por todos os níveis cujo <b>valor mínimo</b> seja menor ou igual ao total. Ex.: nível 1 Gerente a partir de R$ 0; nível 2 Diretoria a partir de R$ 5.000.
    Sem nenhum nível cadastrado, aprova quem tiver a ação "Aprovar pedidos de compra" (ou administrador). Pedidos já em aprovação mantêm a escala de quando foram enviados.</p>
    <table class="alc" style="width:100%;font-size:12.5px"><thead><tr><th>Nível</th><th>Nome</th><th>A partir de (R$)</th><th>Empresa</th><th>Quem aprova</th><th></th><th></th></tr></thead>
      <tbody>${ALC.map(linha).join('')}</tbody></table>
    <button type="button" class="btn fino" id="aAdd" style="margin-top:6px">+ Nível</button>
    <div class="acoes"><button class="btn" id="aN">Fechar</button><button class="btn primario" id="aS">Salvar escala</button></div>`);
  m.querySelector('.modal').style.maxWidth = '1000px';
  const rem = [];
  m.querySelector('#aAdd').onclick = () => m.querySelector('tbody').insertAdjacentHTML('beforeend', linha({ nivel: (Math.max(0, ...ALC.map(a => a.nivel)) || 0) + 1 }));
  m.querySelector('tbody').addEventListener('click', e => { if (e.target.classList.contains('rm')) { const tr = e.target.closest('tr'); if (tr.dataset.id) rem.push(Number(tr.dataset.id)); tr.remove(); } });
  m.querySelector('#aN').onclick = () => m.remove();
  m.querySelector('#aS').onclick = async () => {
    const rows = [...m.querySelectorAll('tbody tr')].map(tr => { const g = k => tr.querySelector(`[data-k=${k}]`);
      return { id: Number(tr.dataset.id) || undefined, nivel: parseInt(g('nivel').value), nome: g('nome').value.trim(), valor_minimo: lerNumero(g('valor_minimo').value) || 0,
        empresa_id: Number(g('empresa_id').value) || null, ativo: g('ativo').checked, aprovadores: [...tr.querySelectorAll('[data-u]:checked')].map(c => c.dataset.u), atualizado_em: new Date().toISOString() }; });
    if (rows.some(r => !(r.nivel > 0) || !r.nome)) return aviso('Cada nível precisa de número (1, 2, 3…) e nome', true);
    if (rows.some(r => r.ativo && !r.aprovadores.length)) return aviso('Marque quem aprova em cada nível ativo', true);
    for (const id of rem) { const { error } = await db.from('compras_alcadas').delete().eq('id', id); if (error) return aviso('Não salvou: ' + error.message, true); }
    for (const r of rows) {
      const { id, ...d } = r;
      const { error } = id ? await db.from('compras_alcadas').update(d).eq('id', id) : await db.from('compras_alcadas').insert(d);
      if (error) return aviso('Não salvou: ' + error.message, true);
    }
    aviso('Escala salva'); m.remove(); cfg.recarregar();
  };
}

/* ---------- Alertas (topo da tela) ---------- */
/* ---------- Sugestão de compra (produtos abaixo do estoque mínimo) ---------- */
let SUG = [];
function abrirSugestao() {
  const semInv = SUG.some(x => !x.inventariado);
  const grupos = {}; SUG.forEach(x => (grupos[x.fornecedor_id || 0] ||= []).push(x));
  const m = abrirModal(`<h2>Sugestão de compra</h2>
    <p class="sub" style="margin:0 0 6px">Produtos com estoque abaixo do mínimo (cadastro do produto), já descontando o que está em pedido. Marque, ajuste a quantidade e gere os pedidos em rascunho — um por fornecedor.</p>
    ${semInv ? '<div class="aviso-box">Estoque ainda <b>não apurado</b> (sem inventário) em parte dos itens: a sugestão considera saldo zero. A compra continua livre para qualquer produto.</div>' : ''}
    ${!SUG.length ? '<p class="sub">Nenhum produto abaixo do mínimo. Para entrar aqui, o produto precisa ter <b>estoque mínimo</b> no cadastro.</p>' : `
    <div class="campo" style="max-width:280px"><label>Empresa dos pedidos</label><select id="sgEmp" data-simples>${EMPRESAS.map(e => `<option value="${e.id}"${e.id === (CTX.empresa || EMPRESAS[0]?.id) ? ' selected' : ''}>${esc(e.nome)}</option>`).join('')}</select></div>
    <div class="sub-ed" style="max-height:52vh;overflow:auto"><table><thead><tr><th></th><th>Produto</th><th class="num">Saldo</th><th class="num">Mínimo</th><th class="num">Em pedido</th><th>Comprar</th><th>Último preço</th></tr></thead><tbody>
    ${Object.entries(grupos).map(([fid, ls]) => `<tr><td colspan="7" style="padding-top:8px"><b>${esc(nomeComFantasia(forn(Number(fid))) || 'Sem fornecedor definido')}</b></td></tr>
      ${ls.map(x => `<tr data-p="${x.produto_id}" data-f="${fid}"><td><input type="checkbox" data-ok checked></td><td>${esc((x.codigo || '') + ' · ' + x.descricao)}${x.inventariado ? '' : ' <span class="tg alerta">não apurado</span>'}</td>
        <td class="num">${num(x.saldo)} ${esc(x.unidade || '')}</td><td class="num">${num(x.minimo)}</td><td class="num">${num(x.em_pedido)}</td>
        <td style="width:120px"><input data-q inputmode="decimal" value="${num(x.sugerido_compra)}"> <small>${esc(x.unidade_compra || '')}</small></td>
        <td>${x.ultimo_preco ? `${reais(x.ultimo_preco)} <small class="sub">${esc(x.ultimo_pedido || '')} · ${dataCurta(x.ultima_compra)}</small>` : '<span class="sub">—</span>'}</td></tr>`).join('')}`).join('')}
    </tbody></table></div>`}
    <div class="acoes"><button class="btn" id="sgN">Fechar</button>${SUG.length ? '<button class="btn primario" id="sgS">Gerar pedidos em rascunho</button>' : ''}</div>`);
  m.querySelector('.modal').style.maxWidth = '980px';
  m.querySelector('#sgN').onclick = () => m.remove();
  m.querySelector('#sgS')?.addEventListener('click', async () => {
    const emp = Number(m.querySelector('#sgEmp').value), sel = [...m.querySelectorAll('tr[data-p]')].filter(tr => tr.querySelector('[data-ok]').checked)
      .map(tr => ({ x: SUG.find(s => s.produto_id === Number(tr.dataset.p)), f: Number(tr.dataset.f), q: lerNumero(tr.querySelector('[data-q]').value) || 0 })).filter(i => i.q > 0);
    if (!sel.length) return aviso('Marque ao menos um produto com quantidade', true);
    if (sel.some(i => !i.f)) return aviso('Há produto sem fornecedor definido: desmarque-o ou crie o pedido manualmente', true);
    m.querySelector('#sgS').disabled = true;
    const porF = {}; sel.forEach(i => (porF[i.f] ||= []).push(i));
    let n = 0; const erros = [];
    for (const [fid, its] of Object.entries(porF)) {
      const { error } = await db.rpc('pedido_compra_salvar', { p_pedido: { empresa_id: emp, fornecedor_id: Number(fid), observacoes_internas: 'Gerado pela sugestão de compra (abaixo do estoque mínimo)' },
        p_itens: its.map(i => ({ produto_id: i.x.produto_id, descricao: i.x.descricao, unidade: i.x.unidade_compra, quantidade: i.q, valor_unitario: i.x.ultimo_preco || 0, categoria_financeira_id: i.x.categoria_financeira_id })) });
      if (error) erros.push(`${nomeComFantasia(forn(Number(fid)))}: ${error.message}`); else n++;
    }
    aviso(`${n} pedido(s) em rascunho criado(s) — confira preços e envie para aprovação` + (erros.length ? ` · erro: ${erros.join(' | ')}` : ''), !!erros.length);
    m.remove(); cfg.recarregar();
  });
}

function desenharAlertas(linhas) {
  let box = document.getElementById('pcAlertas');
  if (!box) { const alvo = document.querySelector('#cAbas')?.closest('div')?.parentElement || document.querySelector('#conteudo'); box = document.createElement('div'); box.id = 'pcAlertas'; box.className = 'pc-alertas'; alvo.parentElement.insertBefore(box, alvo); }
  const hoje = hojeISO(), emp = CTX.empresa;
  const ls = linhas.filter(r => (!emp || r.empresa_id === emp) && r.origem !== 'tiny');   // ordens do Tiny ficam fora dos alertas
  const a = [
    { aba: 'minha', n: ls.filter(possoAprovar).length, t: 'aguardando a sua aprovação', cls: 'erro' },
    { acao: 'sugestao', n: SUG.length, t: 'produto(s) abaixo do estoque mínimo · sugestão de compra', cls: 'alerta' },
    ...(possoLiberar() ? [{ aba: 'liberar', n: ls.filter(r => EDITAVEL.includes(r.situacao) && avulsosPendentes(r).length).length, t: 'com item sem cadastro para liberar', cls: 'erro' }] : []),
    { aba: 'recusados', n: ls.filter(r => r.situacao === 'recusado').length, t: 'recusado(s) para ajustar', cls: 'erro' },
    { aba: 'aprovacao', n: ls.filter(r => r.situacao === 'em_aprovacao').length, t: 'em aprovação', cls: 'alerta' },
    { aba: 'enviar', n: ls.filter(r => r.situacao === 'aprovado').length, t: 'aprovado(s) sem envio ao fornecedor', cls: 'alerta' },
    { aba: 'atrasados', n: ls.filter(r => ['enviado', 'recebido_parcial', 'aprovado'].includes(r.situacao) && r.data_entrega_prevista && r.data_entrega_prevista < hoje).length, t: 'com entrega atrasada', cls: 'erro' },
    { aba: 'receber', n: ls.filter(r => ['enviado', 'recebido_parcial'].includes(r.situacao)).length, t: 'aguardando entrega/NF', cls: 'info' }
  ].filter(x => x.n);
  box.innerHTML = a.map(x => `<button type="button" class="${x.cls}" ${x.acao ? `data-acao="${x.acao}"` : `data-aba="${x.aba}"`}><b>${x.n}</b> ${esc(x.t)}</button>`).join('');
  box.querySelector('[data-acao=sugestao]')?.addEventListener('click', abrirSugestao);
  if (CTX.pode('compras', 'criar') && !document.getElementById('btnSugestao')) {
    const novo = document.getElementById('cNovo'), b = document.createElement('button');
    b.className = 'btn'; b.id = 'btnSugestao'; b.textContent = 'Sugestão de compra'; b.onclick = abrirSugestao;
    (novo?.parentElement || box).insertBefore(b, novo || null);
  }
  box.querySelectorAll('[data-aba]').forEach(b => b.onclick = () => document.querySelector(`#cAbas [data-v="${b.dataset.aba}"]`)?.click());
  if (CTX.admin && !document.getElementById('btnEscala')) {
    const novo = document.getElementById('cNovo'), b = document.createElement('button');
    b.className = 'btn'; b.id = 'btnEscala'; b.textContent = 'Escala de aprovação'; b.onclick = abrirEscala;
    (novo?.parentElement || box).insertBefore(b, novo || null);
  }
}

const cfg = {
  textoNovo: '+ Novo pedido',
  tabela: 'pedidos_compra', modulo: 'compras', titulo: 'Pedidos de compra', singular: 'pedido', plural: 'pedidos',
  subtitulo: 'Pedido → aprovação (escala por valor) → envio ao fornecedor → recebimento da NF. Aprovado já entra no contas a pagar e no fluxo como previsão.',
  dicaBusca: 'nº do pedido, fornecedor, item, NF…', ordem: 'data_pedido', revisao: false, porEmpresa: true,
  abas: { campo: 'situacao', padrao: 'andamento', opcoes: [
    { v: 'andamento', n: 'Em andamento', teste: r => !FINAL.includes(r.situacao) && r.origem !== 'tiny' },
    { v: 'minha', n: 'Minha aprovação', teste: r => possoAprovar(r) },
    { v: 'aprovacao', n: 'Em aprovação', teste: r => r.situacao === 'em_aprovacao' },
    { v: 'liberar', n: 'Item sem cadastro', teste: r => EDITAVEL.includes(r.situacao) && avulsosPendentes(r).length > 0 },
    { v: 'recusados', n: 'Recusados', teste: r => r.situacao === 'recusado' },
    { v: 'pendencia', n: '⚠ Com pendência', teste: r => !FINAL.includes(r.situacao) && r.origem !== 'tiny' && [...(r._pend || [])].some(x => x !== 'nao_revisado') },
    { v: 'enviar', n: 'Para enviar', teste: r => r.situacao === 'aprovado' },
    { v: 'receber', n: 'Aguardando entrega', teste: r => ['enviado', 'recebido_parcial'].includes(r.situacao) },
    { v: 'atrasados', n: 'Atrasados', teste: r => ['enviado', 'recebido_parcial', 'aprovado'].includes(r.situacao) && r.data_entrega_prevista && r.data_entrega_prevista < hojeISO() },
    { v: 'historico', n: 'Histórico (recebidos e cancelados)', teste: r => FINAL.includes(r.situacao) },
    { v: 'tiny', n: 'Do Tiny', teste: r => r.origem === 'tiny' },
    { v: '', n: 'Todos' }] },
  totais: ['valor_total'],
  valorTotal: (r, c) => r.situacao === 'cancelado' ? 0 : r[c],
  ordenarPor: { data_pedido: r => String(9e15 - Date.parse(r.data_pedido)) + String(1e12 - r.id).padStart(13, '0') },
  periodos: [{ campo: 'data_pedido', label: 'Data do pedido' }, { campo: 'data_entrega_prevista', label: 'Entrega prevista' }, { campo: 'criado_em', label: 'Lançamento no sistema' }],
  campos: [
    { id: 'numero', label: 'Nº', somenteLeitura: true, lista: true,
      listaHtml: r => r.origem === 'tiny' ? `<span class="tg alerta" title="Ordem de compra feita no Tiny (${esc(r.numero)} no sistema)">TINY ${esc(r.numero_tiny || '')}</span>` : esc(r.numero || '') },
    { id: 'data_pedido', label: 'Data', tipo: 'data', obrig: true, lista: true, padrao: () => hojeISO() },
    { id: 'empresa_id', label: 'Empresa (CNPJ)', tipo: 'empresa', obrig: true, lista: true, opcoes: ctx => ctx.empresas.map(e => ({ v: e.id, n: e.nome })), padrao: ctx => ctx.empresa || ctx.empresas[0]?.id },
    { id: 'situacao', label: 'Situação', tipo: 'select', opcoes: SIT, somenteLeitura: true, lista: true, filtro: true, padrao: 'rascunho',
      listaHtml: r => `<span class="tg ${sit(r.situacao).cor}">${esc(sit(r.situacao).n)}</span>${r.situacao === 'em_aprovacao' && possoAprovar(r) ? ' <span class="tg erro">sua vez</span>' : ''}` },
    { id: 'fornecedor_id', label: 'Fornecedor', tipo: 'select', obrig: true, col: 2, lista: true, filtro: true, opcoes: () => FORN.filter(f => f.situacao === 'ativo').map(f => ({ v: f.id, n: nomeComFantasia(f) })),
      listaHtml: r => `<span class="texto-curto" title="${esc(nomeComFantasia(forn(r.fornecedor_id)))}">${esc(nomeComFantasia(forn(r.fornecedor_id)))}</span>` },
    { id: 'data_entrega_prevista', label: 'Entrega prevista', tipo: 'data', lista: true },
    { id: 'valor_total', label: 'Total (R$)', tipo: 'moeda', somenteLeitura: true, lista: true },
    { id: 'condicao_pagamento_id', label: 'Condição de pagamento', tipo: 'select', opcoes: () => CONDS.map(c => ({ v: c.id, n: c.nome })), ajuda: 'Gera as parcelas previstas e as da NF. Sem condição: prazo padrão do fornecedor.' },
    { id: 'forma_pagamento_id', label: 'Forma de pagamento', tipo: 'select', opcoes: () => FORMAS.map(f => ({ v: f.id, n: f.nome })) },
    { id: 'conta_bancaria_id', label: 'Conta prevista (pagar)', tipo: 'select', opcoes: () => CONTAS.map(c => ({ v: c.id, n: c.descricao })) },
    { id: 'frete', label: 'Frete (R$)', tipo: 'moeda', secao: 'Valores' },
    { id: 'outras_despesas', label: 'Outras despesas (R$)', tipo: 'moeda' },
    { id: 'desconto', label: 'Desconto no pedido (R$)', tipo: 'moeda' },
    { id: 'contato_fornecedor', label: 'Contato no fornecedor', secao: 'Contato para envio' },
    { id: 'email_fornecedor', label: 'E-mail', tipo: 'email' },
    { id: 'whatsapp_fornecedor', label: 'WhatsApp', tipo: 'tel' },
    { id: 'motivo_recusa', label: 'Motivo da recusa', col: 4, somenteLeitura: true, oculto: r => r.situacao !== 'recusado', secao: 'Observações' },
    { id: 'motivo_cancelamento', label: 'Motivo do cancelamento', col: 4, somenteLeitura: true, oculto: r => r.situacao !== 'cancelado' },
    { id: 'observacoes', label: 'Observações (vão no PDF para o fornecedor)', tipo: 'textarea', col: 2, secao: 'Observações' },
    { id: 'observacoes_internas', label: 'Observações internas', tipo: 'textarea', col: 2 }
  ],
  async carregarExtra(linhas, ctx) {
    CTX = ctx;
    const [f, p, c, co, fo, cb, al, it, ev, rc, ti, pf, em, us, ac, fi] = await Promise.all([
      buscarTodos(() => db.from('fornecedores').select('id, nome, nome_fantasia, cnpj, contato, telefone, email, situacao, prazo_pagamento_dias, endereco, numero, bairro, cidade, uf').order('nome')),
      buscarTodos(() => db.from('produtos').select('id, codigo, descricao, unidade, unidade_compra, categoria_financeira_id, situacao, tipo, aprovacao').order('descricao')),
      buscarTodos(() => db.from('categorias_financeiras').select('id, codigo, nome, situacao').eq('aceita_lancamento', true).eq('aprovacao', 'aprovado').order('codigo')),
      buscarTodos(() => db.from('condicoes_pagamento').select('id, nome, dias, situacao').eq('situacao', 'ativo').order('nome')),
      buscarTodos(() => db.from('formas_pagamento').select('id, nome, situacao').eq('situacao', 'ativo').order('nome')),
      buscarTodos(() => db.from('contas_bancarias').select('id, descricao, empresa_id, situacao, tipo').eq('situacao', 'ativo').order('descricao')),
      buscarTodos(() => db.from('compras_alcadas').select('*').order('nivel')),
      buscarTodos(() => db.from('pedidos_compra_itens').select('*').order('id')),
      buscarTodos(() => db.from('pedidos_compra_eventos').select('*').order('id')),
      buscarTodos(() => db.from('pedidos_compra_recebimentos').select('*').order('id')),
      ctx.pode('pagar') ? buscarTodos(() => db.from('titulos_pagar').select('id, pedido_compra_id, documento, valor, valor_pago, situacao, data_vencimento, projecao').not('pedido_compra_id', 'is', null).order('data_vencimento')) : [],
      buscarTodos(() => db.from('produto_fornecedores').select('produto_id, fornecedor_id, codigo_fornecedor')),
      db.from('empresas').select('id, nome, cnpj'),
      db.rpc('usuarios_nomes'),
      db.rpc('minhas_acoes'),
      buscarTodos(() => db.from('produto_usinagem').select('produto_id, material, comprimento_mm, perda_mm, preco_servico, fornecedor_id'))
    ]);
    FICHAS = Object.fromEntries(fi.map(x => [x.produto_id, x]));
    SUG = ctx.pode('compras', 'criar') ? ((await db.rpc('sugestao_compra')).data || []) : [];
    FORN = f; PRODS = p.filter(x => !['acabado', 'kit'].includes(x.tipo) || true); CATS = c.map(x => ({ ...x, ativo: x.situacao === 'ativo' })); CONDS = co; FORMAS = fo;
    CONTAS = cb.filter(x => x.tipo !== 'historico'); ALC = al; PF = pf; EMPRESAS = em.data || []; USU = (us.data || []).sort((a, b) => (a.nome || '').localeCompare(b.nome || '')); ACOES = new Set(ac.data || []);
    const itens = {}, eventos = {}, recebimentos = {}, titulos = {};
    it.forEach(x => (itens[x.pedido_id] ||= []).push(x));
    ev.forEach(x => (eventos[x.pedido_id] ||= []).push(x));
    rc.forEach(x => (recebimentos[x.pedido_id] ||= []).push(x));
    ti.forEach(x => (titulos[x.pedido_compra_id] ||= []).push(x));
    ex = { itens, eventos, recebimentos, titulos, todosItens: it, porId: Object.fromEntries(linhas.map(r => [r.id, r])) };
    return ex;
  },
  depoisCarregar: linhas => { desenharAlertas(linhas);
    // ?sugestao=1 (vindo da página inicial): abre a sugestão de compra uma vez
    if (!window.__sugAberta && new URLSearchParams(location.search).get('sugestao') && SUG.length) { window.__sugAberta = true; abrirSugestao(); } },
  colunasExtras: [
    { label: 'Itens', texto: (r, e) => (e.itens[r.id] || []).map(i => `${num(i.quantidade)}× ${prod(i.produto_id)?.codigo || i.descricao}`).join(', '),
      html: (r, e) => { const l = e.itens[r.id] || [], t = l.map(i => `${num(i.quantidade)}× ${prod(i.produto_id)?.codigo || i.descricao}`).join(', ');
        return `<span class="texto-curto" style="max-width:220px" title="${esc(t)}">${esc(t)}</span>${avulsosPendentes(r).length && EDITAVEL.includes(r.situacao) ? ' <span class="tg erro">sem cadastro · liberar</span>' : l.some(i => !i.produto_id) ? ' <span class="tg neutro">avulso liberado</span>' : ''}`; } },
    { label: 'Comprador', texto: r => usu(r.comprador_id) },
    { label: 'Aprovação', texto: r => r.situacao === 'em_aprovacao' ? `${(r.niveis_aprovados || []).length}/${(r.niveis_exigidos || []).length} · ${nomeNivel(r, nivelAtual(r))}` : '' }
  ],
  textoBuscaExtra: (r, e) => [nomeComFantasia(forn(r.fornecedor_id)), ...(e.itens[r.id] || []).flatMap(i => [i.descricao, i.codigo_fornecedor, prod(i.produto_id)?.codigo]),
    ...(e.recebimentos[r.id] || []).map(x => 'NF ' + x.nf_numero)].filter(Boolean).join(' '),
  subtituloLinha: r => [r.enviado_em ? `enviado ${dataCurta(r.enviado_em)} por ${r.enviado_via || ''}` : '', Number(r.valor_recebido) ? 'recebido ' + reais(r.valor_recebido) : ''].filter(Boolean).join(' · '),
  pendencias: [
    { id: 'sem_cad', nome: 'Item sem cadastro aguardando liberação', cor: 'erro', teste: r => EDITAVEL.includes(r.situacao) && avulsosPendentes(r).length > 0 },
    { id: 'sem_cat', nome: 'Item sem categoria financeira', cor: 'erro', teste: (r, e) => !FINAL.includes(r.situacao) && (e.itens[r.id] || []).some(i => !i.categoria_financeira_id) },
    { id: 'sem_itens', nome: 'Sem itens', cor: 'erro', teste: (r, e) => r.situacao !== 'cancelado' && !(e.itens[r.id] || []).length },
    { id: 'atrasado', nome: 'Entrega atrasada', cor: 'erro', teste: r => ['enviado', 'recebido_parcial', 'aprovado'].includes(r.situacao) && r.data_entrega_prevista && r.data_entrega_prevista < hojeISO() },
    { id: 'nao_enviado', nome: 'Aprovado sem envio', cor: 'alerta', teste: r => r.situacao === 'aprovado' },
    { id: 'sem_entrega', nome: 'Sem data de entrega', cor: 'neutro', teste: r => !FINAL.includes(r.situacao) && !r.data_entrega_prevista && r.origem !== 'tiny' },
    { id: 'sem_cond', nome: 'Sem condição de pagamento', cor: 'alerta', teste: r => !FINAL.includes(r.situacao) && !r.condicao_pagamento_id && r.origem !== 'tiny' },
    { id: 'prod_sem_cat', nome: 'Produto sem categoria no cadastro', cor: 'alerta', teste: (r, e) => !FINAL.includes(r.situacao) && (e.itens[r.id] || []).some(i => i.produto_id && !prod(i.produto_id)?.categoria_financeira_id && !i.uso_consumo) }
  ],
  apagado: r => r.situacao === 'cancelado',
  aoAbrir(m, r, ctx) {
    modalAtual = m; sujo = false;
    if (r.id && r.origem !== 'tiny') mostrarPendencias(m, r);
    const editavel = !r.id || EDITAVEL.includes(r.situacao), podeEd = r.id ? ctx.pode('compras', 'alterar') : ctx.pode('compras', 'criar');
    const mostrarRec = ['aprovado', 'enviado', 'recebido_parcial', 'recebido'].includes(r.situacao);
    const box = document.createElement('div');
    box.innerHTML = `<div class="sub-ed" id="itens"><div class="secao">Itens</div><table><thead><tr><th>Produto</th><th>Un</th><th>Qtd</th><th>Unitário (R$)</th><th>Desconto</th><th>Categoria</th><th class="num">Total</th>${mostrarRec ? '<th class="num">Recebido</th>' : ''}<th></th></tr></thead>
        <tbody>${((r.id && ex.itens[r.id]) || []).map(x => linhaItem(x, mostrarRec)).join('') || (r.id ? '' : linhaItem())}</tbody></table>
        ${editavel && podeEd ? `<button type="button" class="btn fino" id="addItem" style="margin-top:4px">+ Item</button>${CTX.pode('produtos', 'criar') ? ` <a class="link-cad" data-link-cad href="${RAIZ}pages/cadastros/produtos.html?novo=1">+ cadastrar produto</a>` : ''}${Object.keys(FICHAS).length ? ' <button type="button" class="btn fino" id="addServ" style="margin-top:4px">+ Serviço de usinagem</button>' : ''}` : ''}
        <div id="matBox" style="margin-top:8px"></div>
        <div class="tot-ped" id="totPed"></div></div>`;
    const antes = [...m.querySelectorAll('.secao')].find(s => s.textContent === 'Valores');
    antes.parentNode.insertBefore(box, antes);
    if (editavel && podeEd) {
      m.querySelector('#addItem').onclick = () => { m.querySelector('#itens tbody').insertAdjacentHTML('beforeend', linhaItem()); };
      const bs = m.querySelector('#addServ'); if (bs) bs.onclick = () => { m.querySelector('#itens tbody').insertAdjacentHTML('beforeend', linhaServico()); };
      box.addEventListener('click', e => { if (e.target.classList.contains('rm')) { e.target.closest('tr').remove(); recalcular(); } });
      box.addEventListener('change', e => { if (e.target.dataset.k === 'uso_consumo') travarCategoria(e.target.closest('tr')); if (e.target.dataset.k === 'produto_id') { const tr = e.target.closest('tr'); if (tr.dataset.tipo === 'servico_usinagem') aoEscolherServico(tr, true); else aoEscolherProduto(tr); } recalcular(); });
      box.addEventListener('input', recalcular);
      ['frete', 'outras_despesas', 'desconto'].forEach(id => m.querySelector('#f_' + id)?.addEventListener('input', recalcular));
      // fornecedor → contato, e-mail e WhatsApp do cadastro
      m.querySelector('#f_fornecedor_id')?.addEventListener('change', e => { const f = forn(Number(e.target.value)); if (!f) return;
        [['contato_fornecedor', f.contato], ['email_fornecedor', f.email], ['whatsapp_fornecedor', f.telefone]].forEach(([k, v]) => { const el = m.querySelector('#f_' + k); if (el && !el.value && v) el.value = v; }); });
    } else {
      box.querySelectorAll('input, select, button.rm').forEach(i => i.disabled = true);
      // depois de aprovado só contato, entrega e observações internas mudam
      if (r.id) m.querySelectorAll('.campo input, .campo select, .campo textarea').forEach(i => {
        if (!['f_contato_fornecedor', 'f_email_fornecedor', 'f_whatsapp_fornecedor', 'f_observacoes_internas', 'f_data_entrega_prevista'].includes(i.id) || FINAL.includes(r.situacao)) i.disabled = true; });
    }
    m.querySelectorAll('.campo input, .campo select, .campo textarea, #itens input, #itens select').forEach(i => i.addEventListener('input', () => { sujo = true; }));
    recalcular();
    m.querySelectorAll('[data-pc]').forEach(b => b.onclick = () => executarAcao(r, b.dataset.pc, m));
  },
  secaoExtra: r => secaoPedido(r),
  antesSalvar: (d, r) => {
    ['fornecedor_id', 'condicao_pagamento_id', 'forma_pagamento_id', 'conta_bancaria_id', 'empresa_id'].forEach(k => { if (d[k]) d[k] = Number(d[k]); });
    ['frete', 'outras_despesas', 'desconto'].forEach(k => d[k] = d[k] || 0);
    delete d.numero; delete d.situacao; delete d.valor_total; delete d.motivo_recusa; delete d.motivo_cancelamento;
  },
  validar: (d, r) => {
    if (r.id && !EDITAVEL.includes(r.situacao)) return null;
    const itens = lerItens();
    if (!itens.length) return 'Inclua pelo menos um item';
    if (itens.some(i => !(i.quantidade > 0))) return 'Item com quantidade zerada';
    if (itens.some(i => !i.produto_id && !i.descricao)) return 'Item sem cadastro precisa de descrição';
    if (itens.some(i => i.tipo_item === 'servico_usinagem' && !i.produto_id)) return 'Serviço de usinagem: escolha a peça que volta usinada';
    const c = CONTAS.find(x => x.id === d.conta_bancaria_id); if (c && c.empresa_id !== d.empresa_id) return 'A conta prevista é de outra empresa';
    return null;
  },
  async salvar(dados, r, m, novo) {
    const editavel = novo || EDITAVEL.includes(r.situacao);
    const { data, error } = await db.rpc('pedido_compra_salvar', { p_pedido: { ...dados, id: novo ? null : r.id }, p_itens: editavel ? lerItens() : null });
    if (error) throw error;
    sujo = false;
    if (editavel && lerItens().some(i => !i.categoria_financeira_id)) setTimeout(() => aviso('Rascunho salvo com pendência: item sem categoria financeira (precisa antes de enviar para aprovação)', true), 600);
    return data;
  },
  // Voltou do "+ cadastrar": refaz a lista de produtos de cada item sem perder o que foi escolhido
  aoRecarregarListas(m) {
    m.querySelectorAll('[data-k=produto_id]').forEach(sel => { const v = sel.value; sel.innerHTML = optProds(Number(v) || null); sel.value = v; });
  },
  tituloRegistro: r => `${r.origem === 'tiny' ? 'TINY ' + r.numero_tiny + ' (' + r.numero + ')' : r.numero} · ${nomeComFantasia(forn(r.fornecedor_id))}`,
  chaveHistorico: r => r.numero
};
montarCadastro(cfg);
</script>
</body>
</html>
