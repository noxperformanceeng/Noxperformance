<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedidos de venda · NOX ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css?v=202610302013">
<style>
  .tot-ped { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; margin-top: 8px; }
  .tot-ped b { font-variant-numeric: tabular-nums; }
  .acoes-ped { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .sub-ed .ro { color: var(--texto-suave); font-size: 12px; }
</style>
</head>
<body data-modulo="pedidos" data-titulo="Pedidos de venda" data-empresa="sim">
<main id="conteudo"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../assets/js/supabase.js?v=202610302013"></script>
<script src="../../assets/js/ui.js?v=202610302013"></script>
<script src="../../assets/js/auth.js?v=202610302013"></script>
<script src="../../assets/js/layout.js?v=202610302013"></script>
<script src="../../assets/js/cadastro.js?v=202610302013"></script>
<script>
/* =====================================================================
   Pedidos de venda — uma lista só para marketplace e distribuidores
   - Marketplace: o pedido chega pela importação/integração, com nº da venda, pacote, envio e as tarifas
     separadas. Daqui se abre a venda direto na plataforma.
   - Distribuidor/venda direta: digitado pelo atendimento, com condição de pagamento.
   - "Gerar títulos a receber" leva o pedido para o financeiro (marketplace: valor líquido com a composição
     receita − tarifas; distribuidor: parcelas pela condição).
   - A NF continua sendo emitida no Tiny; número, série e chave ficam no pedido.
   ===================================================================== */
const SIT = [{ v: 'orcamento', n: 'Orçamento' }, { v: 'aberto', n: 'Aberto' }, { v: 'faturado', n: 'Faturado (NF)' }, { v: 'enviado', n: 'Enviado' },
  { v: 'entregue', n: 'Entregue' }, { v: 'devolvido', n: 'Devolvido' }, { v: 'cancelado', n: 'Cancelado' }];
const TIPOS = [{ v: 'marketplace', n: 'Marketplace' }, { v: 'distribuidor', n: 'Distribuidor' }, { v: 'direta', n: 'Venda direta' }];
const ETAPAS = [{ v: 'aguardando_pagamento', n: 'Aguardando pagamento' }, { v: 'pago', n: 'Pago' }, { v: 'pronto_envio', n: 'Pronto para envio' }, { v: 'enviado', n: 'Enviado' },
  { v: 'entregue', n: 'Entregue' }, { v: 'nao_entregue', n: 'Não entregue' }, { v: 'devolvido', n: 'Devolvido' }, { v: 'cancelado', n: 'Cancelado' }];
const LOG = [{ v: 'full', n: 'Full' }, { v: 'flex', n: 'Flex' }, { v: 'coleta', n: 'Coleta' }, { v: 'agencia', n: 'Agência' }, { v: 'correios', n: 'Correios' },
  { v: 'transportadora', n: 'Transportadora' }, { v: 'retira', n: 'Retira' }, { v: 'outro', n: 'Outro' }];
const reais = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const num2 = v => v == null || v === '' ? '' : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
let CANAIS = [], CLIENTES = [], PRODS = [], CATS = [], TIPOS_ENC = [], CONDS = [], FORMAS = [], ACOES = new Set(), modalAtual = null, ex = {};
const canal = id => CANAIS.find(c => c.id === id);
const cli = id => CLIENTES.find(c => c.id === id);
const prod = id => PRODS.find(p => p.id === id);
const cat = id => CATS.find(c => c.id === id);
const linkVenda = r => { const c = canal(r.canal_id); if (!c?.link_pedido || !r.numero_externo) return null;
  return c.link_pedido.replace('{pedido}', encodeURIComponent(r.numero_externo)).replace('{pack}', encodeURIComponent(r.pack_id || r.numero_externo)).replace('{envio}', encodeURIComponent(r.envio_id || '')); };
const linkEnvio = r => { const c = canal(r.canal_id); if (!c?.link_envio || !(r.envio_id || r.codigo_rastreio)) return null;
  return c.link_envio.replace('{envio}', encodeURIComponent(r.envio_id || '')).replace('{rastreio}', encodeURIComponent(r.codigo_rastreio || '')); };
const recebStatus = (r, e) => { const ts = (e.titulos[r.id] || []).filter(t => t.situacao !== 'cancelado');
  if (!ts.length) return ''; if (ts.every(t => t.situacao === 'recebido')) return 'recebido';
  return ts.some(t => Number(t.valor_recebido) > 0) ? 'parcial' : 'a receber'; };

/* ---------- Itens ---------- */
const optProds = sel => '<option value="">— produto —</option>' + PRODS.filter(p => p.situacao === 'ativo' && (p.aprovacao || 'aprovado') === 'aprovado' || p.id === sel)
  .map(p => `<option value="${p.id}"${p.id === sel ? ' selected' : ''}>${esc((p.codigo || '—') + ' · ' + p.descricao)}</option>`).join('');
const linhaItem = (x = {}) => `<tr data-id="${x.id || ''}" data-anuncio-ref="${x.anuncio_ref || ''}" data-anuncio="${esc(x.anuncio_id || '')}" data-variacao="${esc(x.variacao_id || '')}" data-sku="${esc(x.sku || '')}" data-desc="${esc(x.descricao || '')}">
  <td><select data-k="produto_id">${optProds(x.produto_id)}</select>${x.anuncio_id || x.sku ? `<div class="ro">${esc([x.anuncio_id, x.variacao_id, x.sku && 'SKU ' + x.sku, x.descricao].filter(Boolean).join(' · '))}</div>` : ''}</td>
  <td style="width:80px"><input data-k="quantidade" inputmode="decimal" value="${num2(x.quantidade ?? 1)}"></td>
  <td style="width:110px"><input data-k="valor_unitario" inputmode="decimal" value="${num2(x.valor_unitario)}"></td>
  <td style="width:90px"><input data-k="desconto" inputmode="decimal" value="${x.desconto ? num2(x.desconto) : ''}" placeholder="0,00"></td>
  <td style="width:100px" class="num" data-k="total"></td>
  <td style="width:28px"><button type="button" class="rm" title="Remover">×</button></td></tr>`;
function lerItens() {
  return [...(modalAtual?.querySelectorAll('#itens tbody tr') || [])].map(tr => ({
    id: Number(tr.dataset.id) || null, produto_id: Number(tr.querySelector('[data-k=produto_id]').value) || null, anuncio_ref: Number(tr.dataset.anuncioRef) || null,
    anuncio_id: tr.dataset.anuncio || null, variacao_id: tr.dataset.variacao || null, sku: tr.dataset.sku || null, descricao: tr.dataset.desc || null,
    quantidade: lerNumero(tr.querySelector('[data-k=quantidade]').value) || 0, valor_unitario: lerNumero(tr.querySelector('[data-k=valor_unitario]').value) || 0,
    desconto: lerNumero(tr.querySelector('[data-k=desconto]').value) || 0 })).filter(x => x.produto_id || x.quantidade && x.valor_unitario || x.anuncio_id || x.sku);
}

/* ---------- Encargos (tarifas, envio, comissão…) ---------- */
const tiposDoCanal = canalId => { const p = canal(canalId)?.plataforma; return TIPOS_ENC.filter(t => t.situacao === 'ativo' && (t.plataforma === p || t.plataforma === 'geral') && !t.codigo.startsWith('diferenca_') && t.codigo !== 'frete_cliente'); };
const linhaEnc = (x = {}, canalId) => `<tr>
  <td><select data-k="tipo_codigo"><option value="">— tipo —</option>${tiposDoCanal(canalId).map(t => `<option value="${esc(t.codigo)}" data-cat="${t.categoria_financeira_id || ''}"${t.codigo === x.tipo_codigo ? ' selected' : ''}>${esc(t.nome)}</option>`).join('')}</select></td>
  <td><select data-k="categoria_financeira_id"><option value="">— categoria —</option>${CATS.map(c => `<option value="${c.id}"${c.id === x.categoria_financeira_id ? ' selected' : ''}>${esc(c.codigo + ' ' + c.nome)}</option>`).join('')}</select></td>
  <td style="width:120px"><input data-k="valor" inputmode="decimal" value="${num2(x.valor)}"></td>
  <td style="width:28px"><button type="button" class="rm" title="Remover">×</button></td></tr>`;
function lerEncargos() {
  return [...(modalAtual?.querySelectorAll('#encargos tbody tr') || [])].map(tr => {
    const s = tr.querySelector('[data-k=tipo_codigo]');
    return { tipo_codigo: s.value || null, descricao: s.value ? s.selectedOptions[0].textContent : null,
      categoria_financeira_id: Number(tr.querySelector('[data-k=categoria_financeira_id]').value) || null, valor: lerNumero(tr.querySelector('[data-k=valor]').value) || 0 };
  }).filter(x => x.valor);
}

function recalcular() {
  if (!modalAtual) return;
  let prodT = 0;
  modalAtual.querySelectorAll('#itens tbody tr').forEach(tr => {
    const q = lerNumero(tr.querySelector('[data-k=quantidade]').value) || 0, u = lerNumero(tr.querySelector('[data-k=valor_unitario]').value) || 0, d = lerNumero(tr.querySelector('[data-k=desconto]').value) || 0;
    const t = Math.round((q * u - d) * 100) / 100; prodT += t; tr.querySelector('[data-k=total]').textContent = reais(t);
  });
  const v = id => lerNumero(modalAtual.querySelector('#f_' + id)?.value) || 0;
  const total = prodT - v('desconto') + v('frete_cliente') + v('outras_receitas');
  const enc = lerEncargos().reduce((s, x) => s + x.valor, 0);
  modalAtual.querySelector('#totPed').innerHTML = `<span>Produtos <b>${reais(prodT)}</b></span><span>Total do pedido <b>${reais(total)}</b></span>
    <span>Tarifas/encargos <b class="${enc ? 'valor-neg' : ''}">${enc ? '− ' + reais(enc) : reais(0)}</b></span><span>Líquido a receber <b>${reais(total - enc)}</b></span>`;
}

/* ---------- Rastreio e financeiro do pedido ---------- */
function secaoPedido(r) {
  const ts = (ex.titulos[r.id] || []), lv = linkVenda(r), le = linkEnvio(r);
  const etapa = (ok, t) => `<span class="${ok ? 'ok' : ''}">${esc(t)}</span>`;
  const ativos = ts.filter(t => t.situacao !== 'cancelado');
  return secaoEntregas(r) + `<div class="secao">Rastreio</div>
    <div class="rastreio">${etapa(true, (canal(r.canal_id)?.nome || 'Pedido') + (r.numero_externo ? ' · ' + r.numero_externo : ''))}<i>›</i>${etapa(r.nf_numero, r.nf_numero ? 'NF ' + r.nf_numero : 'NF (Tiny)')}<i>›</i>
      ${etapa(r.data_envio || ['enviado', 'entregue'].includes(r.situacao) || ['enviado', 'entregue'].includes(r.etapa), r.data_envio ? 'Enviado ' + dataCurta(r.data_envio) : 'Envio')}<i>›</i>${etapa(r.data_entrega || r.etapa === 'entregue', r.data_entrega ? 'Entregue ' + dataCurta(r.data_entrega) : r.etapa === 'devolvido' ? 'Devolvido' : 'Entrega')}<i>›</i>${etapa(ativos.length, 'Título a receber')}<i>›</i>
      ${etapa(ativos.length && ativos.every(t => t.situacao === 'recebido'), 'Recebido')}<i>›</i>${etapa(ativos.length && ativos.every(t => ex.conciliados.has(t.id)), 'Conciliado')}</div>
    ${lv || le ? `<p style="margin:8px 0 0;font-size:13px">${lv ? `<a class="ext" href="${esc(lv)}" target="_blank" rel="noopener">Abrir a venda na plataforma</a>` : ''}${le ? ` &nbsp; <a class="ext" href="${esc(le)}" target="_blank" rel="noopener">Abrir o envio</a>` : ''}</p>` : ''}
    <div class="secao">Contas a receber</div>
    ${ts.length ? `<table class="lista-mini"><thead><tr><th>Documento</th><th>Vencimento / liberação</th><th>Valor</th><th>Recebido</th><th>Situação</th></tr></thead><tbody>
      ${ts.map(t => `<tr${t.situacao === 'cancelado' ? ' class="estornado"' : ''}><td><a href="../financeiro/contas-receber.html?titulo=${t.id}" style="color:var(--destaque)">${esc(t.documento || '#' + t.id)}</a></td><td>${dataCurta(t.data_vencimento)}</td>
        <td class="num">${reais(t.valor)}</td><td class="num">${reais(t.valor_recebido)}</td><td>${esc(t.situacao)}</td></tr>`).join('')}</tbody></table>`
      : '<p class="sub" style="margin:0">Ainda sem título a receber.</p>'}
    <div class="acoes-ped">
      ${!ativos.length && !temEntregas(r) && !['orcamento', 'cancelado'].includes(r.situacao) && ex.podeReceber ? '<button type="button" class="btn" id="btnGerar">Gerar títulos a receber</button>' : ''}
      ${r.situacao !== 'cancelado' && ACOES.has('pedidos.cancelar') ? '<button type="button" class="btn discreto" id="btnCancelarPed">Cancelar pedido…</button>' : ''}
    </div>`;
}

/* ---------- Entregas parciais (expedição + faturamento por entrega) ---------- */
const SIT_ENT = { separar: ['Para separar', 'alerta'], separado: ['Separado', 'info'], expedido: ['Expedido', 'ok'], entregue: ['Entregue', 'ok'], cancelada: ['Cancelada', 'neutro'] };
const FAT_ENT = { pendente: ['A faturar', 'alerta'], com_nf: ['NF', 'ok'], sem_nf: ['Sem NF · NF pendente', 'erro'] };
const temEntregas = r => (ex.entregas?.[r.id] || []).some(e => e.situacao !== 'cancelada');
const unitLiq = i => Number(i.quantidade) ? Number(i.valor_total) / Number(i.quantidade) : 0;
function saldosItens(r) {
  const es = (ex.entregas[r.id] || []).filter(e => e.situacao !== 'cancelada'), usado = {}, saiu = {};
  es.forEach(e => e.itens.forEach(x => { usado[x.pedido_item_id] = (usado[x.pedido_item_id] || 0) + Number(x.quantidade);
    if (['expedido', 'entregue'].includes(e.situacao)) saiu[x.pedido_item_id] = (saiu[x.pedido_item_id] || 0) + Number(x.quantidade); }));
  return (ex.itens[r.id] || []).map(i => ({ i, emEntregas: usado[i.id] || 0, entregue: saiu[i.id] || 0, pendente: Number(i.quantidade) - (usado[i.id] || 0) }));
}
// mesma conta do banco: itens da entrega × (líquido do pedido ÷ produtos), arredondado
const valorEntrega = (r, e) => { const f = Number(r.valor_produtos) > 0 ? Number(r.valor_liquido) / Number(r.valor_produtos) : 1;
  return Math.round(e.itens.reduce((s, x) => { const i = (ex.itens[r.id] || []).find(y => y.id === x.pedido_item_id); return s + (i ? unitLiq(i) * Number(x.quantidade) : 0); }, 0) * f * 100) / 100; };
const nomeItem = i => prod(i.produto_id) ? `${prod(i.produto_id).codigo || ''} · ${prod(i.produto_id).descricao}` : (i.sku || i.descricao || '?');
function secaoEntregas(r) {
  if (r.tipo === 'marketplace') return '';
  const es = ex.entregas[r.id] || [], sd = saldosItens(r), pend = sd.reduce((s, x) => s + Math.max(0, x.pendente), 0);
  const faturadoInteiro = (ex.titulos[r.id] || []).some(t => t.situacao !== 'cancelado' && !t.pedido_venda_entrega_id && !es.some(e => e.faturamento !== 'pendente'));
  const podeNova = ex.podeEntrega && pend > 0 && !['orcamento', 'cancelado'].includes(r.situacao) && !faturadoInteiro;
  const qt = v => Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 4 });
  return `<div class="secao">Entregas ${r.entrega_parcial ? '<span class="tg info">entrega parcial habilitada</span>' : ''}</div>
    ${sd.length ? `<table class="lista-mini"><thead><tr><th>Item</th><th class="num">Pedido</th><th class="num">Em entregas</th><th class="num">Saiu</th><th class="num">Falta entregar</th></tr></thead><tbody>
      ${sd.map(x => `<tr><td>${esc(nomeItem(x.i))}</td><td class="num">${qt(x.i.quantidade)}</td><td class="num">${qt(x.emEntregas)}</td><td class="num">${qt(x.entregue)}</td>
        <td class="num">${x.pendente > 0 ? `<b>${qt(x.pendente)}</b>` : '✓'}</td></tr>`).join('')}</tbody></table>` : ''}
    ${es.length ? `<table class="lista-mini" style="margin-top:8px"><thead><tr><th>Entrega</th><th>Itens</th><th>Expedição</th><th>Faturamento</th><th class="num">Valor</th><th></th></tr></thead><tbody>
      ${es.map(e => `<tr${e.situacao === 'cancelada' ? ' class="estornado"' : ''}><td><b>${e.numero}</b> · ${e.tipo === 'envio' ? 'envio' : 'retirada'}${e.previsao ? '<br><small class="sub">prev. ' + dataCurta(e.previsao) + '</small>' : ''}</td>
        <td>${e.itens.map(x => { const i = (ex.itens[r.id] || []).find(y => y.id === x.pedido_item_id); return `${qt(x.quantidade)}× ${esc(prod(i?.produto_id)?.codigo || i?.sku || '?')}`; }).join(', ')}</td>
        <td><span class="tg ${SIT_ENT[e.situacao][1]}">${SIT_ENT[e.situacao][0]}</span>${e.recebido_por ? '<br><small class="sub">' + esc(e.recebido_por) + (e.expedido_em ? ' · ' + dataCurta(e.expedido_em) : '') + '</small>' : ''}</td>
        <td>${e.situacao === 'cancelada' ? '' : `<span class="tg ${FAT_ENT[e.faturamento][1]}">${FAT_ENT[e.faturamento][0]}${e.nf_numero ? ' ' + esc(e.nf_numero) : ''}</span>`}</td>
        <td class="num">${reais(valorEntrega(r, e))}</td>
        <td style="white-space:nowrap">${e.situacao !== 'cancelada' && ex.podeFaturar && e.faturamento === 'pendente' ? `<button type="button" class="btn fino" data-ent-fat="${e.id}">Faturar…</button>` : ''}
          ${e.faturamento === 'sem_nf' && ex.podeFaturar ? `<button type="button" class="btn fino" data-ent-nf="${e.id}">Registrar NF…</button>` : ''}
          ${['separar', 'separado'].includes(e.situacao) && e.faturamento === 'pendente' && ex.podeEntrega ? `<button type="button" class="btn fino discreto" data-ent-canc="${e.id}">Cancelar…</button>` : ''}</td></tr>`).join('')}</tbody></table>`
      : `<p class="sub" style="margin:4px 0 0">Sem entregas. ${r.entrega_parcial ? 'Crie uma entrega com os itens que vão sair agora.' : 'Para entregar parte dos itens, marque "Habilitar entrega parcial" (Envio e rastreio) e salve.'}</p>`}
    <div class="acoes-ped">${podeNova ? `<button type="button" class="btn" id="btnNovaEntrega">${r.entrega_parcial ? 'Nova entrega…' : 'Entregar tudo o que falta…'}</button>` : ''}</div>`;
}
function ligarEntregas(m, r) {
  m.querySelector('#btnNovaEntrega')?.addEventListener('click', () => abrirNovaEntrega(r, m));
  m.querySelectorAll('[data-ent-fat]').forEach(b => b.onclick = () => abrirFaturar([Number(b.dataset.entFat)], `Entrega ${(ex.entregas[r.id] || []).find(e => e.id === Number(b.dataset.entFat))?.numero} · pedido ${r.numero_externo || r.id}`,
    valorEntrega(r, ex.entregas[r.id].find(e => e.id === Number(b.dataset.entFat))), r.condicao_pagamento_id, false, m));
  m.querySelectorAll('[data-ent-nf]').forEach(b => b.onclick = () => abrirFaturar([Number(b.dataset.entNf)], 'Registrar a NF da entrega', null, null, true, m));
  m.querySelectorAll('[data-ent-canc]').forEach(b => b.onclick = async () => {
    const motivo = prompt('Motivo do cancelamento da entrega:'); if (!motivo) return;
    const { error } = await db.rpc('entrega_acao', { p_id: Number(b.dataset.entCanc), p_acao: 'cancelar', p_dados: { motivo } });
    if (error) return aviso('Não cancelou: ' + error.message, true);
    aviso('Entrega cancelada'); m.remove(); cfg.recarregar();
  });
}
function abrirNovaEntrega(r, mPed) {
  const sd = saldosItens(r).filter(x => x.pendente > 0), livre = r.entrega_parcial;
  const qt = v => Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 4 });
  const m = abrirModal(`<h2>${livre ? 'Nova entrega' : 'Entregar tudo o que falta'} · pedido ${esc(r.numero_externo || String(r.id))}</h2>
    <p class="sub" style="margin:0 0 6px">${livre ? 'Informe quanto de cada item sai nesta entrega.' : 'Sem entrega parcial: a entrega leva tudo o que falta.'} A entrega vai para a <b>Expedição</b> (sem valores) para separar e dar saída.</p>
    <div class="sub-ed"><table><thead><tr><th>Item</th><th class="num">Falta</th><th>Nesta entrega</th></tr></thead><tbody>
      ${sd.map(x => `<tr data-i="${x.i.id}"><td>${esc(nomeItem(x.i))}</td><td class="num">${qt(x.pendente)}</td><td style="width:120px"><input data-q inputmode="decimal" value="${livre ? '' : qt(x.pendente)}" placeholder="0" ${livre ? '' : 'disabled'}></td></tr>`).join('')}
    </tbody></table></div>
    <div class="grade-campos" style="margin-top:8px">
      <div class="campo l1"><label>Tipo</label><select id="neTipo" data-simples><option value="retirada">Retirada pelo cliente</option><option value="envio">Envio / transportadora</option></select></div>
      <div class="campo l1"><label>Previsão</label><input type="date" id="nePrev"></div>
      <div class="campo l2"><label>Observação para a expedição</label><input id="neObs"></div>
    </div>
    <div class="acoes"><button class="btn" id="neN">Cancelar</button><button class="btn primario" id="neS">Criar entrega</button></div>`);
  m.querySelector('#neN').onclick = () => m.remove();
  m.querySelector('#neS').onclick = async () => {
    const itens = [...m.querySelectorAll('tr[data-i]')].map(tr => ({ pedido_item_id: Number(tr.dataset.i), quantidade: lerNumero(tr.querySelector('[data-q]').value) || 0 })).filter(x => x.quantidade > 0);
    if (!itens.length) return aviso('Informe a quantidade de pelo menos um item', true);
    m.querySelector('#neS').disabled = true;
    const { error } = await db.rpc('entrega_criar', { p_pedido: r.id, p_itens: itens, p_tipo: m.querySelector('#neTipo').value,
      p_obs: m.querySelector('#neObs').value || null, p_previsao: m.querySelector('#nePrev').value || null });

}
// Faturar uma ou várias entregas (mesmo cliente e empresa), com ou sem NF; ou só registrar a NF de entrega faturada sem NF
function abrirFaturar(ids, titulo, valor, condicao, soNF, mAnterior) {
  const m = abrirModal(`<h2>${esc(titulo)}</h2>
    ${valor != null ? `<p style="margin:0 0 8px">Valor a faturar: <b>${reais(valor)}</b> <small class="sub">(${ids.length} entrega${ids.length > 1 ? 's' : ''}, proporcional ao pedido)</small></p>` : ''}
    ${soNF ? '' : `<div class="campo"><label>Como faturar</label><label class="chk"><input type="radio" name="fComo" value="nf" checked> Com NF (já emitida no Tiny)</label>
      <label class="chk"><input type="radio" name="fComo" value="sem"> Sem NF agora — gera a cobrança e fica a pendência "NF pendente"</label></div>`}
    <div class="grade-campos" id="fNF">
      <div class="campo l1"><label>NF nº *</label><input id="fNum" inputmode="numeric"></div>
      <div class="campo l1"><label>Série</label><input id="fSerie"></div>
      <div class="campo l1"><label>Emissão</label><input type="date" id="fData" value="${new Date().toLocaleDateString('sv-SE')}"></div>
      <div class="campo l4"><label>Chave de acesso</label><input id="fChave" inputmode="numeric" data-livre></div>
    </div>
    ${soNF ? '' : `<div class="campo" style="max-width:320px"><label>Condição de pagamento</label><select id="fCond" data-simples>${CONDS.map(c => `<option value="${c.id}"${c.id === condicao ? ' selected' : ''}>${esc(c.nome)}</option>`).join('')}</select></div>`}
    <div class="acoes"><button class="btn" id="fN">Cancelar</button><button class="btn primario" id="fS">${soNF ? 'Registrar NF' : 'Faturar'}</button></div>`);
  const nfBox = m.querySelector('#fNF');
  m.querySelectorAll('[name=fComo]').forEach(x => x.onchange = () => nfBox.hidden = m.querySelector('[name=fComo]:checked').value === 'sem');
  m.querySelector('#fN').onclick = () => m.remove();
  m.querySelector('#fS').onclick = async () => {
    const comNF = soNF || m.querySelector('[name=fComo]:checked').value === 'nf';
    const nf = { numero: m.querySelector('#fNum').value.trim(), serie: m.querySelector('#fSerie').value.trim(), data: m.querySelector('#fData').value, chave: m.querySelector('#fChave').value.replace(/\D/g, '') };
    if (comNF && !nf.numero) return aviso('Informe o número da NF', true);
    m.querySelector('#fS').disabled = true;
    const { data, error } = await db.rpc('entregas_faturar', { p_ids: ids, p_com_nf: comNF, p_nf: comNF ? nf : {}, p_condicao: soNF ? null : Number(m.querySelector('#fCond').value) || null });
    if (error) { m.querySelector('#fS').disabled = false; return aviso('Não faturou: ' + error.message, true); }
    aviso(soNF ? 'NF registrada no título' : `${data} título(s) a receber gerado(s)${comNF ? '' : ' · NF pendente'}`);
    m.remove(); mAnterior?.remove(); cfg.recarregar();
  };
}
// Retiradas já feitas e ainda sem cobrança, por cliente: fatura várias de uma vez quando chegar no valor
async function abrirRetiradas() {
  const { data, error } = await db.rpc('entregas_a_faturar');
  if (error) return aviso('Não carregou: ' + error.message, true);
  const ls = data || [], emp = id => (window.__ctxNox?.empresas || []).find(e => e.id === id)?.nome || '';
  const m = abrirModal(`<h2>Retiradas a faturar</h2>
    <p class="sub" style="margin:0 0 8px">Entregas que já saíram e ainda não têm cobrança, somadas por cliente. Fature quando quiser (por exemplo, ao chegar num valor): sai uma cobrança só, com ou sem NF.</p>
    ${ls.length ? `<table class="lista-mini"><thead><tr><th>Cliente</th><th>Empresa</th><th class="num">Entregas</th><th>Desde</th><th class="num">Acumulado</th><th></th></tr></thead><tbody>
      ${ls.map((x, k) => `<tr><td>${esc(x.cliente || '—')}</td><td>${esc(emp(x.empresa_id))}</td><td class="num">${x.entregas}</td><td>${dataCurta(x.desde)}</td><td class="num"><b>${reais(x.valor)}</b></td>
        <td><button type="button" class="btn fino primario" data-k="${k}">Faturar…</button></td></tr>`).join('')}</tbody></table>`
      : '<p class="sub">Nenhuma retirada pendente de faturamento.</p>'}
    <div class="acoes"><button class="btn" id="rtN">Fechar</button></div>`);
  m.querySelector('.modal').style.maxWidth = '860px';
  m.querySelector('#rtN').onclick = () => m.remove();
  m.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const x = ls[+b.dataset.k];

}

      if (!confirm('Gerar os títulos a receber deste pedido? (salve antes as alterações)')) return;
      const { data, error } = await db.rpc('gerar_titulos_pedido', { p_pedido_id: r.id });
      if (error) return aviso('Não gerou: ' + error.message, true);
      aviso(`${data} título(s) a receber gerado(s)`); m.remove(); cfg.recarregar();
    });
    m.querySelector('#btnCancelarPed')?.addEventListener('click', async () => {
      const motivo = prompt('Motivo do cancelamento:'); if (!motivo) return;
      const { error } = await db.rpc('cancelar_pedido_venda', { p_id: r.id, p_motivo: motivo });
      if (error) return aviso('Não cancelou: ' + error.message, true);
      aviso('Pedido cancelado (títulos em aberto também)'); m.remove(); cfg.recarregar();
    });
  },
  secaoExtra: r => secaoPedido(r),
  antesSalvar: (d, r) => {
    ['canal_id', 'cliente_id', 'representante_id', 'condicao_pagamento_id', 'forma_pagamento_id', 'empresa_id'].forEach(k => { if (d[k]) d[k] = Number(d[k]); });
    const fEmp = modalAtual.querySelector('#f_empresa_id'); if (fEmp?.disabled) d.empresa_id = Number(fEmp.value);
    ['desconto', 'frete_cliente', 'outras_receitas'].forEach(k => d[k] = d[k] || 0);
    if (r.situacao === 'cancelado') delete d.situacao;
  },
  validar: d => {
    const itens = lerItens(), encs = lerEncargos(), c = canal(d.canal_id);
    if (!itens.length) return 'Inclua pelo menos um item';
    if (itens.some(i => !(i.quantidade > 0))) return 'Item com quantidade zerada';
    if (d.tipo !== 'marketplace' && itens.some(i => !i.produto_id)) return 'Escolha o produto de cada item';
    if (encs.some(x => !x.categoria_financeira_id)) return 'Cada tarifa precisa de categoria';
    if (c?.empresa_id && c.empresa_id !== d.empresa_id) return 'Este canal é de outra empresa';
    if (d.tipo !== 'marketplace' && !d.cliente_id) return 'Escolha o cliente (cadastre em Clientes se for novo)';
    if (d.tipo === 'marketplace' && !d.numero_externo) return 'Informe o nº da venda na plataforma (é o que liga o extrato)';
    return null;
  },
  async salvar(dados, r, m, novo) {
    const { data, error } = await db.rpc('salvar_pedido_venda', { p_pedido: { ...dados, id: novo ? null : r.id }, p_itens: lerItens(), p_encargos: lerEncargos() });
    if (error) throw error;
    return data;
  },
  acoesLote: [
    { nome: 'Gerar títulos a receber', executar: async (sel, pronto, ctx) => {
        if (!ctx.pode('receber', 'editar')) return aviso('Sem permissão no contas a receber', true);
        const ok = sel.filter(r => !recebStatus(r, ex) && !['orcamento', 'cancelado'].includes(r.situacao));
        if (!ok.length) return aviso('Nenhum pedido selecionado está pronto (sem título, fora de orçamento/cancelado)', true);
        if (!confirm(`Gerar títulos a receber de ${ok.length} pedido(s)?`)) return;
        let n = 0, erros = [];
        for (const r of ok) { const { error } = await db.rpc('gerar_titulos_pedido', { p_pedido_id: r.id }); if (error) erros.push(`${r.numero_externo || r.id}: ${error.message}`); else n++; }
        aviso(`${n} pedido(s) com títulos gerados` + (erros.length ? ` · ${erros.length} com erro: ${erros.slice(0, 3).join(' | ')}` : ''), !!erros.length); pronto();
      } },
    { nome: 'Marcar enviado', executar: async (sel, pronto) => {
        const ok = sel.filter(r => ['aberto', 'faturado'].includes(r.situacao));
        if (!ok.length) return aviso('Selecione pedidos abertos ou faturados', true);
        const { error } = await db.from('pedidos_venda').update({ situacao: 'enviado' }).in('id', ok.map(r => r.id));
        if (error) return aviso('Não salvou: ' + error.message, true); aviso('Atualizado'); pronto();
      } }
  ],
  depoisCarregar() {
    const novo = document.getElementById('cNovo');
    if (ex.podeFaturar && !document.getElementById('btnRetiradas') && novo) {
      const b = document.createElement('button'); b.className = 'btn'; b.id = 'btnRetiradas'; b.textContent = 'Retiradas a faturar'; b.onclick = abrirRetiradas;
      novo.parentElement.insertBefore(b, novo);
    }
  },
  // Voltou do "+ cadastrar": refaz a lista de produtos de cada item sem perder o que foi escolhido
  aoRecarregarListas(m) {
    m.querySelectorAll('[data-k=produto_id]').forEach(sel => { const v = sel.value; sel.innerHTML = optProds(Number(v) || null); sel.value = v; });
  },
  tituloRegistro: r => [canal(r.canal_id)?.nome, r.numero_externo ? 'venda ' + r.numero_externo : 'pedido ' + r.id].filter(Boolean).join(' · '),
  chaveHistorico: r => r.numero_externo || r.id,
  msgDuplicado: 'Esta venda já está lançada neste canal'
};
montarCadastro(cfg);
</script>
</body>
